<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小惠同学 · 对外经济贸易大学</title>
<style>
:root{
  --line:#e2e9f5; --accent:#2f6bb0; --accent-dark:#24589a;
  --ink:#16243a; --muted:#5b7089; --soft:#eef3fb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f8fd; color:var(--ink); font-size:15px; line-height:1.6;
}
a{color:var(--accent-dark);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.side{
  width:238px;flex:0 0 238px;background:#eef3fb;border-right:1px solid var(--line);
  padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{font-size:1.02rem;font-weight:800;color:var(--ink);line-height:1.4;margin-bottom:4px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.76rem;margin-top:2px}
.nav{margin-top:18px;display:flex;flex-direction:column;gap:4px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:none;border-radius:12px;padding:10px 12px;
  font-size:.94rem;color:var(--ink);cursor:pointer;transition:.15s;
}
.nav button:hover{background:#e2ebf9}
.nav button.on{background:#2f6bb0;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(47,107,176,.25)}
.side-foot{margin-top:22px;padding-top:14px;border-top:1px solid #dbe6f6}
.who{font-size:.86rem;color:var(--muted);margin-bottom:8px}
.who b{color:var(--ink)}
.gen{font-size:.74rem;color:#8fa6c4;margin-top:10px;line-height:1.5}
.linkbtn{background:#fff;border:1px solid #dbe6f6;border-radius:999px;padding:6px 14px;
  font-size:.84rem;color:var(--ink);cursor:pointer;width:100%}
.linkbtn:hover{border-color:var(--accent);color:var(--accent-dark)}

.main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:26px 34px 70px}
.page-title{font-size:1.5rem;font-weight:800;margin:0 0 4px}
.page-sub{color:var(--muted);font-size:.88rem;margin-bottom:18px}

/* ============ 通用卡片 ============ */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 3px 14px rgba(22,36,58,.06);padding:18px 22px;margin:14px 0}
.card.tight{padding:14px 18px}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0}
h3.sec{font-size:1.12rem;margin:20px 0 8px}

/* ============ Hero ============ */
.hero{background:linear-gradient(120deg,#eef4fd 0%,#e3edfb 55%,#d8e6f8 100%);
  border:1px solid #dae6f7;border-radius:20px;padding:20px 28px}
.hero-title{font-size:1.72rem;font-weight:800;line-height:1.3}
.hero-title em{color:var(--accent-dark);font-style:normal}
.hero-sub{color:var(--muted);margin-top:4px;font-size:.9rem}

/* ============ 四个分区卡 ============ */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:6px 0 4px}
.tile{background:linear-gradient(180deg,#eef5fe 0%,#e0ecfc 100%);
  border:1px solid #cddef5;border-radius:18px;padding:20px 18px;min-height:196px;
  box-shadow:0 4px 16px rgba(47,107,176,.10);display:flex;flex-direction:column;
  transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(47,107,176,.16)}
.tile-count{font-size:2.2rem;font-weight:800;color:#2f6bb0;line-height:1.1}
.tile-unit{font-size:.9rem;font-weight:500;color:#7d9cc4;margin-left:3px}
.tile-title{font-size:1.18rem;font-weight:700;margin-top:4px}
.tile-hint{color:#7d9cc4;font-size:.84rem;margin-top:auto;padding-top:14px;text-align:center}
.tile-btn{margin-top:10px;background:#fff;border:1px solid #bcd4f2;border-radius:999px;
  color:#2f6bb0;font-weight:600;padding:8px 10px;cursor:pointer;font-size:.9rem;width:100%}
.tile-btn:hover{background:#2f6bb0;color:#fff;border-color:#2f6bb0}

/* ============ 通知卡片 ============ */
.ncard{background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 3px 12px rgba(22,36,58,.05);padding:16px 20px;margin:12px 0}
.ncard.read{opacity:.72}
.ncard h4{margin:6px 0 8px;font-size:1.02rem;line-height:1.5}
.chip{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px}
.chip.key{background:#fdeceb;color:#c0392b}
.chip.rec{background:#fff4e0;color:#b7791f}
.chip.normal{background:#eef3fb;color:#5b7089}
.chip.new{background:#e6f6ec;color:#1f8a4c}
.meta{color:#8fa6c4;font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px 14px}
.meta b{color:#5b7089;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid #dbe6f6;background:#fff;border-radius:999px;padding:6px 14px;
  font-size:.84rem;color:var(--ink);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent-dark);box-shadow:0 2px 10px rgba(47,107,176,.18)}
.btn.on{background:#2f6bb0;border-color:#2f6bb0;color:#fff}
.btn.ghost{background:#f7faff}
.body{margin-top:12px;padding:12px 14px;background:#f7faff;border:1px solid #e6eefb;
  border-radius:12px;font-size:.88rem;color:#3b4f68;white-space:pre-wrap;max-height:340px;overflow:auto}

/* ============ 提示条 ============ */
.info{background:#eef5fe;border:1px solid #d3e3f8;border-radius:14px;padding:12px 16px;
  color:#3d5a80;font-size:.88rem}
.warn{background:#fff8e6;border:1px solid #f2e0b0;border-radius:14px;padding:12px 16px;
  color:#8a6a1f;font-size:.86rem}

/* ============ 日历 ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.cal-month{font-size:1.05rem;font-weight:800}
.cal-nav{display:flex;gap:8px}
.cal-nav button{border:1px solid #dbe6f6;background:#fff;border-radius:999px;
  width:36px;height:32px;cursor:pointer;color:var(--ink);font-size:.9rem}
.cal-nav button:hover{border-color:var(--accent);color:var(--accent-dark)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:4px}
.cal-cell{height:62px;border:1px solid #e6ecf6;border-radius:10px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-weight:600;font-size:1rem;line-height:1.15}
.cal-cell span{font-size:.7em;font-weight:500;min-height:1em;opacity:.9}
.cal-head-cell{height:auto;border:none;background:transparent;color:#8fa6c4;font-size:.85em}
.cal-head-cell span{display:none}
.cal-out{color:#c8d2e0;border-color:#eef2f8}
.cal-has{background:#dbe7f8;border-color:#cddef5;color:#24589a}
.cal-today{background:#2f6bb0;border-color:#2f6bb0;color:#fff}
.cal-today span{color:#fff}
/* 可点击 + 已完成着色 */
.cal-cell.click{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.cal-cell.click:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(47,107,176,.16)}
.cal-done{background:#e2f5e9;border-color:#c3e8d2;color:#1f7a4d}
.cal-both{background:linear-gradient(100deg,#dbe7f8 0%,#dbe7f8 55%,#e2f5e9 55%,#e2f5e9 100%);
  border-color:#cbdff0;color:#24589a}
.cal-sel{box-shadow:0 0 0 2px var(--accent)}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 8px;color:#7d9cc4;font-size:.82rem}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;
  vertical-align:-1px;border:1px solid rgba(0,0,0,.06)}
/* 当天详情弹窗 */
.modal{position:fixed;inset:0;background:rgba(22,36,58,.42);z-index:9000;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:84vh;
  overflow:auto;padding:18px 22px;box-shadow:0 20px 60px rgba(22,36,58,.28)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-date{font-size:1.05rem;font-weight:800}
.modal-x{border:none;background:#eef3fb;color:#5b7089;width:32px;height:32px;border-radius:50%;
  cursor:pointer;font-size:1rem;line-height:1;flex:0 0 auto}
.modal-x:hover{background:#e2ebf8;color:var(--accent-dark)}
.day-chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.76rem;
  font-weight:700;margin:6px 6px 0 0}
.chip-pend{background:#eaf2fd;color:#24589a}
.chip-done{background:#e6f6ec;color:#1f7a4d}
.day-sec{font-weight:800;margin:16px 0 2px;padding-left:9px;border-left:3px solid var(--accent)}
.day-sec.done{border-left-color:#38a169}
.day-row{padding:7px 0;border-bottom:1px dashed #eef2f8;font-size:.92rem;line-height:1.65}
.day-row:last-child{border-bottom:none}
.day-row .sub{color:#8fa6c4;font-size:.84em}
.day-empty{color:#8fa6c4;padding:12px 0;font-size:.9rem}
.dl-group{margin-top:16px}
.dl-date{font-weight:800;font-size:.95rem}
.dl-left{color:#2f6bb0;font-weight:600;font-size:.86rem;margin-left:8px}
.dl-item{padding:6px 0 6px 2px;font-size:.92rem;border-bottom:1px dashed #eef2f8}
.dl-item:last-child{border-bottom:none}
.tag{display:inline-block;font-size:.72rem;background:#eef3fb;color:#5b7089;
  border-radius:6px;padding:1px 7px;margin-left:6px}
.note{color:#8fa6c4;font-size:.84em}

/* ============ 待办 ============ */
.form{display:grid;grid-template-columns:1.6fr .9fr;gap:12px}
.form .full{grid-column:1/-1}
label.f{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=password]{
  width:100%;border:1px solid #dbe6f6;border-radius:10px;padding:9px 12px;
  font-size:.92rem;color:var(--ink);background:#fff;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,176,.12)}
.primary{background:#2f6bb0;color:#fff;border:none;border-radius:999px;padding:10px 22px;
  font-weight:600;cursor:pointer}
.primary:hover{background:#24589a}
.todo{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed #eef2f8}
.todo:last-child{border-bottom:none}
.todo .t-title{flex:1;font-weight:600}
.todo.done .t-title{text-decoration:line-through;color:#9fb0c6;font-weight:500}
.todo .t-due{font-size:.82rem;color:#8fa6c4}
.icon{border:none;background:transparent;cursor:pointer;font-size:1rem;color:#8fa6c4;padding:4px 6px}
.icon:hover{color:var(--accent-dark)}
.grp{font-weight:800;font-size:.95rem;margin:18px 0 4px;color:#3d5a80}

/* ============ 登录 ============ */
.login-wrap{max-width:430px;margin:9vh auto 0}
.login-card{background:#fff;border:1px solid var(--line);border-radius:22px;
  box-shadow:0 10px 40px rgba(22,36,58,.10);padding:30px 30px 26px}
.login-card h1{font-size:1.4rem;margin:0 0 4px}
.login-card p.sub{color:var(--muted);font-size:.86rem;margin:0 0 20px}
.login-card .field{margin-bottom:12px}
.login-card .err{color:#c0392b;font-size:.84rem;min-height:1.2em;margin-top:6px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.quick button{border:1px solid #dbe6f6;background:#f7faff;border-radius:999px;
  padding:6px 12px;font-size:.82rem;cursor:pointer;color:#3d5a80}
.quick button:hover{border-color:var(--accent);color:var(--accent-dark)}
.demo-tip{margin-top:16px;font-size:.8rem;color:#8fa6c4;line-height:1.6}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:auto;flex:none;height:auto;position:static;border-right:none;
    border-bottom:1px solid var(--line);padding:14px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto;padding:8px 12px}
  .main{padding:18px 16px 60px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .form{grid-template-columns:1fr}
}
@media (max-width:520px){
  body{overflow-x:hidden}
  .main{padding:14px 12px 56px}
  .tiles{grid-template-columns:1fr;gap:12px}
  .tile{min-height:0;padding:16px 16px}
  .tile-count{font-size:1.8rem}
  .hero{padding:16px 18px;border-radius:16px}
  .hero-title{font-size:1.32rem}
  .card{padding:14px 16px;border-radius:16px}
  .ncard{padding:14px 14px;border-radius:14px}
  .ncard h4{font-size:.98rem}
  .login-wrap{max-width:100%;margin:6vh auto 0;padding:0 4px}
  .login-card{padding:20px 18px;border-radius:18px}
  .login-card h1{font-size:1.18rem}
  .quick button{font-size:.76rem;padding:5px 10px}
  .side{padding:12px}
  .nav button{padding:7px 10px;font-size:.86rem}
  .cal-grid{gap:4px}
  .cal-cell{height:54px}
  .form{grid-template-columns:1fr}
}
</style>
</head>

交流活动，围绕理论学习、专业发展与学生成长等主题搭建常态化交流平台，倾听学生心声、回应学生需求，促进师生深入交流与共同成长，为行政管理专业人才培养注入新的活力。"}, "portal_515107135565824": {"notice_id": "portal_515107135565824", "title": "关于举行新一轮本科教育教学审核评估整改工作推进会的通知", "source": "教师发展与教学质量评估中心", "category": "行政党务", "publish_time": "2026-10-24", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=515107135565824", "deadline": "2026-10-26", "event_time": "2026-10-27", "summary": "各单位需于10月26日12:00前确认参会名单，会议10月27日召开", "content": "各相关单位：为深入贯彻落实教育部关于本科教育教学审核评估工作的部署要求，扎实推进审核评估整改工作，学校拟召开整改工作推进会，对照专家反馈意见，对各单位填报的整改台账内容逐项研究讨论，重点研讨整改推进过程中的存疑事项。现将有关事项通知如下：一、会议时间2026年10月27日（周二）9:00-10:30二、会议地点行政楼222会议室三、参会人员：校领导；党委办公室/校长办公室、组织部/党委人才工作办公室、党委巡察工作办公室、党委宣传部、发展规划处、人力资源处/党委教师工作部、教务处、研究生院、教师发展与教学质量评估中心、学生工作部、网络安全和信息化处、校团委、招生就业处、财务处、资产管理处、科研处、国际合作交流处、创新创业中心、国际学院、图书馆、体育部、马克思主义学院、人工智能与数据科学学院、区域国别研究院主要负责人。四、会议议程（一）各牵头单位介绍整改推进情况；（二）存疑问题研究讨论；（三）党委巡察办督办；（四）校领导讲话。五、相关要求：（一）请各牵头单位提前梳理整改台账中本单位牵头事项，做好研究讨论准备。因会议时间有限，发言请重点围绕整改推进过程中发现的问题及存疑事项；各责任单位视情况、视需要可补充发言。（二）请相关单位办公室协助通知本单位领导参会。请各单位于2026年10月26日（周一）12:00前确认参会名单并发送至jszx@uibe.edu.cn。联系人：李老师64493356教师发展与教学质量评估中心2026年10月24日"}, "portal_551373638336512": {"notice_id": "portal_551373638336512", "title": "关于举办第四届“文化穿越季”茶马古道：滇藏线上的千年商贸文明——器物遗存见证西南丝路的民族交往与贸易讲座的通知", "source": "图书馆", "category": "学术活动", "publish_time": "2026-10-24", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=551373638336512", "deadline": "", "event_time": "2026-10-29", "summary": "图书馆举办茶马古道讲座，10月29日18点开讲", "content": "各位师生：为弘扬中华优秀传统文化，推动校园文化建设，对外经济贸易大学图书馆举办第四届“文化穿越季”茶马古道篇系列活动。本届活动以“茶马古道”为主题。这条世界上海拔最高的古代贸易通道，见证了农耕文明与游牧文明的交融，体现了中华民族多元一体的格局。活动结合我校学科优势，推动校地合作，依托图书馆“一带一路”文献特藏与多语种资源，打造集学术、文化、实践于一体的系列活动。本次讲座以滇藏茶马古道为核心主线，对比川藏线官方贸易与滇藏线民间商贸的差异化发展模式，从经贸视角系统解读西南茶马古道千年商贸发展脉络；通过解读马帮器物遗存的实证价值，讲解古道文物背后的商贸历史。阐述千年茶马贸易对西南地区经济发展、多民族交往交融的重要意义，挖掘古代山地民间贸易的历史价值与现实启示。讲座时间：2026年10月29日周四18：00-20:00讲座地点：图书馆109多功能厅主讲人：郑喜淑主讲人简介：郑喜淑，民族学（文化人类学）博士，中央民族大学民族博物馆研究馆员，中国文物学会民族民俗文物研究专业委员会副主任。长期从事物质文化遗产、非物质文化遗产、民族民俗文物与博物馆学研究及教学工作。图书馆2026年10月23日"}, "portal_367632747737088": {"notice_id": "portal_367632747737088", "title": "充电蓄力，解锁工作新技能——国际关系学院开展学生工作通识培训课", "source": "国际关系学院", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=367632747737088", "deadline": "", "event_time": "2026-10-08", "summary": "国际关系学院10月8日举办学生工作通识培训，学生骨干参加", "content": "2026年10月8日13点30分，对外经济贸易大学国际关系学院于求索楼302举办学生工作通识培训活动。本次活动由国际关系学院本科生辅导员柴佳琪主讲，学院团学联全体成员、各年级班委、入党积极分子及入团积极分子参与学习。（柴佳琪老师主讲）柴佳琪老师首先从基础知识模块展开培训。他强调各学生干部要明晰自身定位，了解分团委组织架构，熟悉学生干部工作要求。随后围绕活动流程开展实操教学，拆解活动前期场地物资筹备、现场拍摄记录，后期场地物资整理、报销、新闻撰写与宣传推送等环节要点。此外，培训还着重讲解学生工作交往礼仪与线上沟通规范，引导大家养成严谨细致的工作习惯。（培训现场）参训同学认真听讲记录要点，对团学工作建立了更加清晰完整的认知。本次培训帮助学生骨干补齐业务短板，提升办公素养，为后续学院团学工作有序开展筑牢根基。（集体合照）"}, "portal_364558209658880": {"notice_id": "portal_364558209658880", "title": "“长征铸魂，青春信仰”——国际关系学院2024级9月主题团日活动顺利举办", "source": "国际关系学院", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=364558209658880", "deadline": "", "event_time": "2026-09-23", "summary": "国际关系学院2024级团支部9月23日开展长征主题团日活动", "content": "为纪念中国工农红军长征胜利90周年，深入学习贯彻习近平新时代中国特色社会主义思想，传承红色基因、赓续红色血脉，引导团员青年坚定理想信念、勇担时代使命，2026年9月，国际关系学院国政2401、2402、2403团支部结合各自特色，分别开展“长征铸魂，青春信仰”“赓续长征魂·青春勇担当”“星火接力九十载，青春挺膺守团纪”主题团日活动。系列活动主题鲜明、形式多样，通过线上会议、影像学习、故事分享、纪律教育、交流研讨等形式，在重温长征历史中凝聚青春力量，展现国关学子的家国情怀与责任担当。国政2401团支部：长征铸魂，青春信仰9月23日，国政2401团支部以线上会议形式开展“长征铸魂，青春信仰”主题团日学习活动，全体团员参加，团支部书记张凌越主持。主持人带领团员系统回顾1934年10月至1936年10月红军长征历程，从战略转移、会宁会师到纵横十余省、长驱二万五千里，深刻认识长征的历史背景、关键节点和伟大意义。团员共同学习“半条被子”“金色的鱼钩”“飞夺泸定桥”等感人故事，并观看央视纪录片《长征》精选片段，在影像中感受爬雪山、过草地和遵义会议伟大转折。在“铸魂长征精神”环节，大家学习坚定信念、对党忠诚，不怕牺牲、英勇奋斗，实事求是、独立自主，顾全大局、紧密团结的核心内涵。互动讨论中，团员围绕“长征精神中哪一点最让你感动”“学习和工作中的雪山草地”“新时代青年如何走好自己的长征路”热烈交流，并结合学业、社会实践分享感悟。最后，全体团员共同诵读《七律·长征》，表示要从长征精神中汲取信仰、真理和奋进力量，在民族复兴新长征路上书写青春华章。国政2402团支部：赓续长征魂，青春勇担当2026年9月23日晚，国政2402团支部通过腾讯会议举办“赓续长征魂·青春勇担当”主题团日活动，纪念长征胜利90周年。团支部书记赵欣冉主持，13名团员线上参与，活动设“回望长征路”“感悟长征魂”“践行新使命”三个篇章。团员集体观看长征主题纪录片，回顾第五次反“围剿”失利后战略转移，重温湘江血战、四渡赤水、飞夺泸定桥、雪山草地等历程。大家了解到红军出发约8.6万人、抵达陕北仅约7千人，理想信念是不灭火种；强渡大渡河十七勇士、过草地让粮等诠释不怕牺牲，遵义会议彰显实事求是，各路红军相互策应体现团结力量。在“践行新使命”环节，团员观看红色影像并围绕“我的新时代长征路”交流，分享“学习的深水区就是雪山草地”“坚持"}, "portal_235782465519616": {"notice_id": "portal_235782465519616", "title": "广东外语外贸大学高等继续教育学院来我院调研交流", "source": "继续教育学院（高级研修学院）", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=235782465519616", "deadline": "", "event_time": "2025-10-14", "summary": "广外继续教育学院来院调研座谈，交流办学经验", "content": "10月14日，广东外语外贸大学高等继续教育学院余海波副院长（主持工作）一行莅临我院调研座谈，我院相关负责人参加会议。座谈会上，双方结合办学实际开展深度研讨，重点围绕中外合作办学项目、非学历继续教育培训等工作，相互分享实践做法，交流探讨运营管理模式。双方均表示，下一步将进一步深化校际交流合作，互学互鉴先进办学经验，互通共享优质办学资源，合力推进继续教育事业提质增效，实现高质量发展。"}, "portal_235957267333120": {"notice_id": "portal_235957267333120", "title": "中山大学继续教育学院来我院调研交流", "source": "继续教育学院（高级研修学院）", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=235957267333120", "deadline": "", "event_time": "2025-10-14", "summary": "中山大学继续教育学院来院调研座谈，交流合作办学经验", "content": "10月14日，中山大学继续教育学院院长何晓钟一行莅临我院调研座谈，我院相关负责人参加会议。座谈期间，双方紧扣办学实际开展深度交流，围绕中外合作办学、国际课程项目等重点工作，分享实操经验，研讨管理路径。双方均表示将持续拓展校际合作广度深度，互学先进理念，共享优质资源，携手赋能继续教育高质量发展。"}, "portal_236126616551424": {"notice_id": "portal_236126616551424", "title": "太平财险北京分公司青年骨干综合能力提升培训班开班", "source": "继续教育学院（高级研修学院）", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=236126616551424", "deadline": "", "event_time": "2025-10-22", "summary": "太平财险青年骨干培训班在贸大开班，39人参训", "content": "10月22日，太平财险北京分公司青年骨干综合能力提升培训班在对外经济贸易大学开班。太平财产保险有限公司北京分公司党委委员、纪委书记黄凌波，我校高级研修学院院长李常州出席开班式，太平财险北京分公司39名青年业务骨干参训。本次培训立足财险行业高质量发展与青年人才队伍建设实际，围绕风险合规建设、业务创新发展、人工智能赋能实务、综合管理能力提升四大维度，搭建专业化、系统化的青年骨干成长交流平台。课程兼顾理论性与实践性，聚焦财险岗位风险识别、合规管理与应急处置、AI赋能保险实务等内容开展专题教学，全方位提升参训青年骨干的专业研判能力、风险管控能力与履职执行能力。本次培训是我校赋能保险企业人才培养的又一实践，学校将持续发挥学科优势，持续深化校企合作，精准对接保险行业人员职业能力培养需求，助力企业可持续高质量发展。"}, "portal_241947056156672": {"notice_id": "portal_241947056156672", "title": "银发大讲堂“积极心理学助推老年幸福人生”专题讲座成功举办", "source": "离退休人员工作处", "category": "其他", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=241947056156672", "deadline": "", "event_time": "2025-10-20", "summary": "离退休处举办老年心理健康讲座，10月20日已举行", "content": "为给老同志普及心理健康知识，10月20日上午，离退休处与朝阳区惠新东街社区联合举办的银发大讲堂“积极心理学助推老年幸福人生”专题讲座在老年活动中心三层报告厅开讲。本次讲座特邀北京大学心理与认知科学学院博雅特聘教授、中国心理学会理事、中国社会心理学会常务理事、北京心理学会秘书长侯玉波担任主讲，离退休老同志在线下线上共同聆听学习。侯玉波教授结合积极心理学理论、经典追踪研究案例与中华优秀传统文化，围绕老年幸福密码展开深入浅出的分享。他以霍华德？金森关于幸福的追踪调查切入，点明依靠物质获得的幸福感难以长久，内心淡泊宁静才是幸福真正的源泉。围绕如何收获幸福老年生活，侯玉波教授从四个维度展开讲解：一是建立积极的自我认知，鼓励老年朋友向内审视自我，明晰自身需求、本领与生活意义，通过自我反思、社会比较认清自我；二是培养积极社会心态和美德，讲解了福流、乐观心态的现实价值，阐释知识、勇气、人道、正义、节制、超越六大美德对于老年人心理建设的重要作用；三是学会规避消极情绪危害和调节心理状态，提醒大家警惕易怒敌意、情绪压抑、失望懊悔、悲观宿命等负面心理，指出长期消极情绪会损害身体免疫系统，影响身心健康；四是传授简单可操作的幸福实践方法，将中华君子人格理念与积极心理学实操技巧相结合，介绍记录“三件好事”、书写感恩信、助人为乐、心怀敬畏等适合老年人日常践行的心理调适方式，引导老同志修身养心，活出充实丰盈的晚年生活。本次讲座是“敬老月”系列活动的主要内容之一。老同志随着年龄增长面临角色转变、情绪调适、价值感重塑等现实心理课题，离退休处立足老同志实际，把心理关怀纳入敬老服务重点内容，希望通过专业心理学知识科普，引导老同志塑造积极老龄观念，学会科学疏导情绪，掌握调适心态的实用方法，从心理层面赋能幸福晚年，不断提升离退休教职工的获得感、幸福感、安全感。为给老同志普及心理健康知识，10月20日上午，离退休处与朝阳区惠新东街社区联合举办的银发大讲堂“积极心理学助推老年幸福人生”专题讲座在老年活动中心三层报告厅开讲。本次讲座特邀北京大学心理与认知科学学院博雅特聘教授、中国心理学会理事、中国社会心理学会常务理事、北京心理学会秘书长侯玉波担任主讲，离退休老同志在线下线上共同聆听学习。"}, "portal_245454245081088": {"notice_id": "portal_245454245081088", "title": "我校墨西哥孔院应邀出席第九届中拉文明对话论坛", "source": "国际中文教育（商务）实践与研究基地", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=245454245081088", "deadline": "", "event_time": "2025-10-19", "summary": "我校墨西哥孔院院长出席中拉文明对话论坛并发言", "content": "当地时间10月19日，第九届中拉文明对话论坛在墨西哥城举行，主题为“以五大工程引领中拉命运共同体建设”。论坛由中国外文局当代中国与世界研究院、中国社会科学院拉丁美洲研究所等单位主办，拉丁美洲社会科学院、墨西哥国立自治大学、墨西哥韦拉克鲁斯大学联合主办，汇聚中国及拉美多国政界人士、专家学者，教育界、媒体界和青年代表。我校墨西哥新莱昂自治大学孔子学院中方院长郑皓瑜教授应邀参会，并在“中拉治理经验交流与中拉战略对接”专题讨论中发言。郑皓瑜以“从战略共识到地方行动：中拉合作中的治理协调”为题，围绕长期规划与政策调整、国家与地方政策协调、经贸合作与本土发展能力建设分享观点。结合在新莱昂州的工作与观察，她提出：中拉合作应与当地产业发展、基础设施和人才培养需求相衔接，通过加强治理经验交流与政策协调，推动合作共识转化为实际成果。郑皓瑜还结合孔子学院教育文化交流及院企合作的实践，阐述了语言沟通、人才培养和相互理解对深化合作的重要作用。此次参会为孔子学院拓展学术交流渠道、深化中墨人文合作积累了广泛基础。"}, "portal_250112913059840": {"notice_id": "portal_250112913059840", "title": "赛讯|我校学生女篮队获得2026年首都高等学校第五届3X3篮球联赛（乙A组）第五名", "source": "体育部", "category": "比赛竞赛", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=250112913059840", "deadline": "", "event_time": "", "summary": "我校女篮获首都高校3X3篮球联赛乙A组第五名", "content": "近日，由北京市大学生体育协会主办的2026年首都高校第五届3X3篮球联赛在人民大学举行，我校学生女子篮球队在体育部宋晓云老师的带领下参加本次比赛。 为积极备战本次赛事，我校女子篮球队在宋晓云老师的指导下，紧抓课余时间开展系统化训练。队员们团结一心、刻苦钻研，反复打磨技术动作，持续磨合攻防战术，以饱满的状态扎实开展备战工作，全力以赴迎接比赛的到来。本次赛事汇聚首都多所高校的队伍同场竞技，比拼激烈。小组赛阶段，我校女篮队伍先后战胜了中国农业大学、中国传媒大学、以小组第一名出线。在淘汰赛16进8比赛中，战胜了北京建筑大学，8强赛对战首都师范大学，遗憾告负。在之后的5-8名排位赛先后战胜了中国政法大学、北京师范大学，最终取得女子乙A组第五名的成绩，这也是我校学生女子篮球队在该项赛事中取得的历史最好成绩。教练员：体育部宋晓云老师 参赛队员：古丽娜·叶尔木哈西｜国际经济贸易学院季然｜英语学院李思思｜英语学院王雪琪｜国际商学院张露文｜法学院 体育部 2026年10月23日"}, "portal_249337491357696": {"notice_id": "portal_249337491357696", "title": "统计学院党委召开2026年度第3次支部书记例会", "source": "统计学院", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=249337491357696", "deadline": "", "event_time": "2026-10-21", "summary": "统计学院党委召开支部书记例会，部署党员发展与支部工作", "content": "2026年10月21日上午，学院2026年度支部书记例会在诚信楼727会议室召开。党委书记李悦主持会议，党委副书记肖明明，党委纪检委员、经济统计系与数量金融系联合党支部书记陈全润，数据科学系与应用数学系联合党支部书记熊巍，专职组织员王湘宁，本科生党支部书记邓文雯，硕士生第一党支部书记胡灏楠，硕士生第二党支部书记杜慧婷，博士生党支部书记王萱参加会议。会议首先进行第一议题学习，围绕《习近平关于基层工作方法的重要论述学习读本》中《一个党员就是一面旗帜——从严从实抓好党员队伍建设》篇章开展学习研讨。本科生党支部书记邓文雯作重点发言。她从提高发展党员质量、增强党员教育管理针对性和有效性、组织引导党员发挥先锋模范作用三个方面分享学习体会，并介绍支部实时更新入党积极分子培养全程记录、严把发展党员质量关的做法，以及支部成功创建北京市高校样板支部并顺利结项的工作情况。随后，会议组织学习新修订的《北京高校发展党员工作程序》、学校《党支部工作记录模版》。李悦书记要求自查在发展党员工作检查中发现的典型问题，并结合学校二级党组织书记例会培训材料，强调党支部贯彻落实“第一议题”的具体要求。组织员王湘宁详细讲解发展师生入党各个环节的注意事项和材料要求，以及党支部手册规范记录样式。各支部依次汇报本学期主题党日、联学共建等工作计划安排，共享共建单位资源。学生党支部汇报了本学期符合发展条件的积极分子情况，研究本学期发展党员计划。李悦书记总结讲话，她对各支部前期工作给予肯定，对下一步支部工作提出四点要求：一要对党务工作要有敬畏之心，发展党员工作政治性强、程序严谨，必须严格按章办事；二要在学深悟透上下功夫，强化理论武装，保持政治敏感度，深入学习党章党规和上级文件精神，不断提升党务工作能力水平；三要坚持党建与中心深度融合，把支部工作与学院教学科研、人才培养有机结合，以高质量党建引领高质量发展；四要勇于创新开辟新境，在规范的基础上积极探索支部活动新形式、新载体，打造具有统计学科特色的党建品牌，推动学院基层党建再上新台阶。（通讯员：王湘宁审核：李悦）"}, "portal_250125777240064": {"notice_id": "portal_250125777240064", "title": "山东工商学院统计学院一行来访", "source": "统计学院", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=250125777240064", "deadline": "", "event_time": "2026-10-19", "summary": "山东工商学院统计学院来访座谈交流，无学生任务", "content": "2026年10月19日上午，山东工商学院统计学院院长贾小爱、副书记魏振波、副院长李丽等一行到访，双方于诚信楼715会议室开展座谈交流。统计学院党委书记李悦、院长唐晓彬、党委副书记肖明明，教师代表刘立新教授及党政办公室相关人员参加了交流。会议由唐晓彬主持。唐晓彬院长对山东工商学院统计学院一行的到来表示热烈欢迎，并对我院学科建设、人才培养、师资力量、科研成果、对外合作等方面的工作开展情况进行介绍。李悦书记回顾学院发展历程，全面介绍了学院近年来党建工作成效、师资队伍建设及人才培养成果。贾小爱院长代表山东工商学院统计学院对我院的热情接待表示感谢，并介绍了山东工商学院统计学院的发展现状、学科特色与现阶段建设重点。交流会上，双方不仅围绕统计学科发展、对外合作拓展等方面的建设思路充分研讨，希望两院能够找准契合点，拓宽交流渠道，且一致认为两院还要在支部共建、招生联动、社会服务实践等方面持续发力，探索多层次、宽领域合作新路径。座谈结束后，双方参会人员共同参观了对外经济贸易大学校史馆和对外经贸博物馆。（通讯员：杨宇晗程钦良摄影：王萱审核：李悦唐晓彬）"}, "portal_251300190748672": {"notice_id": "portal_251300190748672", "title": "王勇教授来校做专场报告——UIBE“卓越大讲堂”第46期精彩回顾", "source": "统计学院", "category": "学术活动", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=251300190748672", "deadline": "", "event_time": "2026-10-19", "summary": "王勇教授10月19日做研究生学术选题专题报告", "content": "10月19日下午，UIBE“卓越大讲堂”第46期在诚信楼三层国际会议厅开讲，东北财经大学统计学院副院长王勇教授做专题报告。本期讲座由研究生院主办、统计学院承办。王勇教授以“从国家所需到学术所问——研究生学术选题的价值导向与形成路径”为题，围绕什么样的问题值得研究、如何形成有价值的学术选题，介绍从国家战略需求中找方向、从现实矛盾与政策实践中提问题、从技术变革与社会变化中寻新题的路径，并结合已发表论文实例，说明如何将宏观关切转化为具体可行的研究问题。王勇教授指出，实证研究大体可分为两类：一类带着问题找方法，一类带着方法找问题。围绕什么样的问题值得研究，他提出四个标准：重要性、未知性、可回答性、贡献性。重要性要求把问题放大到国家与社会的尺度，未知性要求不研究就不知道答案，可回答性要求有可获得的资料，贡献性要求形成具体的学术增量。在选题路径上，他结合四组案例，从发展举措的政策效果差异、政策执行中的激励与行为、民生改善中的分配与约束、新发展实践中的测量难题四个方向，说明研究问题如何从现实张力中生长出来。在形成过程部分，他以一项企业集团节能监管研究为例，呈现从具体场景、竞争性解释、文献与知识缺口、证据与研究设计到发现与贡献的五个环节。（通讯员摄影：王萱魏依蔓审核：李悦唐晓彬）"}, "portal_252185109200896": {"notice_id": "portal_252185109200896", "title": "统计学院召开博士生班会", "source": "统计学院", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=252185109200896", "deadline": "", "event_time": "2026-10-16", "summary": "统计学院召开博士生班会，开展科研与培养指导", "content": "2026年10月16日下午，统计学院召开博士生班会，围绕博士生科研创新、学术交流、培养管理与职业发展等内容开展交流指导。统计学院及研究生院领导老师，统计学院全体博士生出席会议。会上，唐晓彬院长结合学院博士生培养情况，充分肯定了近年来博士生在科研成果、学术交流和职业发展等方面取得的进步。他指出，博士生应夯实学术基础，注重前沿文献阅读与研究问题凝练，努力提升科研创新能力。同时，要积极参与学术交流，在交流研讨中拓宽学术视野。科研工作既要追求学术创新，也要关注现实需求，推动统计理论与方法在实际问题中发挥作用。李岩副院长围绕博士生培养与学术能力提升进行指导，并就学校相关科研成果认定政策作了说明。他强调，博士生不仅要扎实开展研究，还应注重学术表达与交流能力的培养，在学术报告、研讨和交流反馈中不断完善研究思路、提升学术素养。面对科研过程中的挑战与不确定性，要保持积极的科研心态，增强创新意识，在持续探索中锤炼独立思考和解决问题的能力。王萱老师和杜慧婷老师分别围绕博士生培养管理与日常服务保障作了介绍。王萱老师就课程学习、学科综合考试、科研成果要求及学位论文等培养环节进行了说明，提醒同学们及时了解相关要求，合理规划学业进度。杜慧婷老师围绕学生日常管理、安全教育及奖助政策等内容进行介绍，鼓励同学们充分利用学校和学院提供的各项资源，做好学习科研规划。肖明明副书记围绕博士生综合素质提升与职业发展提出建议。他鼓励同学们多关注我校研究生院、党委研究生工作部的学术讲座、国际化培养、科研项目资助等，树立长远发展意识，在扎实推进科研工作的同时，注重沟通协作与实践能力培养，积极参与学术交流和集体活动，主动把握各类学习与发展机会，不断提升综合竞争力。（通讯员：于正阳摄影：彭素静胡灏楠审核：李悦唐晓彬肖明明）"}, "portal_257626807349248": {"notice_id": "portal_257626807349248", "title": "中国知名诗人走进我校墨西哥孔院", "source": "国际中文教育（商务）实践与研究基地", "category": "国际交流", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=257626807349248", "deadline": "", "event_time": "2026-10-20", "summary": "中国诗人到访墨西哥孔院开展诗歌交流活动，10月20日举行", "content": "当地时间2026年10月20日，中国诗人浮冰、秦菲、艾若一行到访我校墨西哥新莱昂自治大学孔子学院，开展诗歌交流与朗诵活动。孔院外方院长SaraAliciaAnciraAr&eacute;chiga、中方院长郑皓瑜及孔院师生、当地诗人、诗歌爱好者等参加相关活动。三位诗人首先来到孔子学院，与中外方院长及师生进行交流。浮冰向孔院赠送诗集《尘言与诗语》及英文版《翻越长歌》（TheLongCrossing），秦菲赠送诗集《马德里千斤重的阳光》，艾若赠送诗集《幸福在路上》。他们还走进课堂，与师生交流中文学习及中国文化体验，并观看孔子学院成立20周年纪念视频，了解孔院在国际中文教育、中墨文化交流及学生培养等方面的发展历程。当日晚间，在新莱昂自治大学ColegioCivil大学文化中心举行了诗歌朗诵交流活动。三位诗人分别朗诵代表作品，墨西哥诗人EduardoZambrano则朗诵了作品的西班牙语译文。朗诵活动还融入了丰富的中墨文化互动。孔院学生带来了精彩的藏族舞蹈表演和中国歌曲演唱；诗人浮冰现场演唱墨西哥经典歌曲《B&eacute;sameMucho》和中国艺术歌曲《教我如何不想她》，将现场气氛推向高潮。在随后的交流环节中，三位诗人与现场观众围绕诗歌创作与翻译、中拉文学交流以及诗歌与个体生命经验等话题展开互动，并鼓励墨西哥青年通过学习中文，直接接触和理解中国文学。新莱昂自治大学孔子学院长期重视文学艺术交流，多位中国诗人曾先后到访。此次活动以诗歌为媒，将文学朗诵、语言学习、音乐表演与文化体验相结合，为中墨师生和诗歌爱好者搭建了面对面交流的平台，也进一步丰富了孔子学院开展中墨人文交流的形式。"}, "portal_298225917100032": {"notice_id": "portal_298225917100032", "title": "“风险社会视域下公共议题的话语建构研究——从语言表征到区域国别阐释”讲座顺利举办", "source": "学术刊物编辑部", "category": "学术活动", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=298225917100032", "deadline": "", "event_time": "", "summary": "孙成志教授公共议题话语建构讲座在线举办，2500余名师生参会", "content": "近日，学术刊物部“聚焦学术前沿引领学术发展”专家大讲堂第二十二场讲座在线举行。大连理工大学外国语学院院长孙成志教授应邀作题为“风险社会视域下公共议题的话语建构研究——从语言表征到区域国别阐释”的讲座。学术刊物部副主任蔡英辉主持活动，2500余名师生线上参会。此次讲座也是学术刊物部学习贯彻党的二十届四中全会精神、促进学术交流与前沿引领、推动科研成果有效支撑学科发展的具体举措。讲座中，孙成志教授结合日本核电重启、核污染水排海、捕鲸以及健康与疾病叙事等案例，具体展示意象图式、话语空间理论、语料库辅助话语分析和批评认知语言学等方法在公共议题研究中的运用。他强调，语言学研究者应以可复核、可复现的语言证据参与区域国别知识生产，在风险识别、责任归属、政策论证和群体身份建构等研究中发挥学科优势，并进一步拓展多模态话语、实验研究和跨学科合作空间。互动环节，与会师生围绕“初学批评认知语言学或语料库辅助话语分析应阅读哪些书目、从哪些工具入手”“面对文本量较大的语料库，除词语分析外还有哪些深入研究角度”等问题提问，孙成志教授逐一进行了解答。《日语学习与研究》主编熊李力教授在总结中表示，孙成志教授的讲座生动展示了语言学研究与区域国别研究有机结合的可能路径，为外语学科转型发展和青年学者选题写作提供了重要启示，鼓励学者跨学科交叉研究。学术刊物部将持续搭建高质量的学术交流平台，紧密联结学界同仁，及时传递前沿研究成果。《日语学习与研究》编辑部将继续坚持以学术创新为导向，以服务学者为初心，尤其关注青年学者的成长，展示高水平的学术研究成果，为构建中国自主知识体系贡献力量。此次讲座得到对外经济贸易大学党委宣传部的大力支持。学术刊物部2026年10月23日"}, "portal_184517886869504": {"notice_id": "portal_184517886869504", "title": "关于我校智能体上线的通知（六）——校园安全服务助手", "source": "网络安全和信息化处", "category": "其他", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=184517886869504", "deadline": "", "event_time": "", "summary": "校园安全服务助手智能体上线，师生可体验使用并反馈问题", "content": "全体师生：为持续深化智慧校园建设，进一步提升校园安全管理相关服务效率与体验，我处与保卫处共同开发了“校园安全服务助手”智能体，为全校师生提供7&times;24小时不间断在线答疑服务。该智能体可为您解答校园治安、交通、消防、户籍管理相关问题以及校门开放、校园进出、监控查询、防范诈骗等事宜，欢迎广大师生积极体验使用。一、智能体访问方式1.访问地址2.访问入口（1）信息平台在信息平台顶部导航栏点击“惠园AI”，进入页面后选择“校园安全服务助手”，即可发起问答。（2）移动端访问在对外经济贸易大学微信企业号中，进入“惠园AI”菜单，在“服务助手”中找到“校园安全服务助手”智能体，点击即可访问。3.校园安全服务助手界面二、问题反馈渠道在使用智能助手进行问答交互过程中，如遇解答不准确或有其他疑问，可通过以下方式反馈：线上反馈：直接点击对话页面下方的“问题反馈”按钮，问题反馈不收集个人信息，仅用于问答效果的改进；线下联系：信息处64492311（杨老师、张老师）、保卫处64495564（张老师），或发送邮件至dc@uibe.edu.cn。欢迎广大师生试用并提出宝贵意见，我们将持续优化服务体验。网络安全和信息化处保卫处2026年10月23日"}, "portal_193102041460736": {"notice_id": "portal_193102041460736", "title": "关于2026年度教育部哲学社会科学研究重大课题攻关项目和高校思想政治理论课教师研究专项重大课题攻关项目招标工作的通知", "source": "科研处", "category": "科研项目", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=193102041460736", "deadline": "", "event_time": "", "summary": "面向高校教师的教育部重大课题攻关项目招标，需以学校为单位在线申报", "content": "校内各单位：根据《教育部办公厅关于2026年度教育部哲学社会科学研究重大课题攻关项目和高校思想政治理论课教师研究专项重大课题攻关项目招标工作的通知》（教社科厅函〔2026〕19号）以及《教育部哲学社会科学研究重大课题攻关项目管理办法（试行）》的要求，现将2026年度教育部哲学社会科学研究重大课题攻关项目和高校思想政治理论课教师研究专项重大课题攻关项目招标工作有关事项通知如下。一、招标课题和资助额度本次招标课题分为两类：（一）2026年度教育部哲学社会科学研究重大课题攻关项目招标课题共45项，每项课题资助经费原则上为50万—80万元。（二）2026年度教育部高校思政课教师研究专项重大课题攻关项目招标课题共12项，每项课题资助经费原则上为30万—40万元。二、投标条件和有关要求（一）每位首席专家（投标者）本次只能选择两类招标课题中的1项进行投标。（二）首席专家必须是法人（高等学校）担保的高等学校具有正高级专业技术职称的有关人员，能够担负起课题研究实际组织和指导责任。同时，高校思政课教师研究专项重大课题攻关项目首席专家必须是专职思想政治理论课教师，实际从事思想政治理论课教学、研究工作并真正承担和负责组织项目实施；需要跨学科联合攻关的高校思政课教师研究专项重大课题攻关项目，应有法学、社会学、中共党史党建学、教育学、心理学、新闻传播学、历史学以及统计学、计算机科学与技术、管理学等相关学科专家作为子课题负责人或课题组成员参与申报。（三）首席专家只能为1名。（四）首席专家不能作为子课题负责人或课题组成员参与本次投标的其他课题，子课题负责人本次只能参与1个课题投标，课题组成员最多参与2个课题投标。（五）有以下情况之一者不得投标：1.承担国家社会科学基金重大项目、重大研究专项项目及其他国家级科研重大项目尚未完成者；2.承担历年教育部人文社会科学重点研究基地重大项目、教育部哲学社会科学研究后期资助重大项目尚未完成者；3.正在承担教育部哲学社会科学研究重大课题攻关项目、高校思政课教师研究专项重大课题攻关项目的首席专家，在本通知发布前未提出最终成果鉴定申请者。（六）申请同年度国家社会科学基金重大项目、重大研究专项项目及其他国家级科研重大项目的首席专家，本次不能投标教育部重大课题攻关项目。三、申报办法和程序（一）以学校为单位，集中统一申报，不受理个人申报。（二）本次项目投标通过网络平台在线申"}, "portal_223256352534528": {"notice_id": "portal_223256352534528", "title": "关于召开2026年10月全校食品安全调度会的通知", "source": "后勤处", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=223256352534528", "deadline": "", "event_time": "2026-10-28", "summary": "后勤处通知食品安全负责人等参加10月28日食品安全调度会", "content": "各相关部门：为深入贯彻习近平总书记关于食品安全的重要论述精神，落实国家市场监督管理总局98号令《集中用餐单位落实食品安全主体责任监督管理规定》，强化学校食品安全主体责任，建立健全日管控、周排查、月调度工作制度和机制，切实营造和谐、健康、安全的校园环境，学校兹定于2026年10月28日（周三）召开食品安全月调度会，现将有关事项通知如下：一、会议时间10月28日（周三）14:00二、会议地点诚信楼331会议室三、参会人员1.全校食堂、汇美食代、各类超市等餐饮经营场所负责人、食品安全总监、食品安全员；2.外卖柜、无人自动售货机等食品经营设备负责人、食品安全员。四、会议内容1.学习贯彻习近平总书记关于食品安全的重要论述精神；2.组织集体食品安全知识培训；3.学校食品安全总监、各部门食品安全总监、食品安全员汇报2026年10月食品安全工作情况；4.部署下一阶段食品安全工作；5.与会人员交流工作中遇到的问题、食品安全风险防范的做法和下一步工作计划。五、有关要求食品安全月调度会是国家对食品安全管理的规定工作，请各相关单位高度重视，通知相关人员参会。联系人：寇老师64494123后勤处2026年10月23日"}, "portal_234176734953472": {"notice_id": "portal_234176734953472", "title": "关于开展2026级研究生国家助学金资格审核与发放工作的通知", "source": "研究生工作部", "category": "奖助学金", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=234176734953472", "deadline": "2026-10-30", "event_time": "", "summary": "2026级研究生需办理助学金资格审核，10月30日截止提交材料", "content": "各培养单位、各位研究生：根据《财政部教育部人力资源社会保障部退役军人部中央军委国防动员部关于印发〈学生资助资金管理办法〉的通知》（财教〔2021〕310号）、《关于调整高等教育阶段和高中阶段国家奖助学金政策的通知》（财教〔2024〕181号）等相关文件要求，现将2026级研究生新生国家助学金的资格审核与发放工作通知如下：一、资格审核对象1.国家助学金发放范围为我校在基本修业年限内、档案在校、具有中华人民共和国国籍且纳入全国研究生招生计划的无固定收入全日制研究生新生（其中就业方式为定向就业的仅限于非在职“少数民族高层次骨干人才计划”的研究生，其他定向就业除外）。2.2026年选拨的硕博连读生，自2026年9月起按照博士标准发放国家助学金。对于已发放的9月份至调整月的部分，将按博士标准补发差额。3.办理过保留学籍并于2026年入学、办理过休学并于2026年复学，且从未发放过助学金的研究生，也需参与此次资格审核。4.办理保留学籍、休学等手续的新生，暂不发放研究生国家助学金，待复学注册后申请补发。二、发放标准按照博士15000元/人/年、硕士6000元/人/年的标准进行发放，每年分10个月发放（2月、8月不发）。三、工作安排1.请各单位提醒相关研究生于2026年12月11日（周五）前办理档案到校和学费缴纳手续（办理国家助学贷款的新生需缴纳学杂费差额），并统计参加本次资格审核的研究生固定收入情况，汇总表经各培养单位研究生奖助工作评审委员会审核通过后上报研工部。2.请各单位通知相关研究生于10月25日（周日）24点前在学校财务支付平台上绑定本人中国建设银行一类借记卡。3.资格审核工作结束后，学校计划于12月中旬一次性发放今年9—12月新生国家助学金，此后将按月发放。四、材料提交请各培养单位组织参加本次资格审核的研究生填写《2026级研究生个人固定工资收入情况说明》（附件1），并将纸质版交给各单位核查后备案。请各单位按学号顺序填写《2026级研究生个人固定工资收入情况汇总表》（附件2），纸质版签字盖章后交至求真楼东409室，电子版发送至邮箱uibeygbjz@uibe.edu.cn，提交截止时间为10月30日（周五）16:00。联系人：赵老师，电话64496803。党委研究生工作部2026年10月23日"}, "portal_264123109212160": {"notice_id": "portal_264123109212160", "title": "转发：2026-2027年度“发展研究奖学金”项目申请通知及宣讲会安排", "source": "研究生院", "category": "奖助学金", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=264123109212160", "deadline": "2026-11-20", "event_time": "2026-10-28", "summary": "面向在读硕博的发展研究奖学金申请，11月20日截止", "content": "为进一步支持政策研究人才发展与实习实践，服务建设国家战略人才队伍，拟遴选有志于经济社会发展研究的优秀青年人才，辅助开展全局性、综合性、战略性、长期性问题的政策研究，中国发展研究基金会于2026年9月30日启动2026-2027年度“发展研究奖学金”项目，现面向全日制硕士和博士研究生开放项目宣讲会报名。一、项目介绍“发展研究奖学金”项目由中国发展研究基金会于1999年设立，资助有志于政策研究的高等院校及科研院所优秀在读硕士和博士研究生，到国务院发展研究中心协助参与相关政策研究工作。项目资助期为一年，资助金额为每人每年2万元人民币。二、申请条件1.申请人需有志于经济社会发展政策研究，具有保密意识和强烈的社会责任感，有较强的团队协作精神。2.学历资格：申请人须为全日制在读硕士或博士研究生，并且在项目结束时仍保持正常的在校生身份。3.科研能力：申请人需具备岗位所在研究领域的相关专业知识，学习成绩优异，具有良好的科研能力和潜力；有参与科研项目的经验，或在核心学术期刊上发表过论文者优先考虑。4.英语水平：申请人需具备良好的英语听说读写能力，能够胜任国际学术交流活动；有海外交流学习经历者优先考虑。三、申请流程1.请申请人认真填报申请表（见附件）。2.请申请人于11月20日前按要求以电子邮件形式把签字和加盖所在院系公章的申请表扫描件发送至scholarship@cdrf.org.cn，电子邮件命名格式：2026-2027+姓名+硕士/博士+专业+学校。申报截止时间以电子邮件的发送时间为准。3.请申请人将签字和盖章的纸质版申请表（一式两份）以及相关申请材料邮寄至“北京市东城区安定门外大街138号皇城国际中心A座15层，中国发展研究基金会，赖老师收”，咨询电话：64255855-8090。除申请表外，欢迎提供可证明学习成绩、研究能力和获奖等方面的佐证材料，可一并提交电子版及寄送纸质版。4.遴选将进行初审、复审与面试。遴选结果将在基金会官网及公众号进行公示。公示后将由中国发展研究基金会、用人部门、学生所在院系、学生本人签订四方协议，明确责任与义务，保障相关权益。四、宣讲会安排为鼓励更多在校学生申报和参与“发展研究奖学金”项目，帮助理解申报流程和要求，基金会将于2026年10月28日（周三）14:00，在北京大学光华管理学院1号楼301举办2026-2027年度“发展研究奖学金”项目宣讲会"}, "portal_263213364424704": {"notice_id": "portal_263213364424704", "title": "关于举办研究生教育教学改革重大项目结项会的通知", "source": "研究生院", "category": "学术活动", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=263213364424704", "deadline": "", "event_time": "2026-10-24,2026-10-26,2026-10-27", "summary": "学校举办研究生教改重大项目结项汇报会，10月24日至27日分场举行", "content": "为进一步推进研究生教育综合改革，推动研究生教育高质量发展，促进项目成果展示交流与经验共享，学校将于近期举办研究生教育教学改革重大项目结项暨成果汇报会，现将有关事项通知如下。一、重大项目“基于分类培养要求的国际商务专业学位研究生教育体系创新与构建”汇报人：蓝庆新 国际经济贸易学院会议时间：2026年10月24日9：30会议地点：博学楼1224会议室特邀专家：陈岩 北京邮电大学经济管理学院教授王海文 北京第二外国语学院经济学院教授张国峰 对外经济贸易大学国际经济贸易学院教授成果简介：课题成果对国际商务专业学位研究分类培养问题进行了深入思考，对相应路径进行了思考。形成了系列成果，涵盖研究报告《国际商务专业学位研究生分类培养体系创新与实践》，开发了系列中国专业学位中心入库案例，部分成果入选教育部研究生司示范案例和北京市高等教育学会示范案例等。二、重大项目“人工智能时代财经类高校拔尖创新人才培养的改革与实践”汇报人：倪耀东 人工智能与数据科学学院会议时间：2026年10月27日14:00会议地点：求索楼B201人工智能实验室特邀专家：王兴芬 北京信息科技大学教授，校党委常委、副校长马占宇 北京邮电大学人工智能学院教授，党委教师工作部部长，人事处处长、人才办主任戚依南 对外经济贸易大学国际商学院教授，发展规划处处长杨杭军 对外经济贸易大学国际经济贸易学院教授，卓越人才培养学院院长成果简介：以“战略引领、数智赋能、实战演练”为理念，依托“新文科实验室集群”与数智化研究平台双轮驱动推进数智化综合教学改革，推动人才培养实现从知识传授向能力创新、学科分立向交叉融合、课堂学习向实战演练的转变；持续夯实交叉学科基础，建成“1+2+N”新文科实验室集群，研发“全球经济智思体”，在决策咨询、出口管制人才培养、卓越社科人才基地建设等方面成效突出，着力打造服务国家经贸事业的经管法高层次人才培养新高地。三、重大项目“金融博士研究生教育高质量发展模式创新与实践”汇报人：邓军 中国金融学院会议时间：2026年10月26日12：00会议地点：博学楼925会议室特邀专家：黎新平 北京大学经济学院教授 魏 旭 中央财经大学金融学院教授赵大萍 首都经济贸易大学金融学院教授卞 洋 对外经济贸易大学中国金融学院副教授祝小全 对外经济贸易大学中国金融学院副教授成果简介：本成果面向金融强国建设对"}, "portal_321294957948928": {"notice_id": "portal_321294957948928", "title": "关于加强全校应用软件安全工作的通知", "source": "网络安全和信息化处", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=321294957948928", "deadline": "", "event_time": "", "summary": "网信处要求全校师生加强应用软件安全防护，无截止日期", "content": "校内各单位、全体师生：为保障服务器、个人终端设备的安全使用，防范网络安全事件发生，结合近期我校网络安全态势，现将应用软件安全需要注意的网络安全事项通知如下：1.仅安装从正规来源渠道下载的应用软件。在下载应用软件时，尽量使用正规应用商店、官方网站或设备系统认可的分发渠道。非官方渠道(如不明网站、第三方平台等)可能被篡改或植入恶意代码。服务器安装软件，必要时可选用仅支持离线运行的运行版本。2.合理管控软件应用权限。对于安装的软件，运行时仅授予实现基本功能的必要权限，主动关闭不必要的云端服务。3.做好终端安全防护。全校各部门的服务器、个人电脑、手机等设备均应安装杀毒软件。操作系统、应用软件及防病毒软件保持更新状态，及时安装安全补丁。避免点击不明链接或邮件附件，防范网络钓鱼和诈骗。网络安全和信息化处2026年10月23日"}, "e1de35113e7d9f29e24bd4cb5801c550": {"notice_id": "e1de35113e7d9f29e24bd4cb5801c550", "title": "​外语学院青年教师在国际知名期刊发表论文", "source": "外语学院-学院动态", "category": "其他", "publish_time": "2026-10-23", "url": "https://sfs.uibe.edu.cn/ttxw/e8343bfecbc74a6b8146a6fc09502700.htm", "deadline": "", "event_time": "", "summary": "外语学院青年教师在国际期刊发表论文的报道", "content": "​外语学院青年教师在国际知名期刊发表论文\n发表时间：2026-10-23\n近期，外语学院青年教师郭梦在国际知名期刊《Meta》第70卷第1期发表论文“Automaticlivecaptioninginsimultaneousinterpreting:Acomparativeanalysisofquality”（《同声传译中的自动实时字幕：口译质量的比较研究》）。在人工智能日益融入语言服务的背景下，如何有效利用技术辅助口译、开展人机协作，成为口译实践与教学面临的新课题。文章以自动语音识别生成的实时字幕为切入点，通过比较不同口译模式下的表现，考察实时字幕辅助对口译质量的影响及其适用条件，为口译技术应用与人才培养提供实证参考。\n近两年，郭梦围绕“人工智能辅助口译”主题，以第一作者身份在《Meta》《LinguisticaAntverpiensia》《TheInterpreterandTranslatorTrainer》《CadernosdeTradução》等SSCI、A&HCI或ESCI收录期刊发表多篇高水平论文。\n外语学院紧扣“新文科”建设要求，面向人工智能时代语言服务变革，持续赋能青年教师成长。通过常态化学术交流、构建科研协同机制，引导教师立足学科特色、发挥多语种优势，积极开展外语学科前沿研究，持续拓展学科发展内涵，为外国语言文学自主知识体系构建注入青年学术力量，稳步实现高水平学术成果突破。"}, "164a920c779d6b219e108dab5dd195a1": {"notice_id": "164a920c779d6b219e108dab5dd195a1", "title": "外语学院举办“育人为本 语筑师魂”导师育人能力提升系列培训第...", "source": "外语学院-学院动态", "category": "行政党务", "publish_time": "2026-10-23", "url": "https://sfs.uibe.edu.cn/ttxw/f398af84b25048169d0fc01798417584.htm", "deadline": "", "event_time": "2026-10-22", "summary": "外语学院面向研究生导师举办AI素养提升培训，10月22日举行", "content": "外语学院举办“育人为本语筑师魂”导师育人能力提升系列培训第三期\n发表时间：2026-10-23\n10月22日下午，外语学院“育人为本语筑师魂”导师育人能力提升系列培训第三期在诚信楼1216室举行。本期培训以“从‘会用’到‘善用’：AI时代研究生导师的素养进阶”为主题，面向学院研究生导师开放，旨在持续强化导师立德树人履职能力，推动人工智能技术与研究生培养、教学科研指导深度融合。\n培训分为专题讲座学习、教师分享和研讨交流三个环节。\n第一环节，与会教师集体学习翻译技术类线上讲座，直观了解翻译技术发展和AI在教学实践中的应用趋势。\n第二环节，申泉老师作题为《主动拥抱AI：依托教改项目推进数智化教学实践》的分享。她以具体教改项目为例，详细介绍了在课堂教学中运用AI的尝试与经验，为推进数智化教学提供了具体思路。\n随后，袁通衢老师作题为《人工智能在外语教学与翻译实践中的应用探索》的分享。他从自身教学实践出发，分享了AI应用于教学活动的丰富案例，以及在人工智能应用方面的探索，内容具有较强的专业性和启发性。\n第三环节，与会教师围绕AI赋能研究生培养、教学与科研指导进行自由交流。大家结合讲座内容与两位老师的分享，就AI技术在教学科研中的实际应用、研究生指导方式创新等问题展开深入讨论，现场气氛热烈。\n本期培训帮助导师进一步理解了AI技术在外语教学、翻译实践和研究生培养中的应用路径，有助于推动导师提升AI使用能力。学院将继续依托“育人为本语筑师魂”系列培训品牌，围绕导师育人能力提升开展专题活动，不断夯实研究生培养质量。"}, "a3840ea4a24dc4f8addc16a23bca4eaa": {"notice_id": "a3840ea4a24dc4f8addc16a23bca4eaa", "title": "关于提醒部分未上传或提交材料考生尽快完成报名的通知", "source": "研究生院-通知公告", "category": "教务通知", "publish_time": "2026-10-23", "url": "http://yjsy.uibe.edu.cn/cms/infoSingleArticle.do?articleId=7938&columnId=2395", "deadline": "", "event_time": "", "summary": "提醒1136考点未上传材料考生尽快完成报名，截止前完成", "content": "各位相关考生：\n根据研招网反馈，部分在报名1136对外经济贸易大学考点的考生，交费后未上传或提交材料，系统报名页面显示“网上报名未完成”。请相关考生尽快点击报名页面右侧蓝色“去上传报考点要求的材料”按钮，如系统提示上传“在读研究生或在校本科第二学位考生同意报考证明材料”，如不属于在读研究生或在校本科第二学位考生范畴，点击“开始上传”按钮后可不上传材料，直接点击“确定并提交”按钮，完成报名。部分考生尚未完成头像采集，须通过学信网APP在线拍摄并上传本人白底照片。相关工作请在报名截止前尽快完成。\n以下附件内容为截止10月23日10：00报考1136考点硕士研究生未完成报名的部分考生信息，公示名单仅供参考。\n 未上传或提交材料考生名单.pdf"}, "portal_190458409459712": {"notice_id": "portal_190458409459712", "title": "关于暂停本周六日常体质健康测试的通知", "source": "体育部", "category": "教务通知", "publish_time": "2026-10-22", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=190458409459712", "deadline": "", "event_time": "", "summary": "本周六体质健康测试因新生运动会暂停一次，请各学院通知学生", "content": "根据学校统一工作安排，本周六举行2026年新生运动会。为保障本次新生运动会各项工作有序开展，原定于本周六进行的日常体质健康测试暂停一次，同时，红天体育馆地下2层7教室当日暂停开放，请各学院及时通知本院学生，提醒同学们知悉相关调整。体育部2026年10月22日"}, "portal_200110031446016": {"notice_id": "portal_200110031446016", "title": "关于开展2026年对外经济贸易大学“学术之星”暨研究生学术创新奖评选工作的通知", "source": "研究生院", "category": "奖助学金", "publish_time": "2026-10-22", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=200110031446016", "deadline": "2026-10-28", "event_time": "", "summary": "在读研究生须于10月28日前在系统录入学术成果参评学术之星及创新奖", "content": "各研究生培养单位、研究生：为加强拔尖创新人才自主培养，激发研究生的科研积极性，根据《对外经济贸易大学学术之星暨研究生学术创新奖评选办法》（附件1，以下简称“评选办法”），我校每年评选对外经济贸易大学“学术之星”（含提名奖）不超过10名，评选研究生学术创新一等奖、二等奖、三等奖、优秀奖若干。现就2026年评选工作通知如下。一、参评对象我校在读研究生或毕业一年以内（含2025年6月毕业）的研究生。二、参评成果1.参评成果为研究生高水平学术成果，包括期刊类成果、文摘类成果、智库类成果、报刊类成果。根据成果质量，将研究生高水平学术成果分为Ⅰ、Ⅱ、Ⅲ三级。具体级别界定及认定标准请详见评选办法，中文期刊类成果等级参见《对外经济贸易大学中文核心期刊学科分类目录》（附件2、附件3），外文期刊类成果等级参见《对外经济贸易大学外文高水平期刊分类目录》（附件4、附件5），智库类成果等级参见《对外经济贸易大学高水平科研成果奖励办法》（附件6）。2.参评成果发表或采纳时间为2025年11月至2026年10月。我校研究生在拟录取后至入学报到前完成的学术成果、毕业一年内发表且投稿日期为在读期间的学术成果也纳入参评范围。3.参评成果必须以对外经济贸易大学为第一署名单位，以研究生为第一作者。以导师（导师组成员）或校内教师为第一作者、研究生为第二作者联合署名的，视同研究生第一作者。以通讯作者发表的期刊论文视同第一作者，通讯作者须在论文正文中明确标示。外文期刊论文作者排序以字母顺序发表、以同等贡献发表，且作者总数在4人（含）以内的，可视同第一作者。发表在B类及以上外文期刊，不受上述作者人数限制。除第一作者及视同第一作者发表外，其他合作发表的外文期刊论文，排名第二、第三分别按照其成果级别的50%、30%给予认定，第四及以后作者不予认定。三、申报流程（一）研究生申报时间为：2026年10月22日至10月28日1.研究生提交学术成果拟参评研究生需在申报时间内，将学术成果及时录入“研究生综合信息管理系统”—﹥“学生电子档案”—﹥“发表论文”/“智库成果”栏目中。请注意：论文类成果需正式见刊后，方可录入系统，用稿通知不能代替正式见刊发表；录入者务必真实、准确、完整地填写相关内容，并将发表的PDF版上传至系统；发表的PDF版可知网下载或自行扫描，必须包含刊物封面、目录及正文页，文件命名为“学号_姓名_文章名称”；外"}, "portal_202550801801216": {"notice_id": "portal_202550801801216", "title": "关于召开2027届毕业班辅导员就业工作培训会的通知（第一期）", "source": "招生就业处", "category": "就业实习", "publish_time": "2026-10-22", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=202550801801216", "deadline": "", "event_time": "2026-10-28", "summary": "面向2027届毕业班辅导员的就业工作培训会，10月28日召开", "content": "各学院：为落实《中共中央国务院关于实施就业优先战略促进高质量充分就业的意见》文件精神，建设专业化就业工作队伍，促进我校2027届毕业生高质量充分就业。现召开2027届毕业班辅导员就业工作培训会（第一期），具体内容如下：一、时间2026年10月28日（周三）9:30-11:00二、地点求真楼一层招聘大厅三、参会人员2027届毕业班辅导员、招生就业处全体就业工作人员四、培训内容1.招生就业处介绍就业工作安排；2.学院代表就业工作经验分享；3.兄弟高校就业工作经验分享。招生就业处2026年10月22日"}, "portal_280861796147200": {"notice_id": "portal_280861796147200", "title": "关于“i惠园”信息平台通知编辑器升级的通知", "source": "网络安全和信息化处", "category": "行政党务", "publish_time": "2026-10-22", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=280861796147200", "deadline": "", "event_time": "", "summary": "信息平台通知编辑器升级完成，发布员可自行查阅培训回放", "content": "各信息发布员：信息平台通知编辑器版本升级工作现已完成。即日起，各信息发布员可使用新版富文本网页编辑器发布校内通知。该编辑器可完全兼容Word和WPS排版格式，实现所见即所得编辑。原编辑器插件与浏览器版本不兼容、通知编辑异常等问题均已解决。信息发布常见问题见附件1，10月13日新版编辑器培训会议视频回放链接如下：https://meeting.tencent.com/cw/Kw00djWja2。请有需求的老师自行查阅学习。使用中如有任何问题，请电话联系64494228李老师。网络安全和信息化处2026年10月22日"}, "portal_282867340353536": {"notice_id": "portal_282867340353536", "title": "关于10月24日凌晨校园网络设备升级的通知", "source": "网络安全和信息化处", "category": "其他", "publish_time": "2026-10-22", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=282867340353536", "deadline": "", "event_time": "2026-10-24", "summary": "校园网络设备将于10月24日凌晨升级，请用户提前做好准备", "content": "各单位及校园网用户：<spanlang=\"EN-US\"style=\"font-size:14.0pt;font-family:\"TimesNewRoman\",serif;"}, "portal_291616513069056": {"notice_id": "portal_291616513069056", "title": "关于开展2025年度教育教学类成果奖励申报工作的通知", "source": "教务处", "category": "教务通知", "publish_time": "2026-10-22", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=291616513069056", "deadline": "2025-11-04", "event_time": "", "summary": "在编教师申报2025年度教育教学成果奖励，11月4日17:00截止", "content": "各单位：根据《对外经济贸易大学教育教学类成果认定标准与奖励办法》（贸大教务发〔2025〕13号，以下简称《办法》（附件1））和《对外经济贸易大学教育教学类成果认定标准目录（2025）》（以下简称《成果目录》（附件2）），现启动2025年度教育教学类成果奖励申报工作。为提高首次线上申报的准确性和审核效率，本次实行“线上为主、线下校验、双轨一致”的申报方式。现将有关事项通知如下。事项要点谁申报由成果成员排序第一的我校在编教师统一申报；团队其他成员不重复填报。报什么2025年1月1日至12月31日取得、符合《成果目录》B级及以上标准且以我校为第一署名单位的教育教学类成果。怎么报线上在“i惠园—办公应用—教研系统”登记并上传完整证明材料；线下提交证明材料原件及复印件，核对结束后返还原件。何时报个人系统申报：11月2日9:00至11月4日17:00；单位审核：11月2日至11月6日17:00。纸质证明材料提交：11月9日至11月10日17:00提交地点：诚信楼611办公室特别注意申报阶段不填奖励分配比例和金额；奖励结果公告后，申报人再按贡献度在系统内填报并确认。一、奖励对象、范围和基本规则（一）奖励对象为我校在编教师。申报奖励的成果须以我校为第一署名单位，且在2025年1月1日至2025年12月31日期间取得（原则上以证书日期为准）。（二）本次奖励范围为《成果目录》中A、A-、B+、B级成果。（三）同一成果不得在学校教育教学类成果和科研成果之间重复申报奖励。二、申报程序（一）个人线上申报申报人登录“i惠园－办公应用－教研系统”，进入“教育教学类成果”，点击“新增”，选择对应成果类别，按系统页面填写成果基本信息、成果成员信息并上传相关证明材料附件。每个成果上传一个合并PDF证明材料，材料排序清楚、页面完整、文字及盖章清晰可辨认。填写完成后可先“暂存”，核对无误后点击“提交”。“暂存”不等于正式申报；只有状态显示为“已提交”并进入单位审核，方视为完成线上申报。单位退回的，申报人应在单位审核截止前（11月6日17:00）按退回原因修改并重新提交。申报人申报系统开放时间：11月2日9:00至11月4日17:00（二）单位审核各单位“随报随审”，在系统中作出“通过”或“退回修改”处理。退回意见应写明具体原因和需补正的材料。涉及目录未明确、成员排序争议、成果名称变更、跨单位署名等事项的"}, "f4cd9d7166751487e8a9dec00b1accaf": {"notice_id": "f4cd9d7166751487e8a9dec00b1accaf", "title": "中外学生共赴中国共产党历史展览馆开展长征精神研学活动", "source": "外语学院-学院动态", "category": "行政党务", "publish_time": "2026-10-22", "url": "https://sfs.uibe.edu.cn/ttxw/931e06ce98464b0eae158c7d9c08bfc6.htm", "deadline": "", "event_time": "2026-10-16", "summary": "外语学院与国际商学院联合组织中外学生赴党史馆开展长征精神研学", "content": "中外学生共赴中国共产党历史展览馆开展长征精神研学活动\n发表时间：2026-10-22\n10月16日，为纪念中国工农红军长征胜利90周年，外语学院党委与国际商学院党委联合组织中外学生走进中国共产党历史展览馆，参观“伟大远征——中国工农红军长征档案展”“雪山草地——纪念中国工农红军长征胜利90周年文物专题展”两大主题展览，开展沉浸式红色研学实践。研学现场，外语学院本研学生党员和本科优秀团员青年发挥语言专业优势，与国际商学院IEMBA留学生一对一翻译讲解长征故事。\n同学们结合展览中“世界是怎样知道长征的？”专题板块，把档案背后的长征故事转化为清晰流畅的跨语言表达，以语言为桥梁，向外传递长征史诗，在实战锻炼专业能力，践行外语人讲好中国红色故事的使命。\n步入雪山草地仿真场景展区，同学们沉浸式重走长征路。在复原的夹金山垭口、红军烈士墓实景前，同学们近距离感受当年红军在高寒、沼泽环境下的艰难征程，真切感悟红军将士不惧万难、坚守信仰的伟大长征精神。\n研学活动尾声，全体师生肃立，共同诵读毛泽东《七律·长征》。铿锵的诗句回荡展厅，抒发对革命先烈的崇高敬意。观展结束后，同学们纷纷表示，档案与文物让厚重的长征历史变得可感可知，本次实践既是一堂生动的党史教育课，也是一次宝贵的双语实践课堂，收获良多。"}, "444a0f634baf7c2dfc100bd9186af6a6": {"notice_id": "444a0f634baf7c2dfc100bd9186af6a6", "title": "我校与天津轨道交通集团签署战略合作协议", "source": "新闻网-综合新闻", "category": "行政党务", "publish_time": "2026-10-22", "url": "https://news.uibe.edu.cn/info/1381/144788.htm", "deadline": "", "event_time": "2026-10-13", "summary": "我校与天津轨道交通集团10月13日签署战略合作协议", "content": "校新闻网讯（国际发展合作学院供稿）\n10月13日，我校与天津轨道交通集团举行座谈交流，并签署战略合作协议。天津轨道交通集团总经理郭磊，副总经理马运康，校长吴卫星，副校长梅夏英出席签约仪式。仪式由国际发展合作学院院长王波主持。\n吴卫星对郭磊一行的来访表示欢迎。他指出，天津轨道交通集团是行业标杆国企，在基础设施、跨境互联、投融资创新等领域走在前沿；对外经济贸易大学是教育部直属“双一流”高校，学校始终坚持以服务国家对外开放战略为己任，学科优势明显，人才培养特色鲜明，双方优势互补，合作空间广阔。他表示，此次签署的战略合作框架协议与专项合作协议，促进了教育链、人才链与产业链深度衔接。他期待双方以此次签约为契机：加强联系、增进信任，建立常态化对接机制；发挥优势、双向赋能，让理论接上产业一线；推动落地、务求实效，把合作方向细化为具体项目；深化合作、服务社会，共同服务京津冀协同发展和高水平对外开放等国家战略。最后，他衷心祝愿双方合作顺利、成果丰硕。\n郭磊对对外经济贸易大学的热情接待表示感谢。他介绍了天津轨道交通发展历程以及轨道交通集团核心业务、转型发展等情况。他指出，当前国有资本和国有企业处于转型升级的关键时期，集团正在深入贯彻落实我市“三新”“三量”部署要求，加快实施“双并重”转型战略，在深耕主业的同时积极布局新领域新赛道。与对外经济贸易大学合作，是集团落实人才强企、创新驱动战略的重大举措，也是集团借智借力、借势发展的重要契机。此次深化合作，必将为集团转型发展注入强劲动力，也必将为贸大服务经济社会发展搭建更广阔的舞台。\n随后，在郭磊与吴卫星的共同见证下，马运康与梅夏英分别代表双方签署战略合作协议。双方表示，将建立常态化对接机制，持续深化产学研用协同创新，在国际经贸人才培养、金融与风险管理、存量时代城市轨道交通企业生存能力提升等方面开展务实合作，共同推动双方合作取得实效，为服务国家高水平对外开放和区域经济社会高质量发展注入新动能。\n天津轨道交通集团首席专家、副总工程师李向辉，财务中心副主任陶广仁，国际发展合作学院副院长张竞镭，中国金融交易研究中心主任黄希韦等参会。\n（撰稿：杜纪庆黄希韦审稿：王波）"}, "da1fd85aec7ac77dd30d67d3d195e88f": {"notice_id": "da1fd85aec7ac77dd30d67d3d195e88f", "title": "图书馆一小时数据库培训： CEIC宏观经济数据库应用", "source": "图书馆-培训讲座", "category": "学术活动", "publish_time": "2026-10-20", "url": "https://lib.uibe.edu.cn/pxjz/a843d364fc444c9890dbb1e6cbec914a.htm", "deadline": "", "event_time": "2026-10-22", "summary": "图书馆举办CEIC数据库应用线上培训，10月22日下午开讲", "content": "为便于广大师生更好地利用各类电子资源，图书馆推出一小时数据库培训系列活动。本学期数据库培训将继续采用线上线下相结合的形式，帮助师生梳理学术资源、提升实证研究技巧。\n时间：2026年10月22日（星期四）下午2:00-3:00\n主讲人：丛琳\n讲座方式：线上\n直播方式：腾讯会议号943-561-680https://meeting.tencent.com/dm/JGyvqnpqeOzq\n讲座主题：CEIC宏观经济数据库应用\n讲座内容：\nCEIC部分：\n1.CEIC公司和数据库简介\n2.数据库内容介绍\n全球经济数据库：全球数据库前所未有地覆盖了200多个国家，18个宏观经济概念和8,000,000组时间序列。\n世界趋势数据库：该数据库整合了历史经济数据，财务指标，以及针对一个地方的数据预测。提供了一个用户友好并且方便的界面，它允许用户做国家的比较和趋势分析。\n中国经济数据库：CEIC中国数据库是一时间序列经济数据库，数据內容包括全国性的宏观经济数据、地区经济数据、行业经济数据及专题数据。\n3.CEIC网页版使用方法介绍\n界面操作；数据模板建立；搜索及下载功能；团队合作；实时客服\n4.Q&A\n主讲人简介：\n丛琳，现任ISIMarkets客户成功经理，深耕金融行业多年，拥有华侨银行、伦敦证券交易所从业经历，丰富的金融机构及高校用户服务与培训实战经验。\n联系信息：\n关于图书馆资源利用问题的咨询与培训，欢迎联系我们：\n联系电话：010-64496105/5195\n邮箱：uibetsg@163.com\n图书馆\n2026年10月20日"}, "455a94c76a4b38f4739eae995edb0803": {"notice_id": "455a94c76a4b38f4739eae995edb0803", "title": "媒体贸大《前线》：对外经济贸易大学 | 千村千企千红 青春...", "source": "新闻网-综合新闻", "category": "行政党务", "publish_time": "2026-10-20", "url": "https://news.uibe.edu.cn/info/1371/144618.htm", "deadline": "", "event_time": "", "summary": "报道贸大千村千企千红社会实践育人成果，无学生待办事项", "content": "北京高校新时代立德树人工程创新实践专题报道\n对外经济贸易大学|千村千企千红青春挺膺担当\n编者按：\n为深入贯彻党的教育方针，落实立德树人根本任务，近日，北京市教育两委联合前线杂志社推出“北京高校新时代立德树人工程创新实践专题报道”（点击查看专题），集中展示北京高校铸魂育人的鲜活实践与创新探索。该专题报道文稿将汇编为《大学生》增刊出版。本期，让我们一同走进对外经济贸易大学。\n对外经济贸易大学团队参观中国工农红军强渡大渡河纪念馆\n对外经济贸易大学始终坚守“为党育人、为国育才”的初心使命，充分发挥党的创新理论主课堂、实践育人大课堂、网络育人新课堂的育人优势，以价值塑造为核心目标，以党建引领为根本保证，以多方协同为重要方法，打造“千村千企千红”新时代高校社会实践育人新范式。\n2023年五四青年节前夕，习近平总书记给中国农业大学科技小院的学生回信，勉励广大青年要“自找苦吃”，学校党委第一时间召开学习总书记回信精神座谈会，黄宝印书记提出要为学生创造“自找苦吃”的环境，鼓励贸大青年“读万卷书，更要行万里路”，正式揭开“千村千企千红”社会实践项目的序幕。3年多来，学校已累计组织1934支实践团队，11758名师生参与，6个项目入选“时代新人强国行”实践育人“四个100”交流展示活动，先后获得团中央“三下乡”社会实践优秀单位、社会实践优秀个人等近百项省部级以上荣誉，该实践项目入选人民网“2024年高校思政课改革创新案例”，有效引领贸大青年学生坚定不移听党话、跟党走，已成为学校深入实施“新时代立德树人工程”的重要抓手。\n理论先行：用党的创新理论指导实践活动筹备工作\n强化顶层统筹，构建“三个课堂”一体推进协同育人体系。学校党委将“千村千企千红”系列社会实践全面纳入学校思政工作大格局，以系统性制度设计强化顶层统筹，建立起由党委统一领导、马克思主义学院提供理论支撑、各职能部门合力推进的协同工作体系，打破以往各条线分头推进、各自为战的工作壁垒，把党的创新理论前置学习、一线实践深度扎根、网络宣传成果转化三个环节串联成完整闭环，推动思政“小课堂”与社会“大课堂”深度衔接、双向赋能，真正实现党的创新理论主课堂、实践育人大课堂、网络育人新课堂一体推进。\n深化制度赋能，把思想准备做在实践的最前端。学校党委深入践行“大思政课”建设理念，专门出台《全面加强“大思政课”建设“157”行动方案》，充分依托马克思主义学院作为北京市习近平新时代中国特色社会主义思想研究中心的核心支撑作用，以“习近平新时代中国特色社会主义思想概论”等核心课程建设为牵引，优化各门思政课的教学联动机制，系统性推动思政育人场域融通、要素联通与主体贯通，逐步构筑起有体系、有质量、有实效的特色“大思政课”育人格局。\n学校将前置理论学习纳入第二课堂学分体系，明确要求所有参与“千村千企千红”社会实践的学生，必须完成0.4学分的实践先修课程，方可开展实践活动。先修课程专门设置党的创新理论模块，既帮助学生筑牢思想根基、提升政治素养，也提前补齐调研方法、产业认知等实践必备能力短板，从源头保障社会实践的深度与实效。\n建强三维专家队伍，以精准化选题设计锚定实践理论导向。学校建立起“马院理论导师+专业党员教师+校外实践导师”的三维专家团队，从实践筹备阶段就全程介入选题设计环节，联合编制发布年度《“千村千企千红”社会实践选题指南》，围绕党的创新理论传播、跨境贸易赋能、红色基因传承等核心方向，梳理兼具理论价值与现实意义的参考选题，从源头强化社会实践的理论深度与专业属性。\n强化党建引领作用，以党员先锋力量筑牢实践红色根基。学校以党建带团建为核心抓手，把发挥党员先锋模范作用贯穿社会实践全过程，选派党员教师担任指导教师，选拔学生党员、入党积极分子作为团队核心骨干，实现本科学生党员100%参与社会实践，让红色力量成为“千村千企千红”实践育人的核心牵引力，让党旗团旗始终在社会实践的一线阵地高高飘扬。\n“薪火川行队”正式出发前，全队利用两周时间系统梳理红军长征四川段行军轨迹，整理飞夺泸定桥、强渡大渡河等重大历史节点的史料，结合本次实地调研目标，提前细化完善访谈提纲与调研方案，为实地实践筑牢理论根基。国际商学院分团委书记李静薇说：“本次实践坚持理论先行，引导同学们带着储备知识、带着问题和思考奔赴实践现场，沉浸式感悟历史、汲取力量、砥砺初心。”\n一线深耕：在基层现场完成实践育人闭环\n对外经济贸易大学团队走访养殖产业基地\n坚持一线深度扎根，以沉浸式实地调研实现实践育人目标。“千村千企千红”社会实践始终把“杜绝摆拍走秀、力戒蜻蜓点水”作为刚性要求，明确所有实践团队实践时间不少于4天，坚决杜绝“打卡式”“观光式”形式主义实践。各实践团队主动深入红色场馆史料库房、乡村种植大棚、企业生产车间，跳出互联网公开资料的信息茧房，与纪念馆讲解员、村民、产业工人深度交流，收集大量鲜活、真实的一手调研素材。针对重点团队，学校要求指导教师全程随队，在调研现场主动嵌入思政引导环节，及时带领学生将亲眼所见的基层发展巨变、亲身感知的产业升级脉动，和新时代国家发展的伟大变革紧密结合起来，让学生在沉浸式的实地体验中完成思想升华，真正实现“行走中受教育、实践中铸初心”的育人效果。\n打通校内外资源链路，以多元支撑体系拓展实践育人边界。学校打破校内各职能部门的资源壁垒，推动团委、学生工作部、研究生工作部、国内合作办公室、校友会、各学院协同联动，打通校内校外资源双向互通渠道。截至目前，学校已累计建成校外社会实践基地136个，聘任校内社会实践导师325人，外聘校友社会实践导师1461人，依托“饮水思源”校友导师专项计划，广大校友不仅为学生提供对口实践岗位、行业一线调研渠道，还通过经费支持、经验分享、职业指导等多种方式，累计资助数十名学生开展定向社会实践，形成了“校内搭台、校友助力、双向赋能”的实践育人良好生态。\n三级矩阵：用传播放大实践育人的声量\n学校将网络宣传作为实践育人的重要延伸环节，搭建起“团队自媒体—校级平台—校外渠道”三级传播矩阵，放大实践育人辐射效应。\n各实践团队依托自建公众号实时更新动态，自主拍摄Vlog记录一线实践日常，在抖音、B站等青年聚集平台发布，带动更多同龄人沉浸式走进红色基地、乡村田野与产业车间；校团委积极对接实践团队宣传素材，聚焦队员们在实践现场的真实经历和鲜活故事，在“青春贸大”“贸大实践”等官方平台推出专题原创内容，用平实笔触记录学子调研细节与现场感悟，不少内容发布后都获得了师生和校友的广泛转发；学校同步推动优质实践成果向外输出，近40个典型案例被《中国教育报》等主流媒体报道，2次代表首都高校入选团中央“返家乡”社会实践视频展播，获评“时代新人强国行”首都大学生社会实践优秀短视频，年均校外媒体报道近百次。\n这种“把实践故事讲出来、传出去”的宣传过程，本身就是一次对青年再深化、再升华的思想教育。很多参与创作的同学表示，在整理素材、撰写稿件的过程中，自己又重新回顾了一遍实践的全过程，之前在现场没有完全想通的问题，在梳理内容的时候反而有了更深刻的理解。原本单支团队的小范围收获，通过传播转化为覆盖全校青年的共享育人资源，让实践育人的影响力突破了线下团队的边界。\n（苗冬青，对外经济贸易大学团委书记；杨意，对外经济贸易大学团委综"}, "4e50bbb68ec34ddeb4d85fa0343f76d5": {"notice_id": "4e50bbb68ec34ddeb4d85fa0343f76d5", "title": "我校举办“中国实践与全球治理”卓越讲坛系列学术活动", "source": "新闻网-综合新闻", "category": "学术活动", "publish_time": "2026-10-20", "url": "https://news.uibe.edu.cn/info/1381/144638.htm", "deadline": "", "event_time": "2025-10-15", "summary": "卓越人才培养学院举办全球治理学术讲座，硕博生参加", "content": "校新闻网讯（卓越人才培养学院供稿）\n为拓宽我校国家卓越社科人才培养基地学生的国际学术视野、夯实全球治理研究素养、培育新时代卓越社科人才，10月15日下午，卓越人才培养学院举办“中国实践与全球治理”卓越讲坛系列学术活动，邀请中国国际贸易促进委员会（以下简称“中国贸促会”）副会长聂文慧作专题报告。本次活动由卓越人才培养学院执行院长杨杭军主持。\n聂文慧以“全球治理与中国担当”为题，立足百年未有之大变局，结合国际经贸、科技产业及地缘格局的前沿动态，为在场师生带来了一场兼具宏观视野与现实关怀的思想盛宴。他从五个维度系统研判了当前全球变革态势：一是地缘政治格局深度调整，全球力量对比呈现“东升西降”趋势，地区冲突频发，国际局势不确定性显著上升；二是全球贸易投资深刻重塑，高关税壁垒凸显，贸易脆弱性增强，人工智能正持续重构全球经贸格局；三是科技产业加速迭代，人工智能、量子科技、生命科学等领域取得突破性进展，全球产业链供应链呈现碎片化、本土化趋势；四是能源矿产格局重构，各国优先保障产供链安全，大宗商品价格高位波动；五是全球治理体系加速变革，传统多边规则受到冲击，区域性贸易规则快速发展。\n在系统梳理全球变局的基础上，报告深入阐释了新时代全球治理中的中国担当。聂文慧指出，构建人类命运共同体已从先进理念上升为国家发展意志，形成了系统完备的科学理论体系，是中国参与全球治理的核心指引。我国正持续深化区域、双边及各领域命运共同体建设，以高质量共建“一带一路”为重要抓手，主动完善多边合作机制、参与全球规则制定，为世界和平发展与全球治理变革贡献中国智慧与中国方案。随后，他详细介绍了中国贸促会在参与全球治理中的实践工作。作为我国对外开放和国际经贸交流的重要窗口，中国贸促会长期深耕多边国际平台，深度对接各类国际组织，在联通国内外市场、服务对外开放、参与全球经贸规则磋商及国际商事调解等方面发挥着不可替代的作用。\n立足卓越人才培养定位，聂文慧勉励青年学子着力锤炼勤学善思的学习力、洞察大势的思想力、躬身实干的行动力、突破创新的创造力、协同协作的沟通力和积极上进的自驱力，努力成长为适配国家对外开放与全球治理事业发展的高素质复合型人才。互动环节中，同学们紧扣讲座主题，结合自身科研学习与未来发展积极提问，与主讲嘉宾进行了深入交流，现场氛围热烈。\n报告结束后，校党委书记黄宝印会见聂文慧一行。双方围绕深化协同育人开展座谈交流，就卓越社科人才培养、学科建设发展、研学平台搭建及产学研融合等议题深入交换意见。黄宝印邀请中国贸促会业务骨干与资深专家走进校园，以“专题实务工作坊”培养模式开展实战训练，为双方共建产教融合人才培养体系奠定坚实基础。\n本次活动紧扣国家全球治理战略与涉外人才培养需求，进一步密切了我校与中国贸促会的协同联动。未来，我校将持续聚焦立德树人根本任务，深耕卓越人才培养体系，搭建更多高水平学术交流与合作平台，引导青年学子立足时代、勤学笃行，着力培养能够深度参与全球治理的新时代卓越涉外人才。\n中国贸促会发展研究部，我校党委办公室/校长办公室、卓越人才培养学院等相关同志出席活动。我校近百名国家卓越社科人才培养基地硕士、博士研究生现场参会。\n（撰稿：曾明月审稿：杨杭军）"}, "132302e47fa6dac8a090837397fafdde": {"notice_id": "132302e47fa6dac8a090837397fafdde", "title": "走好新时代长征路 书写育人新篇章 ——我校开展纪念中国工农红军长征胜利90周年系列活动", "source": "新闻网-综合新闻", "category": "行政党务", "publish_time": "2026-10-20", "url": "https://news.uibe.edu.cn/info/1381/144758.htm", "deadline": "", "event_time": "2026-05-21,2026-07-08,2026-09-15,2026-09-24,2026-10-09,2026-08-03,2026-08-04,2026-08-07,2026-04-23,2026-05-28,2026-09-29,2026-10-15,2026-10-16", "summary": "我校开展纪念长征胜利90周年系列活动，师生参与学习实践", "content": "校新闻网讯（党委宣传部稿）\n2026年，正值中国工农红军长征胜利90周年。伟大长征精神是中国共产党人红色基因和精神谱系的重要组成部分，已深深融入中华民族的血脉和灵魂，跨越时空、历久弥新。习近平总书记强调，“长征永远在路上”，“不论我们的事业发展到哪一步，不论我们取得了多大成就，我们都要大力弘扬伟大长征精神，在新的长征路上继续奋勇前进”。对外经济贸易大学以此为根本遵循，落实立德树人根本任务，将传承弘扬长征精神融入育人全过程，立足思政课堂主阵地，依托社会实践、校园文化多元载体，推动长征精神在师生中入脑入心、见行见效，营造以上率下、师生共学的浓厚氛围。\n以学铸魂，长征精神进课堂\n学校统筹部署，相关学院协同发力，通过课堂讲授、学理研讨，推动长征精神系统融入课堂教学。5月21日，马克思主义学院与北京市东城区教育科学研究院联合主办大中小学思政课教师教学研讨会，小学、初中、高中、大学四个学段教师围绕长征主题同台切磋，探索长征精神融入各学段思政课的分层递进路径。7月8日，学校举办纪念红军长征胜利90周年暨思政课集体备课会，马克思主义学院全体教职工与兼职思政课教师围绕“长征精神入脑入心”展开教学研讨，多位教师进行教学展示。9月15日，校党委书记黄宝印以“弘扬伟大长征精神”为题讲授秋季学期“开学第一课”，从长征基本知识互动问答切入，系统阐释长征精神五个方面的丰富内涵，引导青年学子思考“国家和民族需要的时候如何选择”“面对困难靠什么坚定方向”等问题。9月24日，学校举办“赓续长征红色血脉深耕时代育人实践”学术研讨会，黄宝印书记强调把长征精神转化为铸魂育人的具体实践，四个平行分会场围绕长征精神、思政育人创新、红色文化资源挖掘等议题展开研讨；当天，学校还承办专题思政大课，邀请甘肃会宁会师旧址管委会女子讲解队队长段亚平为近500名师生授课。10月9日，学校再次举办专题思政大课，开国中将孙继先之子孙东宁以“永远的长征”为题讲述父亲从大渡河勇士到导弹司令的长征故事。系列教学研讨与专题思政大课相互支撑，铸魂育人实效持续增强。\n以行践悟，红色基因植沃土\n校领导带队实践、师生广泛参与，把思政小课堂同社会大课堂结合起来。8月3日至7日，黄宝印书记、张小锋副书记带队“青马工程”实践团赴甘肃兰州、白银开展社会实践，在会宁会师旧址重温入党誓词，在长征胜利景园徒步体验“用万分之一的时间走完万分之一长征路”，并召开长征精神主题分享会。百余支团队循着当年长征途经的红色脉络深入全国多地乡村、产业一线，在红色足迹中追寻长征记忆。\n本学期开学以来，学工部依托大学前成长助力计划、新生引航工程和秋季学期主题班会，组织学生走进爱国主义教育基地、参观长征主题展览，在“行走的课堂”中汲取红色力量、传承红色基因；研工部在迎新现场铺开别样“长征路”，设计“重走长征路”主题投壶活动，研究生宣讲团面向新生开展长征精神诵读活动，以声传情重温长征精神。从红色旧址到田间地头，长征精神在亲身实践中焕发活力。\n以赛促学，鲜活形式启新思\n以配音大赛、情景剧展示等竞赛形式，让长征精神在参与体验中入脑入心。4月23日，学工部与保险学院联合举办第十二届红色电影配音大赛，设“重走长征路，赓续红色血脉”主题环节，“星火长征队”凭借《大会师》片段获一等奖，以声音演绎重温长征岁月。5月21日，研工部组织首届研究生党支部风采展示大赛决赛，保险学院研究生第二党支部以原创情景剧《风雪长征路·奋斗正当时》获一等奖，通过1935年夹金山红军战士与2026年研究生党员跨越时空的对话，以艺术化形式诠释长征精神的薪火相传。青年学子在竞技与演绎中加深了对长征精神的理解，学习主动性和创造力得到充分激发。\n以文化人，润物无声浸心田\n展览参观、经典传唱、银龄展演多形式并举，让长征精神在文化浸润中可感可触。9月15日，文学与国际传播学院师生代表参加中国现代文学馆“地球的红飘带——文学中的红军长征”主题展览参观，从长征文学的发生与传播中感悟红色文化的持久生命力。9月29日，离退休人员工作处组织老年合唱团参加第二十八届北京教育系统老同志文艺展演，与中国人民公安大学老同志联唱长征组歌选段《到吴起镇》，原副校长黄震华教授作为老同志代表接受采访，寄语青年学子接过精神接力棒。10月15日，校团委组织“青春为祖国歌唱”红色经典传唱，59名师生选取《十送红军》《我和我的祖国》两首曲目进行校园合唱，以校园地标为背景拍摄短视频，用歌声回望长征峥嵘岁月、厚植家国情怀。10月16日，外语学院与国际商学院联合组织中外学生走进中国共产党历史展览馆，参观“伟大远征——中国工农红军长征档案展”“雪山草地——纪念中国工农红军长征胜利90周年文物专题展”两大主题展览，齐声诵读毛泽东《七律·长征》，铿锵诗句激荡人心。展览、歌声与银龄寄语交相呼应，长征精神在潜移默化中浸润师生心田。\n以专赋能，学以致用续薪火\n各学院结合学科专业特色，推动长征精神与专业教育深度的融合。5月28日，外语学院组织法语、俄语、日语翻译课程研究生赴中国共产党历史展览馆开展思政翻译实践课，在长征全景视频前读懂长征精神，并结合展区史料开展现场翻译实训。8月4日，法学院依托“读懂中国”系列访谈，邀请王军教授结合从教治学经历讲述长征精神在学术坚守与涉外法治人才培养中的当代回响。专业所学与红色教育相互滋养，长征精神在学以致用中绽放新的时代光彩。\n九十年前，红军将士以血肉之躯丈量信仰的高度，用万里征程铸就历史的丰碑；九十年后，贸大师生脚下有方向、心中有信念，在重温那段烽火岁月中续写新的荣光。精神的传承永无止境。站在新的历史起点上，贸大人将始终以伟大长征精神为指引，把初心的力量转化为前行动力，把艰苦奋斗融入育人实践，在建设教育强国的征程上，走好属于这一代人的长征路！\n（撰稿：赵文凤审稿：陶好飞乔雪竹）"}, "1f6b257a611efb7de656abc613f1b625": {"notice_id": "1f6b257a611efb7de656abc613f1b625", "title": "教务处召开新一代综合教务系统建设工作例会-部门动态-对外经济贸易大学教务处", "source": "教务处-部门动态", "category": "行政党务", "publish_time": "2026-10-20", "url": "http://jwc.uibe.edu.cn/bmdt/4cc4bab9f4d140e5a14feb1e4243ad6d.htm", "deadline": "", "event_time": "2026-10-19", "summary": "教务处召开教务系统建设例会，讨论验收等工作", "content": "教务处|摄影：教务处|日期：2026-10-20|访问量：\n2026年10月19日下午14点，教务处处领导、相关业务科室负责人及开发公司项目组在诚信618会议室召开新一代综合教务系统建设例会。\n会上，开发公司项目组汇报了本周工作进展与下周计划，会议重点讨论了系统验收、进修访学学生等相关工作。会议明确了解决上述问题的下一步工作方案，并落实了各项任务的牵头负责人。\n最后，处领导总结发言，强调本学期系统建设工作坚持稳中求进、有序推进，持续迭代优化各功能模块。\nCopyRight©版权所有：对外经济贸易大学教务处，ALLRightsReserved\n北京市朝阳区惠新东街10号邮编：100029"}, "97403d60ddc79a89f1d4026a23fe5998": {"notice_id": "97403d60ddc79a89f1d4026a23fe5998", "title": "2026年下半年同等学力申请硕士学位专业知识水平认定结果公示", "source": "研究生院-学位与学科", "category": "教务通知", "publish_time": "2026-10-20", "url": "http://yjsy.uibe.edu.cn/cms/infoSingleArticle.do?articleId=7936&columnId=2064", "deadline": "2026-10-23", "event_time": "", "summary": "同等学力申硕专业知识认定结果公示，异议反馈10月23日截止", "content": "2026年下半年同等学力申请硕士学位专业知识水平认定审核工作已经结束，现将通过名单予以公示。申请人可在“贸大同力”系统中查看具体审核情况。认定结果不通过的，可查询不通过具体原因。\n点击查看：2026年下半年专业知识水平认定结果公示.pdf\n公示期为自本通知发布之日起至2026年10月23日17:00止。公示期间，任何组织及个人如对通过名单有异议，请与同等学力办公室联系并以实名提出有效证据及合理建议，以书面形式实名反馈至xwb@uibe.edu.cn。逾期原则上不再予以受理。\n公示结束后，申请人可联系所在学院，完成师生互选并按学院要求开展开题（点击查看：对外经济贸易大学开题评审管理办法）、学位论文写作等流程，后附各学院联系方式。\n申请人应在通过专业知识水平认定后的一年内提交学位论文，并在提交论文后的半年内完成论文答辩。 \n \n各学院联系方式：\n学院\n负责老师\n电话\n国际经济贸易学院\n李老师\n010-64493303\n中国金融学院\n王老师\n010-64494968\n国际商学院\n孟老师\n010-64494198\n法学院\n陈老师\n010-64495084\n英语学院\n刘老师\n010-64494445\n政府管理学院\n张老师\n010-64492215\n保险学院\n丁老师\n010-64493585\n统计学院\n王老师\n010-64497209\n经济学院\n马老师\n010-64492019\n \n研究生院同等学力办公室 \n2026年10月20日"}, "c1c093f8237eb101726a1216f6903055": {"notice_id": "c1c093f8237eb101726a1216f6903055", "title": "媒体贸大《光明日报》：（吴卫星）AI来了，财经专业还学什...", "source": "新闻网-综合新闻", "category": "其他", "publish_time": "2026-10-19", "url": "https://news.uibe.edu.cn/info/1371/144588.htm", "deadline": "", "event_time": "2026-10-16", "summary": "《光明日报》报道AI赋能财经教育研讨会，吴卫星校长发言", "content": "（\n来源：《光明日报》2026-10-19\n）\n10月16日，人工智能赋能高等财经教育学术研讨会在南京召开。来自全国37所院校的80多名代表围绕人工智能冲击下高等财经教育转型路径、新财经人才培养、数据安全与伦理等议题展开研讨。会议讨论的一个焦点是：当人工智能改变知识生产方式，财经教育的专业边界、能力标准和科研组织方式该如何调整。\n研讨会的讨论从专业边界开始。南京财经大学党委书记俞锋在致辞中给出了一所财经大学的实践切口：学校把“人工智能+”作为撬动高质量发展的战略支点，增设“智慧粮食工程”“计算金融”等交叉学科专业，发布国内首个粮食安全学科专用大模型“财廪通”和“经纬”经济统计智能决策大模型，“智探粮芯”“智粮元界”“粮食医院”等一批AI驱动项目崭露头角。这些名字听起来不太像传统财经专业，却指向同一个判断：人工智能正在重构财经学科的知识边界，专业建设要从“单科深耕”走向“交叉融通”，在学科交叉地带培育新的学科增长极。\n这一判断在研讨会上得到多所高校回应。\n对外经济贸易大学校长吴卫星\n认为，AI赋能财经教育要直面学科交叉、数智素养、人才定位三大现实挑战，坚持价值引领与技术赋能并重，推动人才培养从学科“物理相加”迈向能力“化学相融”。浙江工商大学校长王永贵则把目光投向课程与产业前沿的对接：开设“学得透”“懂中国”的一流核心课程，依托传帮带机制打造“教得了”的一流核心教师团队，依托商学智脑与虚拟仿真平台落实“用得上”的一流核心实践项目，构建知识、实践、伦理相统一的人才培育框架。专业调整只是起点，课程、师资、实践项目能否同步重构，才是交叉融通能否落地的关键。\n比专业调整更深一层的是能力标准。AI替代的是可编码的知识，财经人才的价值则要向“判断”迁移。俞锋提出，培养模式要从“知识传授”走向“能力生成”，重点培养学生的选择判断力、深度提问力、重构创新力，把机器的智能转化为人才的核心价值、关键技能。西南财经大学副校长周铭山提出，拔尖人才培养要实现从知识导向到问题驱动的范式跃迁，引导学生破解现实经济问题，依托项目化教学、书院育人，构建可复制的培养闭环。东北财经大学校长汪旭晖把商科转型概括为“数智蝶变、脱虚向实”：不能止步于技术应用，要推动教育范式革新，顺应智联融通、人机协同等新趋势，推动课程由知识模块导向转向管理问题导向。财经教育面临的不是“加几门AI课”的局部修补，而是从知识库存型培养转向问题驱动型培养的系统调整。\n技术越深入，底线问题越无法回避。中央财经大学副校长李建军则提醒，数据成为核心战略资产的同时，数据流通风险、责任界定难题随之凸显。财经领域的数据治理需要技术、制度、伦理协同发力，依托可信数据空间、隐私计算实现原始数据不出域，坚持伦理设计前置，关键业务保留人类最终决策权。上海财经大学靳玉英教授介绍了无边界财经大学建设实践：依托“匡时”大模型、九大AI服务平台筑牢数智底座，以赛教融合、校企协同赋能学科建设，为同类院校数智转型提供参考。数据安全与伦理不是财经教育的外围话题，而是数智财经发展的底线。\n研讨会释放的另一个信号是科研组织方式的变化。俞锋提出，人工智能正在改变科研创新的组织方式，学术合作要从“各自为战”走向“协同攻坚”，财经类高校应主动走出校门，推动产业链创新链深度融合，在协同攻关中凝聚服务强国建设的学术共同体、研究共同体。中国高等教育学会高等财经教育分会执行副主任委员李建军在致辞中表示，人工智能正在重塑知识生产方式与人才培养模式，高等财经教育面临系统性变革。分会将发挥平台纽带作用，推进AI课程、教材、师资建设与资源共享；高校应积极对接国家战略，培养能够驾驭人工智能、解决复杂问题的高素质复合型人才，同时守好人工智能伦理底线，防范智能决策风险。\n圆桌论坛上，与会嘉宾呼吁以技术变革推动学科、专业、育人体系重塑，培育适配数字经济与新质生产力的复合型财经人才。从专业边界到能力标准，再到数据伦理与科研组织，转型的轮廓在讨论中逐渐清晰。\n附原文链接：\nhttps://mp.weixin.qq.com/s/wMFcnksWcMNbjtsYjVQm5A"}, "portal_10041395622174720": {"notice_id": "portal_10041395622174720", "title": "关于举办第四届全国大学生职业规划大赛校内选拔赛的通知", "source": "招生就业处", "category": "比赛竞赛", "publish_time": "2026-10-16", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=10041395622174720", "deadline": "2026-11-13", "event_time": "2026-10-01,2026-12-31", "summary": "面向本科生和研究生开展职业规划大赛校内选拔，11月13日报名截止", "content": "各学院：根据《教育部关于举办第四届全国大学生职业规划大赛的通知》（教学函〔2026〕2号）文件要求，强化高校生涯教育和就业指导，助力大学生增强职业规划意识，指导其通过学习实践提升综合素质和能力，及早做好就业准备，以择业新观念打开就业新天地，促进高质量充分就业。我校定于2026年10月至2026年12月举办第四届全国大学生职业规划大赛校内选拔赛。现将有关事项通知如下。一、大赛主题筑梦青春志在四方，规划启航职引未来。二、大赛时间2026年10月—2026年12月三、组织机构主办单位：招生就业处校内赛设立组委会，由校内就业指导老师、行业专家、校外就业指导专家组成，负责赛事评审工作，指导我校学生参赛。四、大赛内容（一）主体赛事1.成长赛道。面向本科非毕业年级（大一、大二、大三）学生，考察学生树立生涯发展理念并合理设定职业目标、围绕实现目标持续行动并不断调整的成长过程，通过学习实践提升综合素质和专业能力，体现正确的择业就业观念。2.就业赛道。面向本科高年级计划求职学生（大三、大四，不含已通过推免获得录取资格的学生）、全体第二学士学位学生和研究生。考察学生求职实战能力，个人综合素质、专业能力与目标职业的契合度，个人发展路径与就业市场需求的适应度。参赛学生可获得岗位录用意向。五、赛程材料要求参赛选手通过全国大学生职业规划大赛平台（以下简称大赛平台，网址：zgs.chsi.com.cn）进行报名，提交参赛材料。（一）成长赛道1.生涯发展报告：介绍设定职业目标的过程；实现职业目标的具体行动和成效；职业目标及行动的动态调整等（PDF格式，不超过10M，文字不超过2000字，图表不超过5张）。2.生涯发展展示（PPT格式，不超过50MB）。（二）就业赛道1.求职简历（PDF格式）。2.求职综合展示（PPT格式，不超过50MB）。3.辅助证明材料，包括实践、实习、获奖等证明材料（PDF格式，整合为单个文件，不超过10MB）。六、赛程安排大赛分学院选拔、校级复赛和校级决赛3个阶段。主要时间安排如下：（一）校级初赛所有报名参赛的选手均需在大赛平台（网址：zgs.chsi.com.cn）进行报名并提交参赛材料，在国家大赛平台登录页面可下载学生操作手册。各学院认真组织动员学生报名参赛，学生需通过国家大赛平台报名并提交参赛材料，同步提交至学院，学生参赛报名截止时间为2026年11月13日17:00。"}, "portal_8490918697406464": {"notice_id": "portal_8490918697406464", "title": "一周校园就业招聘和指导安排（2026.10.12-10.16）", "source": "招生就业处", "category": "就业实习", "publish_time": "2026-10-12", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=8490918697406464", "deadline": "", "event_time": "", "summary": "招生就业处发布一周校园招聘和指导活动安排，学生可参加", "content": "招生就业处一周校园就业招聘和指导安排（2026.10.12-10.16）序号活动日期活动时间活动名称活动类型活动地点110月12日周一上午09:30-11:30山东省选调生招录政策宣讲宣讲会求真楼3192下午14:30-16:30“惠”就业课堂（第44期）——北京事业单位考试考情分析及备考指导就业指导活动求真楼一层招聘大厅3下午14:30-16:30中兴通讯2027届校园招聘宣讲会求真楼3194晚上18:30-20:30建发股份2027届秋招校园宣讲会宣讲会求真楼319510月13日周二上午09:30-10:30山东高速集团有限公司校园招聘对外经济贸易大学专场宣讲宣讲会求真楼一层招聘大厅6上午10:30-11:30山东高速集团有限公司校园招聘对外经济贸易大学专场双选会（总第十一场）双选会求真楼一层招聘大厅7上午09:30-10:30CVTE视源股份2027届商务职能类招聘宣讲会宣讲会求真楼401A8下午14:00-15:00中国平安2027全球校园招聘宣讲会宣讲会求真楼3199下午15:00-16:00中国平安2027全球校园招聘双选会（总第十二场）双选会求真楼一层招聘大厅10晚上18:30-20:30顾家家居股份有限公司2027届校园招聘宣讲会宣讲会求真楼31911晚上18:30-20:30吉林银行2027届秋季校园招聘宣讲会求真楼401A12晚上18:30-20:30大众汽车金融服务（中国）2027届校园招聘宣讲会求真楼一层招聘大厅1310月14日周三上午09:30-11:30广州银行股份有限公司2027年校园宣讲会宣讲会求真楼31914上午09:30-11:30中国联通天津市分公司2027对外经贸大学校园招聘宣讲会宣讲会求真楼一层招聘大厅15下午14:30-16:30兖矿能源集团股份 、培训内容“工作流核心节点讲解+MCP插件介绍+进阶智能体搭建”——掌握进阶能力，搭建“能做事”的智能体四、重要提示1.大赛报名截止时间为2026年10月30日，尚未报名的团队请及时登录【大赛官网】（https://aihome.uibe.edu.cn/competitionIndex）完成线上报名。2.已报名的师生可微信扫描下方二维码，激活智能体开发平台的开发者权限（已激活师生无需重复操作），提交信息后待审核开通。3.本次大赛配套上线“智能应用大赛服务助手”，可解答大赛报名、培训、智能体搭建等相关问题，请点击链接或扫码访问：https://aihome.uibe.edu.cn/shareBotChat/dalkoq4a6jhs72plmrdg4.赛事相关信息将在赛事官方QQ群内发布，请尚未加入赛事群的师生尽快入群。赛事官方QQ群：1121090025（入群备注学号/教工号+姓名）网络安全和信息化处2026年10月8日"}, "portal_7150401922785280": {"notice_id": "portal_7150401922785280", "title": "关于办理2026-2027学年校园地国家助学贷款的通知", "source": "学工部", "category": "奖助学金", "publish_time": "2026-10-08", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=7150401922785280", "deadline": "2026-10-12", "event_time": "", "summary": "家庭经济困难学生需10月12日前提交汇总表并10月14-15日现场办理助学贷款", "content": "各培养单位、相关学生：根据《教育部等四部门关于调整完善助学贷款有关政策的通知》（财教〔2023〕4号）要求，结合我校实际，现组织开展2026-2027学年校园地国家助学贷款办理工作。相关事项通知如下：一、办理对象申请校园地国家助学贷款的学生须为经过本学年家庭经济困难认定的本科生、研究生、预科生。二、办理安排1. 前序工作：为保证本学年申请新办校园地国家助学贷款学生顺利完成贷款签约，需先开展银行卡开卡工作，由经办行中国银行工作人员前来学校，现场办理开卡及申请校园地国家助学贷款。根据经办行要求，开卡前需在银行系统核验开卡资格。请所有申请办理校园地国家助学贷款的学生（含新办和续贷）填写汇总表（附件1），并扫码加入“2026年校园地国家助学贷款办理群”（附件2）。2.资格核验：由银行核验学生开卡资格，如有问题会直接跟学生取得联系，为学生线下开卡做好准备，确保办理当天的助学贷款申请材料填写及签约事宜顺利进行。3.现场办理：请全体办理校园地国家助学贷款的学生（含首贷和续贷）于10月14日（周三）、15日（周四）9:00-12:00、13:00-16:30前往求真楼202A现场办理。4.到场需携带：①本人最新身份证；②学生证或录取通知书（显示学制）；③手机（确保手机号为本人实名制手机号，并提前下载“中国银行”手机APP）。三、办理流程 四、工作要求1.根据最新政策文件精神，学生申请的国家助学贷款应优先用于支付在校期间学费和住宿费，超出部分可用于弥补日常生活费用。请各学院通知相关学生提前了解政策。往年线下办理过校园地国家助学贷款的学生如有提额需要，需线上申请，具体流程咨询经办银行即可。2.已申请生源地助学贷款的学生不得同时再申请校园地国家助学贷款。3.请各培养单位于10月12日（周一）上午10点前，本研分别以学院/研究院为单位汇总提交附件1的汇总表电子版，本科生汇总表发送至uibexszz@uibe.edu.cn；研究生汇总表发送至uibeygbjz@uibe.edu.cn。4.请相关学生提前安排好时间，及时办理并关注群内通知，未入群的同学请通过学院联系资助中心及时进群。 咨询电话：010-64688699，010-64689535（中国银行）010-64494008（本科生、预科生），010-64496803（研究生） 附件1：2026年校园地助学贷款申请信息汇总表.xlsx"}, "portal_7145822500589568": {"notice_id": "portal_7145822500589568", "title": "关于启动2027年大学生创新训练计划申报工作的通知", "source": "创新创业中心", "category": "科研项目", "publish_time": "2026-10-09", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=7145822500589568", "deadline": "2026-10-30", "event_time": "", "summary": "全日制在读本科生申报2027年大学生创新训练计划，10月30日17:00截止", "content": "各学院、各位同学：为深入贯彻落实《国务院办公厅关于进一步支持大学生创新创业的指导意见》《国务院办公厅关于深化高等学校创新创业教育改革的实施意见》等文件要求，进一步深化新发展阶段高校创新创业教育改革，根据教育部、北京市相关工作要求，现启动我校2027年大学生创新训练计划申报立项工作，有关事项通知如下：一、申报项目类型1.创新训练项目：本科生个人或团队在导师指导下，自主完成创新性研究项目设计、研究条件准备和项目实施、研究报告撰写、成果(学术)交流等工作。创新训练项目可以是具有较强创新特色的概念、产品或服务设计（如：金融产品、文化产品、学习方法等）、学术理论构建、管理制度设计、校园文化活动策划等。2.创业训练项目：本科生团队在导师指导下，团队中每个学生在项目实施过程中扮演一个或多个具体角色，完成商业计划书编制、可行性研究、企业模拟运行、撰写创业报告等工作。与创新训练项目相比，创业训练项目更侧重商业运作过程。3.创业实践项目：学生团队在学校导师和企业导师共同指导下，采用创新训练项目或创新性实验等成果，提出具有市场前景的创新性产品或服务，以此为基础开展创业实践活动。与创业训练相比，创业实践项目更侧重真实落地、注册成立公司情况以及实效。二、申报原则及要求1.申报人员须为我校全日制在读本科生。每名学生每年度最多申报1个项目，每个项目限1名负责人，项目团队人数不少于3人，不超过10人（含负责人）；2.申报项目须积极报名参加学校组织的各类创新创业大赛，提升项目质量；3.立项后原则上不得终止，如果项目在非客观原因情况下终止，将取消负责人未来申报资格，并视情况对团队成员未来申报资格进行严格考察，没有终止记录及确因客观原因终止的项目，负责人及成员可正常申报后续年度的项目；4.项目立项后，创新创业中心将定期组织项目进度检查，负责人须按要求填报相关检查材料，不按要求参加检查的项目，创新创业中心有权对项目进行中止；5.已申报过的往届项目不得重复申报。三、申报及评审程序1.申报时间：即日起至10月30日下午17：00。2.申报方式：项目负责人登录贸创云平台http://202.204.175.120/（推荐使用360浏览器）填报项目及成员信息（密码：Uibe@身份证后八位，或身份证后八位，再或Uibe@123456）。根据项目属性选择“创新训练项目”-选A/“创业训练项目”-选B/“创业实践项目”"}}};</script>
<script>

const TODAY = DATA.today;

function dayDiff(d){                       // 距离今天还有几天
  if(!d) return null;
  const a = new Date(d+"T00:00:00"), b = new Date(TODAY+"T00:00:00");

}

    if(n!==null && n<0) return `⏰ 活动已于 ${m[0]} 结束`;
  }
  return `⏰ ${ev}`;
}
function isVideoOrNews(){ return false; }

/* ================== 状态 ================== */
const S = {
  no:null, page:"dashboard", section:null,
  calY:Number(TODAY.slice(0,4)), calM:Number(TODAY.slice(5,7)), calSel:null,
  open:{}, msg:""
};
let U = null;      // 当前用户快照
let ST = null;     // 本地状态

/* 存储降级：某些环境（Safari 打开本地文件、微信内置浏览器、无痕模式）
   访问 localStorage 会直接抛异常，若不兜底会导致整页白屏 */
const __MEM = {};
const LSOK = (function(){
  try { localStorage.setItem("__probe__","1"); localStorage.removeItem("__probe__"); return true; }
  catch(e){ return false; }
})();
function lsGet(k){ try { return LSOK ? localStorage.getItem(k) : (__MEM[k]||null); } catch(e){ return __MEM[k]||null; } }
function lsSet(k,v){ try { if(LSOK) localStorage.setItem(k,v); else __MEM[k]=v; } catch(e){ __MEM[k]=v; } }
function lsDel(k){ try { if(LSOK) localStorage.removeItem(k); else delete __MEM[k]; } catch(e){ delete __MEM[k]; } }

function defaultState(u){
  return {
    reads: (u.reads||[]).slice(),
    follows: (u.favs||[]).map(x=>x.notice_id),
    blocks: (u.trash||[]).map(x=>x.notice_id),
    todos: (u.todos||[]).map(t=>({...t}))
  };
}
function loadState(no){
  const raw = lsGet(LS+no);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return defaultState(DATA.users[no]);
}
function saveState(){ if(S.no) lsSet(LS+S.no, JSON.stringify(ST)); }

/* ================== 数据派生 ================== */
const idx = (id)=>DATA.index[id]||{title:"（通知已移除）",source:"",category:"",publish_time:"",url:"",deadline:"",event_time:"",content:""};
const full = (it)=>({...idx(it.notice_id), ...it});
const blocked = (id)=>ST.blocks.includes(id);
const followed = (id)=>ST.follows.includes(id);
const isRead = (id)=>ST.reads.includes(id);

function visible(list){ return (list||[]).filter(x=>!blocked(x.notice_id)); }
function favList(){ return ST.follows.map(id=>({notice_id:id})); }
function todoOpen(){ return ST.todos.filter(t=>!t.done); }

/* 日历条目：关注的活动（有截止日、未过期）+ 未完成待办 */
function datedItems(){
  const out = [];
  for(const id of ST.follows){
    const n = idx(id);
    const left = dayDiff(n.deadline);
    if(n.deadline && left!==null && left>=0) out.push({kind:"notice", ...n});
  }
  for(const t of ST.todos){
    const left = dayDiff(t.due);
    if(!t.done && t.due && left!==null && left>=0) out.push({kind:"todo", ...t, deadline:t.due});
  }
  return out.sort((a,b)=> (a.deadline||"").localeCompare(b.deadline||""));
}
function dueSoon(){
  return datedItems().filter(x=>{ const l=dayDiff(x.deadline); return l!==null && l>=0 && l<=3; });
}

/* ================== 渲染：卡片 ================== */
function chipOf(level){
  if(level==="重点") return `<span class="chip key">🔥 重点</span>`;
  if(level==="推荐") return `<span class="chip rec">⭐ 推荐</span>`;
  return `<span class="chip normal">普通</span>`;
}
function noticeCard(it){
  const n = full(it);
  const id = n.notice_id;
  const fav = followed(id), blk = blocked(id), rd = isRead(id);
  const open = !!S.open[id];
  const hasBody = (n.content||"").length>60;
  const meta = [];
  if(n.source) meta.push(`来源 <b>${esc(n.source)}</b>`);
  if(n.category) meta.push(`分类 <b>${esc(n.category)}</b>`);
  if(n.publish_time) meta.push(`发布 ${esc(n.publish_time)}`);
  if(n.deadline) meta.push(`截止 <b>${esc(n.deadline)}</b>（${dlTag(n.deadline)}）`);
  if(n.event_time) meta.push(esc(eventLabel(n.event_time)));

  return `<div class="ncard ${rd?"read":""}">
    <div>${it.score?chipOf(it.level):""} ${(!rd && it.level && it.level!=="普通")?'<span class="chip new">🆕 未读</span>':""}</div>
    <h4>${esc(n.title)}</h4>
    <div class="meta">${meta.join("　")}</div>
    <div class="btns">
      <button class="btn ${fav?"on":""}" data-act="follow" data-id="${esc(id)}">${fav?"⭐ 已关注":"⭐ 关注"}</button>
      <button class="btn ${blk?"on":""}" data-act="block" data-id="${esc(id)}">${blk?"🚫 已暂不关注":"🚫 暂不关注"}</button>
      <button class="btn" data-act="read" data-id="${esc(id)}">${rd?"↩︎ 标未读":"✅ 已读"}</button>
      ${n.url?`<a class="btn" href="${esc(n.url)}" target="_blank" rel="noopener">🔗 原文</a>`:""}
      ${hasBody?`<button class="btn ghost" data-act="body" data-id="${esc(id)}">${open?"📄 收起正文":"📄 展开正文"}</button>`:""}
    </div>
    ${open?`<div class="body">${esc((n.content||"").slice(0,3000))}</div>`:""}
  </div>`;
}
function emptyBox(text, sub){
  return `<div class="info">${esc(text)}${sub?`<div style="margin-top:6px;color:#6c86a8;font-size:.84rem">${sub}</div>`:""}</div>`;
}

/* ================== 渲染：页面 ================== */
function renderDashboard(){
  if(S.section){
    const map = {
      key: ["### 🔥 重点关注", visible(U.key), "暂无高匹配度的紧急信息"],

    </div>`).join("");

      <div class="hero-sub">以下是近 ${DATA.window_days} 天学校发布、与你相关的校园信息，点击下方分区卡片查看具体内容</div>
    </div>

      <div class="meta" style="margin:4px 0 10px">已关注的校园通知 + 自己填写的待办，在 3 天内（含今天）截止</div>

    </div>
    <hr class="sep">

/* 本地时间字符串（用于记录"哪天勾选完成"） */
function nowLocal(){
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/* 某一天要截止的事：关注的通知 + 未完成待办 */
function dayPending(date){
  const out = [];
  for(const id of ST.follows){
    const n = idx(id);
    if(n.deadline === date) out.push({kind:"notice", ...n});
  }
  for(const t of ST.todos){
    if(!t.done && t.due === date) out.push({kind:"todo", ...t, deadline:t.due});
  }
  return out;
}
/* 某一天完成的事：按勾选完成的那天归组，历史长期保留 */
function dayDone(date){
  return ST.todos.filter(t=>t.done && String(t.done_at||"").slice(0,10)===date);
}
function doneMapAll(){
  const m = {};
  for(const t of ST.todos){
    if(!t.done) continue;
    const d = String(t.done_at||"").slice(0,10);
    if(d) (m[d] = m[d]||[]).push(t);
  }
  return m;
}

/* 当天详情弹窗 */
function dayModal(date){
  if(!date) return "";
  const pend = dayPending(date), done = dayDone(date);
  const wd = ["日","一","二","三","四","五","六"][new Date(date+"T00:00:00").getDay()];

  const rowsP = pend.map(it=>{
    const isTodo = it.kind==="todo";
    const tag = isTodo ? `<span class="tag">我的待办</span>`
                       : `<span class="tag">${esc(it.category||"通知")}</span>`;
    const sub = [];
    if(it.note) sub.push(esc(it.note));
    if(it.event_time) sub.push(esc(eventLabel(it.event_time)));
    sub.push(dlTag(date));
    const link = (!isTodo && it.url) ? `　<a href="${esc(it.url)}" target="_blank" rel="noopener">原文</a>` : "";
    return `<div class="day-row">${isTodo?"📝 ":""}<b>${esc(it.title)}</b>${tag}${link}
      <div class="sub">${sub.join("　")}</div></div>`;
  }).join("");

  const rowsD = done.map(t=>{
    const tm = String(t.done_at||"").slice(11,16);
    const sub = [];
    if(tm) sub.push("完成于 "+tm);
    if(t.due) sub.push("原定 "+esc(t.due)+" 截止");
    if(t.note) sub.push(esc(t.note));
    return `<div class="day-row"><b>${esc(t.title)}</b>
      <div class="sub" style="color:#1f7a4d">${sub.join("　")}</div></div>`;
  }).join("");

  return `<div class="modal" data-act="cal-mask">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <div class="modal-date">${date.replace(/-/g," / ")}　周${wd}</div>
          <div>
            <span class="day-chip chip-pend">⏰ 当天截止 ${pend.length} 项</span>
            <span class="day-chip chip-done">✅ 当天完成 ${done.length} 项</span>
            <span class="day-chip" style="background:#f4f7fc;color:#7d9cc4">${dlTag(date)||"—"}</span>
          </div>
        </div>
        <button class="modal-x" data-act="cal-close" title="关闭">✕</button>
      </div>
      ${pend.length?`<div class="day-sec">⏰ 这一天要截止的事</div>${rowsP}`:""}
      ${done.length?`<div class="day-sec done">✅ 这一天完成的事</div>${rowsD}`:""}
      ${(!pend.length && !done.length)?`<div class="day-empty">这一天没有截止事项，也没有完成记录。</div>`:""}
    </div>
  </div>`;
}

function renderCalendar(){
  const items = datedItems();
  const doneAll = doneMapAll();
  const first = new Date(S.calY, S.calM-1, 1);
  const startPad = (first.getDay()+6)%7;                 // 周一为第一列
  const daysInMonth = new Date(S.calY, S.calM, 0).getDate();
  const prevDays = new Date(S.calY, S.calM-1, 0).getDate();

  const byDate = {};
  for(const it of items){
    const d = it.deadline;
    if(!d) continue;
    const y = Number(d.slice(0,4)), m = Number(d.slice(5,7));
    if(y===S.calY && m===S.calM) (byDate[d] = byDate[d]||[]).push(it);
  }

  const cells = ["一","二","三","四","五","六","日"].map(w=>`<div class="cal-cell cal-head-cell">${w}<span></span></div>`);
  for(let i=startPad-1;i>=0;i--) cells.push(`<div class="cal-cell cal-out">${prevDays-i}<span></span></div>`);
  for(let d=1; d<=daysInMonth; d++){
    const key = `${S.calY}-${String(S.calM).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const p = (byDate[key]||[]).length;
    const k = (doneAll[key]||[]).length;
    let cls = "cal-cell click";
    if(key===TODAY) cls += " cal-today";
    else if(p && k) cls += " cal-both";
    else if(p) cls += " cal-has";
    else if(k) cls += " cal-done";
    if(S.calSel===key) cls += " cal-sel";
    let badge = "";
    if(p && k) badge = `⏰${p} ✅${k}`;
    else if(p) badge = `${p} 项`;
    else if(k) badge = `✅${k}`;
    cells.push(`<div class="${cls}" data-act="cal-day" data-date="${key}" title="${key}：截止 ${p} 项 · 完成 ${k} 项">${d}<span>${badge}</span></div>`);
  }
  const tail = (7 - (startPad+daysInMonth)%7)%7;
  for(let i=1;i<=tail;i++) cells.push(`<div class="cal-cell cal-out">${i}<span></span></div>`);

  const groups = {};
  for(const it of items) (groups[it.deadline] = groups[it.deadline]||[]).push(it);
  const nNotice = items.filter(x=>x.kind==="notice").length;
  const nTodo = items.length - nNotice;

  const listHtml = items.length ? Object.keys(groups).sort().map(date=>{
    const rows = groups[date].map(it=> it.kind==="todo"
      ? `<div class="dl-item">📝 <b>${esc(it.title)}</b><span class="tag">我的待办</span>${it.note?`<span class="note">　${esc(it.note)}</span>`:""}</div>`
      : `<div class="dl-item"><b>${esc(it.title)}</b><span class="tag">${esc(it.category||"通知")}</span>${it.event_time?`<span class="note">　${esc(eventLabel(it.event_time))}</span>`:""}　${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">原文</a>`:""}</div>`
    ).join("");
    return `<div class="dl-group"><div class="dl-date">${date}<span class="dl-left">${dlTag(date)}</span></div>${rows}</div>`;
  }).join("") : emptyBox("你还没有关注任何「有截止日期」的活动，也没有填写待办。",
      "· 去首页给关心的事项点「⭐ 关注」，或 · 到「📝 我的待办」填写自己的截止事项");

  const doneTotal = Object.keys(doneAll).reduce((s,d)=>s+doneAll[d].length,0);

  return `<h2 class="page-title">📅 截止日历</h2>
    <div class="page-sub">点日历上的任意日期，即可查看当天的截止事项和完成记录；过期未完成的会自动消失</div>
    <div class="card">
      <div class="cal-head">
        <div class="cal-month">${S.calY} 年 ${S.calM} 月</div>
        <div class="cal-nav">
          <button data-act="cal" data-step="-1">‹</button>
          <button data-act="cal" data-step="1">›</button>
        </div>
      </div>
      <div class="cal-legend">
        <span><i style="background:#dbe7f8;border-color:#cddef5"></i>有截止事项</span>
        <span><i style="background:#e2f5e9;border-color:#c3e8d2"></i>当天已完成</span>
        <span><i style="background:linear-gradient(100deg,#dbe7f8 0%,#dbe7f8 55%,#e2f5e9 55%,#e2f5e9 100%);border-color:#cbdff0"></i>两者都有</span>
        <span><i style="background:#2f6bb0;border-color:#2f6bb0"></i>今天</span>
      </div>
      <div class="cal-grid">${cells.join("")}</div>
    </div>
    <hr class="sep">
    <h3 class="sec">📌 截止清单（共 ${items.length} 项：关注的 ${nNotice} · 我的待办 ${nTodo}）</h3>
    ${listHtml}
    ${doneTotal?`<hr class="sep">
    <h3 class="sec">✅ 近期完成记录（共 ${doneTotal} 项，点日历任意日期可看当天详情）</h3>
    ${Object.keys(doneAll).sort().reverse().slice(0,15).map(date=>`
      <div class="dl-item"><span style="color:#1f7a4d;font-weight:700">${date}</span>
      ${doneAll[date].map(t=>`<b>${esc(t.title)}</b>${String(t.done_at||"").slice(11,16)?`<span class="note">　${esc(String(t.done_at).slice(11,16))}</span>`:""}`).join("　·　")}
      </div>`).join("")}`:""}
    ${dayModal(S.calSel)}`;
}

function renderTodos(){
  const groups = {over:[], soon:[], rest:[], done:[]};
  for(const t of ST.todos){
    if(t.done){ groups.done.push(t); continue; }
    const l = dayDiff(t.due);
    if(l===null){ groups.rest.push(t); }
    else if(l<0) groups.over.push(t);
    else if(l<=3) groups.soon.push(t);
    else groups.rest.push(t);
  }
  const row = (t)=>`<div class="todo ${t.done?"done":""}">
      <button class="icon" data-act="todo-done" data-id="${esc(t.id)}" title="${t.done?"标为未完成":"完成"}">${t.done?"✅":"⬜"}</button>
      <div class="t-title">${esc(t.title)}${t.note?`<div class="note">${esc(t.note)}</div>`:""}</div>
      <div class="t-due">${t.due?`${esc(t.due)}${t.done?"":` · ${dlTag(t.due)}`}`:"未设日期"}</div>
      <button class="icon" data-act="todo-del" data-id="${esc(t.id)}" title="删除">🗑️</button>
    </div>`;
  const sec = (title, arr)=> arr.length ? `<div class="grp">${title}（${arr.length}）</div>${arr.map(row).join("")}` : "";

  return `<h2 class="page-title">📝 我的待办</h2>
    <div class="page-sub">填写自己的截止事项（交作业、报名、交材料…），会自动同步到「📅 截止日历」和首页「⏰ 最近要截止的事」</div>
    <div class="card">
      <div style="font-weight:800;margin-bottom:12px">➕ 新增待办</div>
      <div class="form">
        <div><label class="f">事项名称</label><input type="text" id="td-title" placeholder="例如：提交课程论文 / 报名四六级"></div>
        <div><label class="f">截止日期</label><input type="date" id="td-due" value="${futureDate(3)}"></div>
        <div class="full"><label class="f">备注（可选）</label><input type="text" id="td-note" placeholder="例如：需导师签字，带纸质版"></div>
        <div class="full"><button class="primary" data-act="todo-add">添加待办</button></div>
      </div>
    </div>
    <div class="card">
      ${sec("🔴 已逾期", groups.over)}
      ${sec("🟠 3 天内", groups.soon)}
      ${sec("📌 其他", groups.rest)}
      ${groups.done.length?`<div class="grp">✅ 已完成（${groups.done.length}）</div>${groups.done.map(row).join("")}`:""}
      ${(!ST.todos.length)?emptyBox("还没有待办，上面填写一条试试"):""}
    </div>`;
}

function renderTrash(){
  const ids = ST.blocks;
  if(!ids.length) return `<h2 class="page-title">🗑️ 回收箱</h2>
    <div class="page-sub">你暂不关注的通知都在这里，随时可以恢复关注</div>
    ${emptyBox("回收箱是空的。","在卡片上点「🚫 暂不关注」的通知会进到这里。")}`;
  const rows = ids.map(id=>{
    const n = idx(id);
    return `<div class="ncard">
      <h4>${esc(n.title)}</h4>
      <div class="meta">来源 <b>${esc(n.source||"-")}</b>　发布 ${esc(n.publish_time||"-")}</div>
      <div class="btns">
        <button class="btn" data-act="restore" data-id="${esc(id)}">♻️ 恢复关注</button>
