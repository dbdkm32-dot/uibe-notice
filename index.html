/* 本地时间字符串（用于记录"哪天勾选完成"） */
function nowLocal(){
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/* 某一天要截止的事：关注的通知 + 未完成待办 */
function dayPending(date){
  const out = [];
  for(const id of ST.follows){
    const n = idx(id);
    if(n.deadline === date) out.push({kind:"notice", ...n});
  }
  for(const t of ST.todos){
    if(!t.done && t.due === date) out.push({kind:"todo", ...t, deadline:t.due});
  }
  return out;
}
/* 某一天完成的事：按勾选完成的那天归组，历史长期保留 */
function dayDone(date){
  return ST.todos.filter(t=>t.done && String(t.done_at||"").slice(0,10)===date);
}
function doneMapAll(){
  const m = {};
  for(const t of ST.todos){
    if(!t.done) continue;
    const d = String(t.done_at||"").slice(0,10);
    if(d) (m[d] = m[d]||[]).push(t);
  }
  return m;
}

/* 当天详情弹窗 */
function dayModal(date){
  if(!date) return "";
  const pend = dayPending(date), done = dayDone(date);
  const wd = ["日","一","二","三","四","五","六"][new Date(date+"T00:00:00").getDay()];

  const rowsP = pend.map(it=>{
    const isTodo = it.kind==="todo";
    const tag = isTodo ? `<span class="tag">我的待办</span>`
                       : `<span class="tag">${esc(it.category||"通知")}</span>`;
    const sub = [];
    if(it.note) sub.push(esc(it.note));
    if(it.event_time) sub.push(esc(eventLabel(it.event_time)));
    sub.push(dlTag(date));
    const link = (!isTodo && it.url) ? `　<a href="${esc(it.url)}" target="_blank" rel="noopener">原文</a>` : "";
    return `<div class="day-row">${isTodo?"📝 ":""}<b>${esc(it.title)}</b>${tag}${link}
      <div class="sub">${sub.join("　")}</div></div>`;
  }).join("");

  const rowsD = done.map(t=>{
    const tm = String(t.done_at||"").slice(11,16);
    const sub = [];
    if(tm) sub.push("完成于 "+tm);
    if(t.due) sub.push("原定 "+esc(t.due)+" 截止");
    if(t.note) sub.push(esc(t.note));
    return `<div class="day-row"><b>${esc(t.title)}</b>
      <div class="sub" style="color:#1f7a4d">${sub.join("　")}</div></div>`;
  }).join("");

  return `<div class="modal" data-act="cal-mask">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <div class="modal-date">${date.replace(/-/g," / ")}　周${wd}</div>
          <div>
            <span class="day-chip chip-pend">⏰ 当天截止 ${pend.length} 项</span>
            <span class="day-chip chip-done">✅ 当天完成 ${done.length} 项</span>
            <span class="day-chip" style="background:#f4f7fc;color:#7d9cc4">${dlTag(date)||"—"}</span>
          </div>
        </div>
        <button class="modal-x" data-act="cal-close" title="关闭">✕</button>
      </div>
      ${pend.length?`<div class="day-sec">⏰ 这一天要截止的事</div>${rowsP}`:""}
      ${done.length?`<div class="day-sec done">✅ 这一天完成的事</div>${rowsD}`:""}
      ${(!pend.length && !done.length)?`<div class="day-empty">这一天没有截止事项，也没有完成记录。</div>`:""}
    </div>
  </div>`;
}

function renderCalendar(){
  const items = datedItems();
  const doneAll = doneMapAll();
  const first = new Date(S.calY, S.calM-1, 1);
  const startPad = (first.getDay()+6)%7;                 // 周一为第一列
  const daysInMonth = new Date(S.calY, S.calM, 0).getDate();
  const prevDays = new Date(S.calY, S.calM-1, 0).getDate();

  const byDate = {};
  for(const it of items){
    const d = it.deadline;
    if(!d) continue;
    const y = Number(d.slice(0,4)), m = Number(d.slice(5,7));
    if(y===S.calY && m===S.calM) (byDate[d] = byDate[d]||[]).push(it);
  }

  const cells = ["一","二","三","四","五","六","日"].map(w=>`<div class="cal-cell cal-head-cell">${w}<span></span></div>`);
  for(let i=startPad-1;i>=0;i--) cells.push(`<div class="cal-cell cal-out">${prevDays-i}<span></span></div>`);
  for(let d=1; d<=daysInMonth; d++){
    const key = `${S.calY}-${String(S.calM).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const p = (byDate[key]||[]).length;
    const k = (doneAll[key]||[]).length;
    let cls = "cal-cell click";
    if(key===TODAY) cls += " cal-today";
    else if(p && k) cls += " cal-both";
    else if(p) cls += " cal-has";
    else if(k) cls += " cal-done";
    if(S.calSel===key) cls += " cal-sel";
    let badge = "";
    if(p && k) badge = `⏰${p} ✅${k}`;
    else if(p) badge = `${p} 项`;
    else if(k) badge = `✅${k}`;
    cells.push(`<div class="${cls}" data-act="cal-day" data-date="${key}" title="${key}：截止 ${p} 项 · 完成 ${k} 项">${d}<span>${badge}</span></div>`);
  }
  const tail = (7 - (startPad+daysInMonth)%7)%7;
  for(let i=1;i<=tail;i++) cells.push(`<div class="cal-cell cal-out">${i}<span></span></div>`);

  const groups = {};
  for(const it of items) (groups[it.deadline] = groups[it.deadline]||[]).push(it);
  const nNotice = items.filter(x=>x.kind==="notice").length;
  const nTodo = items.length - nNotice;

  const listHtml = items.length ? Object.keys(groups).sort().map(date=>{
    const rows = groups[date].map(it=> it.kind==="todo"
      ? `<div class="dl-item">📝 <b>${esc(it.title)}</b><span class="tag">我的待办</span>${it.note?`<span class="note">　${esc(it.note)}</span>`:""}</div>`
      : `<div class="dl-item"><b>${esc(it.title)}</b><span class="tag">${esc(it.category||"通知")}</span>${it.event_time?`<span class="note">　${esc(eventLabel(it.event_time))}</span>`:""}　${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">原文</a>`:""}</div>`
    ).join("");
    return `<div class="dl-group"><div class="dl-date">${date}<span class="dl-left">${dlTag(date)}</span></div>${rows}</div>`;
  }).join("") : emptyBox("你还没有关注任何「有截止日期」的活动，也没有填写待办。",
      "· 去首页给关心的事项点「⭐ 关注」，或 · 到「📝 我的待办」填写自己的截止事项");

  const doneTotal = Object.keys(doneAll).reduce((s,d)=>s+doneAll[d].length,0);

  return `<h2 class="page-title">📅 截止日历</h2>
    <div class="page-sub">点日历上的任意日期，即可查看当天的截止事项和完成记录；过期未完成的会自动消失</div>
    <div class="card">
      <div class="cal-head">
        <div class="cal-month">${S.calY} 年 ${S.calM} 月</div>
        <div class="cal-nav">
          <button data-act="cal" data-step="-1">‹</button>
          <button data-act="cal" data-step="1">›</button>
        </div>
      </div>
      <div class="cal-legend">
        <span><i style="background:#dbe7f8;border-color:#cddef5"></i>有截止事项</span>
        <span><i style="background:#e2f5e9;border-color:#c3e8d2"></i>当天已完成</span>
        <span><i style="background:linear-gradient(100deg,#dbe7f8 0%,#dbe7f8 55%,#e2f5e9 55%,#e2f5e9 100%);border-color:#cbdff0"></i>两者都有</span>
        <span><i style="background:#2f6bb0;border-color:#2f6bb0"></i>今天</span>
      </div>
      <div class="cal-grid">${cells.join("")}</div>
    </div>
    <hr class="sep">
    <h3 class="sec">📌 截止清单（共 ${items.length} 项：关注的 ${nNotice} · 我的待办 ${nTodo}）</h3>
    ${listHtml}
    ${doneTotal?`<hr class="sep">
    <h3 class="sec">✅ 近期完成记录（共 ${doneTotal} 项，点日历任意日期可看当天详情）</h3>
    ${Object.keys(doneAll).sort().reverse().slice(0,15).map(date=>`
      <div class="dl-item"><span style="color:#1f7a4d;font-weight:700">${date}</span>
      ${doneAll[date].map(t=>`<b>${esc(t.title)}</b>${String(t.done_at||"").slice(11,16)?`<span class="note">　${esc(String(t.done_at).slice(11,16))}</span>`:""}`).join("　·　")}
      </div>`).join("")}`:""}
    ${dayModal(S.calSel)}`;
}

function renderTodos(){
  const groups = {over:[], soon:[], rest:[], done:[]};
  for(const t of ST.todos){
    if(t.done){ groups.done.push(t); continue; }
    const l = dayDiff(t.due);
    if(l===null){ groups.rest.push(t); }
    else if(l<0) groups.over.push(t);
    else if(l<=3) groups.soon.push(t);
    else groups.rest.push(t);
  }
  const row = (t)=>`<div class="todo ${t.done?"done":""}">
      <button class="icon" data-act="todo-done" data-id="${esc(t.id)}" title="${t.done?"标为未完成":"完成"}">${t.done?"✅":"⬜"}</button>
      <div class="t-title">${esc(t.title)}${t.note?`<div class="note">${esc(t.note)}</div>`:""}</div>
      <div class="t-due">${t.due?`${esc(t.due)}${t.done?"":` · ${dlTag(t.due)}`}`:"未设日期"}</div>
      <button class="icon" data-act="todo-del" data-id="${esc(t.id)}" title="删除">🗑️</button>
    </div>`;
  const sec = (title, arr)=> arr.length ? `<div class="grp">${title}（${arr.length}）</div>${arr.map(row).join("")}` : "";

  return `<h2 class="page-title">📝 我的待办</h2>
    <div class="page-sub">填写自己的截止事项（交作业、报名、交材料…），会自动同步到「📅 截止日历」和首页「⏰ 最近要截止的事」</div>
    <div class="card">
      <div style="font-weight:800;margin-bottom:12px">➕ 新增待办</div>
      <div class="form">
        <div><label class="f">事项名称</label><input type="text" id="td-title" placeholder="例如：提交课程论文 / 报名四六级"></div>
        <div><label class="f">截止日期</label><input type="date" id="td-due" value="${futureDate(3)}"></div>
        <div class="full"><label class="f">备注（可选）</label><input type="text" id="td-note" placeholder="例如：需导师签字，带纸质版"></div>
        <div class="full"><button class="primary" data-act="todo-add">添加待办</button></div>
      </div>
    </div>
    <div class="card">
      ${sec("🔴 已逾期", groups.over)}
      ${sec("🟠 3 天内", groups.soon)}
      ${sec("📌 其他", groups.rest)}
      ${groups.done.length?`<div class="grp">✅ 已完成（${groups.done.length}）</div>${groups.done.map(row).join("")}`:""}
      ${(!ST.todos.length)?emptyBox("还没有待办，上面填写一条试试"):""}
    </div>`;
}

      <div class="field"><label class="f">学号</label><input type="text" id="lg-no" placeholder="请输入学号"></div>
      <div class="field"><label class="f">密码</label><input type="password" id="lg-pw" value="123456"></div>
      <button class="primary" style="width:100%" data-act="login">进入</button>
      <div class="err" id="lg-err"></div>
      <div class="quick">
        ${accounts.map(a=>`<button data-act="quick" data-no="${esc(a.student_no)}">${esc(a.name)} · ${esc(a.student_no)}</button>`).join("")}
      </div>
      <div class="demo-tip">演示密码统一为 <b>123456</b>，点上面的账号可直接进入。<br>
      本页是离线快照，关注 / 待办等操作保存在你自己的浏览器里。</div>
    </div>
  </div>`;
}

/* ================== 动作 ================== */
function loginAs(no){
  if(!DATA.users[no]) return;
  S.no = no; U = DATA.users[no]; ST = loadState(no);
  S.page = "dashboard"; S.section = null; S.open = {}; S.calSel = null;
  lsSet(LS+"last", no);
  render(); saveState();
}

document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  if(act==="login"){
    const no = ($("#lg-no").value||"").trim();
    const pw = ($("#lg-pw").value||"").trim();
    if(!DATA.users[no]){ $("#lg-err").textContent = "学号不存在（可点下方演示账号）"; return; }
    if(pw!=="123456"){ $("#lg-err").textContent = "演示密码为 123456"; return; }
    loginAs(no); return;
  }
  if(act==="quick"){ loginAs(el.dataset.no); return; }
  if(act==="logout"){
    lsDel(LS+"last");
    S.no=null; U=null; ST=null; S.page="dashboard"; S.section=null; render(); return;
  }
  if(act==="nav"){
    S.page = el.dataset.page; S.section = null; render(); return;
  }
  if(act==="tile"){
    const t = el.dataset.target;
    if(t==="todos"){ S.page="todos"; S.section=null; } else { S.section = t; S.page="dashboard"; }
    render(); return;
  }
  if(act==="back"){ S.section=null; render(); return; }

  if(act==="follow"){
    if(followed(id)){ ST.follows = ST.follows.filter(x=>x!==id); }
    else{
      ST.follows.push(id);
      ST.blocks = ST.blocks.filter(x=>x!==id);
    }
    saveState(); render(); return;
  }
  if(act==="block"){
    if(blocked(id)){ ST.blocks = ST.blocks.filter(x=>x!==id); }
    else{
      ST.blocks.push(id);
      ST.follows = ST.follows.filter(x=>x!==id);
    }
    saveState(); render(); return;
  }
  if(act==="read"){
    ST.reads = isRead(id) ? ST.reads.filter(x=>x!==id) : ST.reads.concat([id]);
    saveState(); render(); return;
  }
  if(act==="body"){ S.open[id] = !S.open[id]; render(); return; }

  if(act==="restore"){
    ST.blocks = ST.blocks.filter(x=>x!==id);
    if(!followed(id)) ST.follows.push(id);
    saveState(); render(); return;
  }
  if(act==="purge"){ ST.blocks = ST.blocks.filter(x=>x!==id); saveState(); render(); return; }

  if(act==="cal"){
    let m = S.calM + Number(el.dataset.step), y = S.calY;
    if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
    S.calM=m; S.calY=y; S.calSel=null; render(); return;
  }
  if(act==="cal-day"){ S.calSel = el.dataset.date; render(); return; }
  if(act==="cal-close"){ S.calSel = null; render(); return; }
  if(act==="cal-mask"){ if(e.target===el){ S.calSel = null; render(); } return; }

  if(act==="todo-add"){
    const title = ($("#td-title").value||"").trim();
    if(!title){ $("#td-title").focus(); return; }
    ST.todos.push({
      id: "t"+Date.now(),
      title,
      due: ($("#td-due").value||"").trim(),
      note: ($("#td-note").value||"").trim(),
      done:false
    });
    saveState(); render(); return;
  }
  if(act==="todo-done"){
    const t = ST.todos.find(x=>x.id===id);
    if(t){ t.done = !t.done; t.done_at = t.done ? nowLocal() : ""; saveState(); render(); }
    return;
  }
  if(act==="todo-del"){
    ST.todos = ST.todos.filter(x=>x.id!==id); saveState(); render(); return;
  }
});

/* 回车登录 */
document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape" && S.calSel){ S.calSel=null; render(); return; }
  if(e.key==="Enter" && e.target && (e.target.id==="lg-no"||e.target.id==="lg-pw")){
    const b = document.querySelector('[data-act="login"]'); if(b) b.click();
  }
});

/* 启动：支持 ?u=学号&p=页面 直达（也可记住上次登录的账号） */
window.addEventListener("error", function(ev){
  var box = document.getElementById("boot-error");
  if(box) return;
  box = document.createElement("div");
  box.id = "boot-error";
  box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;background:#fff3f3;"
    + "border:1px solid #f0c2c2;color:#8a2b2b;border-radius:12px;padding:12px 14px;"
    + "font:13px/1.6 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;"
    + "box-shadow:0 8px 24px rgba(0,0,0,.12)";
  box.innerHTML = "<b>页面脚本执行出错</b><br>如果页面空白，请用 Chrome / Edge / Safari 浏览器打开本文件，"
    + "不要在微信、QQ 里直接预览。<br><span style='color:#a06a6a'>" + (ev.message||"") + "</span>";
  document.body.appendChild(box);
});

(function boot(){
  try {
    const q = new URLSearchParams(location.search);
    render();
    const qu = q.get("u");
    const last = lsGet(LS+"last");
    if(qu && DATA.users[qu]) loginAs(qu);
    else if(last && DATA.users[last]) loginAs(last);
    const qp = q.get("p");
    if(S.no && qp && PAGES[qp]){ S.page = qp; S.section = null; render(); }
  } catch(e){
    document.getElementById("main").innerHTML =
      "<div class='card'><h3 class='sec'>页面加载失败</h3><p>请改用 Chrome / Edge / Safari 打开本文件。"
      + "<br><span style='color:#8a2b2b'>" + (e && e.message ? e.message : e) + "</span></p></div>";
  }
})();
</script>
</body>
