<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>小惠同学 · 对外经济贸易大学</title>
<style>
:root{
  --line:#e2e9f5; --accent:#2f6bb0; --accent-dark:#24589a;
  --ink:#16243a; --muted:#5b7089; --soft:#eef3fb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f8fd; color:var(--ink); font-size:15px; line-height:1.6;
}
a{color:var(--accent-dark);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.side{
  width:238px;flex:0 0 238px;background:#eef3fb;border-right:1px solid var(--line);
  padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{font-size:1.02rem;font-weight:800;color:var(--ink);line-height:1.4;margin-bottom:4px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.76rem;margin-top:2px}
.nav{margin-top:18px;display:flex;flex-direction:column;gap:4px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:none;border-radius:12px;padding:10px 12px;
  font-size:.94rem;color:var(--ink);cursor:pointer;transition:.15s;
}
.nav button:hover{background:#e2ebf9}
.nav button.on{background:#2f6bb0;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(47,107,176,.25)}
.side-foot{margin-top:22px;padding-top:14px;border-top:1px solid #dbe6f6}
.who{font-size:.86rem;color:var(--muted);margin-bottom:8px}
.who b{color:var(--ink)}
.gen{font-size:.74rem;color:#8fa6c4;margin-top:10px;line-height:1.5}
.linkbtn{background:#fff;border:1px solid #dbe6f6;border-radius:999px;padding:6px 14px;
  font-size:.84rem;color:var(--ink);cursor:pointer;width:100%}
.linkbtn:hover{border-color:var(--accent);color:var(--accent-dark)}

.main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:26px 34px 70px}
.page-title{font-size:1.5rem;font-weight:800;margin:0 0 4px}
.page-sub{color:var(--muted);font-size:.88rem;margin-bottom:18px}

/* ============ 通用卡片 ============ */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 3px 14px rgba(22,36,58,.06);padding:18px 22px;margin:14px 0}
.card.tight{padding:14px 18px}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0}
h3.sec{font-size:1.12rem;margin:20px 0 8px}

/* ============ Hero ============ */
.hero{background:linear-gradient(120deg,#eef4fd 0%,#e3edfb 55%,#d8e6f8 100%);
  border:1px solid #dae6f7;border-radius:20px;padding:20px 28px}
.hero-title{font-size:1.72rem;font-weight:800;line-height:1.3}
.hero-title em{color:var(--accent-dark);font-style:normal}
.hero-sub{color:var(--muted);margin-top:4px;font-size:.9rem}

/* ============ 四个分区卡 ============ */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:6px 0 4px}
.tile{background:linear-gradient(180deg,#eef5fe 0%,#e0ecfc 100%);
  border:1px solid #cddef5;border-radius:18px;padding:20px 18px;min-height:196px;
  box-shadow:0 4px 16px rgba(47,107,176,.10);display:flex;flex-direction:column;
  transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(47,107,176,.16)}
.tile-count{font-size:2.2rem;font-weight:800;color:#2f6bb0;line-height:1.1}
.tile-unit{font-size:.9rem;font-weight:500;color:#7d9cc4;margin-left:3px}
.tile-title{font-size:1.18rem;font-weight:700;margin-top:4px}
.tile-hint{color:#7d9cc4;font-size:.84rem;margin-top:auto;padding-top:14px;text-align:center}
.tile-btn{margin-top:10px;background:#fff;border:1px solid #bcd4f2;border-radius:999px;
  color:#2f6bb0;font-weight:600;padding:8px 10px;cursor:pointer;font-size:.9rem;width:100%}
.tile-btn:hover{background:#2f6bb0;color:#fff;border-color:#2f6bb0}

/* ============ 通知卡片 ============ */
.ncard{background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 3px 12px rgba(22,36,58,.05);padding:16px 20px;margin:12px 0}
.ncard.read{opacity:.72}
.ncard h4{margin:6px 0 8px;font-size:1.02rem;line-height:1.5}
.chip{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px}
.chip.key{background:#fdeceb;color:#c0392b}
.chip.rec{background:#fff4e0;color:#b7791f}
.chip.normal{background:#eef3fb;color:#5b7089}
.chip.new{background:#e6f6ec;color:#1f8a4c}
.meta{color:#8fa6c4;font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px 14px}
.meta b{color:#5b7089;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid #dbe6f6;background:#fff;border-radius:999px;padding:6px 14px;
  font-size:.84rem;color:var(--ink);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent-dark);box-shadow:0 2px 10px rgba(47,107,176,.18)}
.btn.on{background:#2f6bb0;border-color:#2f6bb0;color:#fff}
.btn.ghost{background:#f7faff}
.exp-box{margin-top:18px;border-top:1px dashed #e2e9f5;padding-top:14px}
.exp-head{width:100%;text-align:left;background:#f7faff;border-radius:12px;padding:10px 14px}
.exp-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px dashed #eef2f8}
.exp-row:last-child{border-bottom:none}
.exp-t{flex:1;color:#93a0b1;font-size:.9rem;line-height:1.5;text-decoration:line-through}
.exp-m{flex:0 0 auto;color:#aab5c4;font-size:.78rem}
.btn.sm{padding:4px 10px;font-size:.78rem}
.body{margin-top:12px;padding:12px 14px;background:#f7faff;border:1px solid #e6eefb;
  border-radius:12px;font-size:.88rem;color:#3b4f68;white-space:pre-wrap;max-height:340px;overflow:auto}

/* ============ 提示条 ============ */
.info{background:#eef5fe;border:1px solid #d3e3f8;border-radius:14px;padding:12px 16px;
  color:#3d5a80;font-size:.88rem}
.warn{background:#fff8e6;border:1px solid #f2e0b0;border-radius:14px;padding:12px 16px;
  color:#8a6a1f;font-size:.86rem}

/* ============ 日历 ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.cal-month{font-size:1.05rem;font-weight:800}
.cal-nav{display:flex;gap:8px}
.cal-nav button{border:1px solid #dbe6f6;background:#fff;border-radius:999px;
  width:36px;height:32px;cursor:pointer;color:var(--ink);font-size:.9rem}
.cal-nav button:hover{border-color:var(--accent);color:var(--accent-dark)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:4px}
.cal-cell{height:62px;border:1px solid #e6ecf6;border-radius:10px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-weight:600;font-size:1rem;line-height:1.15}
.cal-cell span{font-size:.7em;font-weight:500;min-height:1em;opacity:.9}
.cal-head-cell{height:auto;border:none;background:transparent;color:#8fa6c4;font-size:.85em}
.cal-head-cell span{display:none}
.cal-out{color:#c8d2e0;border-color:#eef2f8}
.cal-has{background:#dbe7f8;border-color:#cddef5;color:#24589a}
.cal-today{background:#2f6bb0;border-color:#2f6bb0;color:#fff}
.cal-today span{color:#fff}
/* 可点击 + 已完成着色 */
.cal-cell.click{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.cal-cell.click:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(47,107,176,.16)}
.cal-done{background:#e2f5e9;border-color:#c3e8d2;color:#1f7a4d}
.cal-both{background:linear-gradient(100deg,#dbe7f8 0%,#dbe7f8 55%,#e2f5e9 55%,#e2f5e9 100%);
  border-color:#cbdff0;color:#24589a}
.cal-sel{box-shadow:0 0 0 2px var(--accent)}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 8px;color:#7d9cc4;font-size:.82rem}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;
  vertical-align:-1px;border:1px solid rgba(0,0,0,.06)}
/* 当天详情弹窗 */
.modal{position:fixed;inset:0;background:rgba(22,36,58,.42);z-index:9000;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:84vh;
  overflow:auto;padding:18px 22px;box-shadow:0 20px 60px rgba(22,36,58,.28)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-date{font-size:1.05rem;font-weight:800}
.modal-x{border:none;background:#eef3fb;color:#5b7089;width:32px;height:32px;border-radius:50%;
  cursor:pointer;font-size:1rem;line-height:1;flex:0 0 auto}
.modal-x:hover{background:#e2ebf8;color:var(--accent-dark)}
.day-chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.76rem;
  font-weight:700;margin:6px 6px 0 0}
.chip-pend{background:#eaf2fd;color:#24589a}
.chip-done{background:#e6f6ec;color:#1f7a4d}
.day-sec{font-weight:800;margin:16px 0 2px;padding-left:9px;border-left:3px solid var(--accent)}
.day-sec.done{border-left-color:#38a169}
.day-row{padding:7px 0;border-bottom:1px dashed #eef2f8;font-size:.92rem;line-height:1.65}
.day-row:last-child{border-bottom:none}
.day-row .sub{color:#8fa6c4;font-size:.84em}
.day-empty{color:#8fa6c4;padding:12px 0;font-size:.9rem}
.dl-group{margin-top:16px}
.dl-date{font-weight:800;font-size:.95rem}
.dl-left{color:#2f6bb0;font-weight:600;font-size:.86rem;margin-left:8px}
.dl-item{padding:6px 0 6px 2px;font-size:.92rem;border-bottom:1px dashed #eef2f8}
.dl-item:last-child{border-bottom:none}
.tag{display:inline-block;font-size:.72rem;background:#eef3fb;color:#5b7089;
  border-radius:6px;padding:1px 7px;margin-left:6px}
.note{color:#8fa6c4;font-size:.84em}

/* ============ 待办 ============ */
.form{display:grid;grid-template-columns:1.6fr .9fr;gap:12px}
.form .full{grid-column:1/-1}
label.f{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=password]{
  width:100%;border:1px solid #dbe6f6;border-radius:10px;padding:9px 12px;
  font-size:.92rem;color:var(--ink);background:#fff;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,176,.12)}
.primary{background:#2f6bb0;color:#fff;border:none;border-radius:999px;padding:10px 22px;
  font-weight:600;cursor:pointer}
.primary:hover{background:#24589a}
.todo{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed #eef2f8}
.todo:last-child{border-bottom:none}
.todo .t-title{flex:1;font-weight:600}
.todo.done .t-title{text-decoration:line-through;color:#9fb0c6;font-weight:500}
.todo .t-due{font-size:.82rem;color:#8fa6c4}
.icon{border:none;background:transparent;cursor:pointer;font-size:1rem;color:#8fa6c4;padding:4px 6px}
.icon:hover{color:var(--accent-dark)}
.grp{font-weight:800;font-size:.95rem;margin:18px 0 4px;color:#3d5a80}

/* ============ 登录 ============ */
.login-wrap{max-width:430px;margin:9vh auto 0}
.login-card{background:#fff;border:1px solid var(--line);border-radius:22px;
  box-shadow:0 10px 40px rgba(22,36,58,.10);padding:30px 30px 26px}
.login-card h1{font-size:1.4rem;margin:0 0 4px}
.login-card p.sub{color:var(--muted);font-size:.86rem;margin:0 0 20px}
.login-card .field{margin-bottom:12px}
.login-card .err{color:#c0392b;font-size:.84rem;min-height:1.2em;margin-top:6px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.quick button{border:1px solid #dbe6f6;background:#f7faff;border-radius:999px;
  padding:6px 12px;font-size:.82rem;cursor:pointer;color:#3d5a80}
.quick button:hover{border-color:var(--accent);color:var(--accent-dark)}
.demo-tip{margin-top:16px;font-size:.8rem;color:#8fa6c4;line-height:1.6}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:auto;flex:none;height:auto;position:static;border-right:none;
    border-bottom:1px solid var(--line);padding:14px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto;padding:8px 12px}
  .main{padding:18px 16px 60px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .form{grid-template-columns:1fr}
}
@media (max-width:520px){
  body{overflow-x:hidden}
  .main{padding:14px 12px 56px}
  .tiles{grid-template-columns:1fr;gap:12px}
  .tile{min-height:0;padding:16px 16px}
  .tile-count{font-size:1.8rem}
  .hero{padding:16px 18px;border-radius:16px}
  .hero-title{font-size:1.32rem}
  .card{padding:14px 16px;border-radius:16px}
  .ncard{padding:14px 14px;border-radius:14px}
  .ncard h4{font-size:.98rem}
  .login-wrap{max-width:100%;margin:6vh auto 0;padding:0 4px}
  .login-card{padding:20px 18px;border-radius:18px}
  .login-card h1{font-size:1.18rem}
  .quick button{font-size:.76rem;padding:5px 10px}
  .side{padding:12px}
  .nav button{padding:7px 10px;font-size:.86rem}
  .cal-grid{gap:4px}
  .cal-cell{height:54px}
  .form{grid-template-columns:1fr}
}
</style>
</head>

 "reason": "法律沙龙属学术活动，但学生兴趣为国际交流/竞赛/奖学金，未命中；且为法学院活动，与金融学专业弱相关，仅作一般信息参考。；适用对象包含你的身份/年级"}, {"notice_id": "dc19c15549edfdbf49658d646a0d7c1a", "score": 0, "level": "普通", "reason": "适用对象不符"}], "favs": [], "trash": [], "todos": [], "reads": []}}, "index": {"6a318fff462b6ce2853fe6b5c6a6b971": {"notice_id": "6a318fff462b6ce2853fe6b5c6a6b971", "title": "关于开展2026-2027学年社会捐赠类助学金评定工作的通知", "source": "学工部-公告通知", "category": "奖助学金", "publish_time": "2026-11-06", "url": "https://xgb.uibe.edu.cn/xssw/ggtz/cdc911d6180042b39669868c1504be1f.htm", "deadline": "", "event_time": "", "summary": "开展2026-2027学年社会捐赠类助学金评定工作", "content": "机构设置\n部门介绍\n联系方式\n学生事务\n管理规定\n办事指南\n发展咨询\n思想教育\n思想教育\n惠园微讯\n资助中心\n资助中心简介\n奖助项目\n奖助育人\n心理健康\n心理咨询中心简介\n心理健康教育\n咨询预约\n国防教育\n学生军训\n应征入伍\n国防教育活动"}, "portal_2058181372579840": {"notice_id": "portal_2058181372579840", "title": "国家（北京）对外开放研究院2026年度课题培训会成功召开", "source": "国家对外开放研究院", "category": "科研项目", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2058181372579840", "deadline": "", "event_time": "2025-10-30", "summary": "对外开放研究院召开课题培训会，课题负责人参会交流", "content": "10月30日，国家（北京）对外开放研究院召开2026年度课题培训会。国家（北京）对外开放研究院课题负责人及课题组成员等30余人参加会议。会议由学校国家对外开放研究院常务副院长王颖主持。\n\n会议伊始，王颖介绍了两院课题立项和推进情况，指出本年度课题紧扣国家高水平对外开放、首都高质量发展等重大方向，聚焦制度型开放、“一带一路”、自由贸易试验区建设等领域，兼具理论深度和现实针对性。她表示，智库研究时效性强、成果转化要求高，各课题组要严格对照进度安排把好时间节点，紧扣结项的质量要求扎实推进各项研究任务，确保按期高质量完成既定研究目标。\n\n两院科研办公室主任张焕详细介绍了研究院课题管理办法和智库成果奖励办法，讲解了课题从立项开题、中期推进到结项验收的全流程管理要求，同时分享了课题研究过程中常见的问题和注意事项，为各课题组理清规范研究过程、提升资政成果质量提供了参考。\n\n在经验交流环节，与会人员围绕选题系统谋划、决策需求对接、资政报告撰写、研究成果转化以及内参编审要点展开深入研讨。邓慧慧教授结合自身资政研究实践，从精准对接决策需求、实地调研获取一手资料、把握政策窗口期、做实做细对策建议等方面，分享了提升资政报告转化率的经验。郑文平副教授围绕选题精准锚定、系列化研究设计、文稿表达优化等方面，梳理了日常撰写咨政报告时的有效做法与常见误区，表示咨政研究要注重贴合决策部门的实际需求。鲍创副研究员讲解了内参的选题标准、编审流程与格式规范，具体介绍了内参文稿的体例要求，就如何抓好选题方向、突出核心观点、提升政策建议的可操作性给出了参考建议。\n会议最后，王颖作总结发言。她强调，在推动资政研究过程中，一是要精准对接决策需求，紧扣国家和北京市政策难点与现实堵点开展研究；二是要深化实地调查研究，提升资政成果的针对性和可操作性；三是要提升研究成果质量，推出更多兼具理论价值与实践意义的智库成果；四是要压实主体管理责任，课题负责人要切实履行第一责任人职责，合理合规使用课题经费。\n本次培训紧扣智库课题研究的关键环节，兼具政策解读、方法指导与经验分享的多重属性，为各课题组明确研究方向、规范研究流程、提升资政写作能力搭建了交流平台。与会人员认真聆听、深入交流，表示将以严谨务实的治学态度推进各项研究任务，力争产出更多能够服务决策、支撑实践的高水平成果，为服务国家对外开放战略和首都高质量发展贡献贸大力量。"}, "portal_2096916172673024": {"notice_id": "portal_2096916172673024", "title": "智赋体育 科学赋能——体育部举办“惠体学苑”第二期活动 ---AI技术助力运动表现分析与科学化训练提质升级", "source": "体育部", "category": "学术活动", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2096916172673024", "deadline": "", "event_time": "2025-11-05", "summary": "体育部举办AI赋能运动训练讲座，全体教师参加", "content": "11月5日，体育部“惠体学苑”第二期活动在302会议室举行。本期活动特邀北京体育大学体育工程学院（中国体育大数据中心）副教授、博士生导师崔一雄主讲，以《AI 赋能运动表现分析与科学训练》为主题，聚焦AI辅助运动表现分析、智能化科学训练体系搭建等核心内容，探索人工智能落地体育教学、训练的路径和方法。活动由体育部主任崔凯主持，体育部全体教师参加。\n\n崔一雄副教授长期从事运动表现分析、体育大数据与智能体育科技方向教研工作，入选国家体育总局第三批“优秀中青年百人计划专业技术人才”，国家网球队巴黎奥运周期比赛数据分析负责人。发表中英文核心论文60余篇，承担和参与国家自然科学基金、科技部2030新一代人工智能重大项目、科技部科技冬奥、北京市自然科学基金、国家体育总局重大科技创新项目等项目，担任多个国内外体育学术期刊审稿人。\n崔一雄副教授指出，针对传统经验式训练精准度不足、针对性不强等问题，引入AI动作识别与大数据分析手段，对运动员技术动作、体能指标、训练负荷进行智能采集与量化分析，精准研判技术短板与能力弱项。基于数据结果，教练团队实现个性化定训、动态调训，科学控制训练强度，有效规避运动损伤，提升训练精准度与训练效率。\n\n智慧体育是新时代体育教育与竞技训练发展的核心方向，AI赋能体育教育和训练是推动体育工作高质量发展的重要抓手。体育部正在积极探索和研究将人工智能、大数据与体育教学和训练相融合，常态化运用AI运动分析技术，不断创新体育教学模式，推动体育教学和训练工作向智能化、精准化、科学化纵深方向。"}, "portal_2091404752359424": {"notice_id": "portal_2091404752359424", "title": "我校本科新生顺利完成“大学前成长助力计划”", "source": "学工部", "category": "行政党务", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2091404752359424", "deadline": "", "event_time": "", "summary": "报道2026级本科新生暑期成长助力计划开展情况", "content": "为落实立德树人根本任务，做好2026级本科新生入学教育，2026年暑期，党委学生工作部面向2026级本科新生开展“大学前成长助力计划”。各学院围绕“一日家务、一次实践、一本好书、一处美景、一项运动、一份规划”六项行动，引导新生在劳动实践中涵养品格，在阅读行走中拓宽视野，在规划思考中明确方向。开学后，各学院组织开展“大学前成长助力计划”交流分享会，本科新生积极分享暑期收获，各班级辅导员、班主任、班主任助理参与指导，评选出近百份优秀实践报告，取得了良好的效果。\n一、前置引航，协同育人\n各学院立足新生成长特点，把育人工作向前延伸，搭建贯穿入学前后的全链条育人体系。辅导员、班主任、班主任助理等育人力量主动靠前，通过新生班群、线上见面会、朋辈分享等方式，解读“六个一”行动，回应入学准备和大学适应等问题，结合家长见面会、主题班会开展家校沟通与成果交流，帮助新生了解大学学习生活，顺利完成角色转换。\n\n二、躬身实践，培育担当\n生活是最生动的课堂，实践是成长最有效的磨砺。“六个一”计划将成长行动融入日常场景，引导新生在家务劳动中学会感恩，在社会实践中培养担当，在体育锻炼中强健体魄，为大学生活做好准备。\n在“一日家务”行动中，新生主动承担家庭劳动，在打扫房间和准备三餐等具体劳作中体会父母辛劳。法学院孙小晴从准备早餐开始体验一日家务，感恩父母的辛勤付出；保险学院曹可钰动手改造家庭阳台、养护花草，体会劳动创造美好生活的意义；国际发展合作学院的刘景阳创新炒饭配方，创意菜品收获家人一致好评。\n\n在“一次实践”行动中，新生走进社区、基层和社会一线，在服务与奉献中增长见识。法学院赵丽娜赴宁夏盐池县参加“共青团·伙伴计划”爱心托管班，在陪伴儿童、参与志愿服务中收获成长；法学院孙语浓参与乡村振兴主题调研，与当地果农深入交流，了解乡村发展实际；保险学院缪张书豪奔赴乌溪江一带开展守山护林实践，在基层防火一线感悟责任担当。\n\n在“一项运动”行动中，新生通过锻炼强健体魄、磨砺意志。人工智能与数据科学学院新生尝试游泳等新的锻炼项目，在突破自我中增强信心；政府管理学院新生坚持力量训练，在体态变化中体会自律与坚持的意义；英语学院新生将日常锻炼与规律作息相结合，为大学生活做好身心准备。\n\n三、阅读行走，拓宽视野\n一本好书启迪智慧，一处美景承载乡情。“一本好书”和“一处美景”行动引导新生在阅读与观察中认识社会、理解文化，提升人文素养。\n在“一本好书”行动中，新生通过阅读和心得撰写深化思考。国际经济贸易学院范增红在阅读《乡土中国》的过程中重新认识故乡；外语学院管晨茹阅读《红星照耀中国》，从革命先辈事迹中汲取精神力量；统计学院孟钰博通过《女士品茶》初步了解统计学的意义与实际应用，加深专业理解。\n\n在“一处美景”行动中，新生用文字、摄影和短视频记录自然风光，深入感受家乡文化底蕴。国际商学院蒋景伊体验扎染，感受传统非遗手工艺的魅力；法学院陈馨怡围绕山东方言开展社会调查，从地方语言变化中认识传统文化；保险学院郑谕琪制作“家乡探索游戏副本”创意短视频，展现家乡甘肃金昌的独特魅力；国际关系学院李霄怡走进红岩村追寻红色足迹，在实地寻访中感悟革命先辈的理想信念；文学与国际传播学院姚依彤以手抄报描绘对北京的向往；经济学院张歆玥以新疆旅行Vlog记录天山雪峰、草原风光和民族文化；国际发展合作学院张祎晨结合《黑神话：悟空》对山西古建的创新呈现，感受传统建筑文化在新时代传播中的独特魅力。\n\n四、规划未来，明确方向\n“一份规划”行动引导新生结合个人兴趣、专业特点和发展目标，提前谋划大学四年的学习生活。中国金融学院郑宇希将夯实数理、编程和金融基础作为本科阶段的核心目标；法学院晏雪莲初步规划“法律+数据”复合发展方向，关注数据合规等领域；保险学院雷依晨以“大一扎根、大二深探、大三定向、大四收获”为思路制定阶段性目标；马克思主义学院新生结合个人兴趣，列出四年图书馆阅读清单，拟定长期运动计划，在具体目标中勾勒成长路径。\n\n“大学前成长助力计划”以“小切口”承载“大主题”，将思想政治教育融入学生成长过程，为新生开启大学生活奠定良好基础。下一步，党委学生工作部将持续推进大学前教育、新生入学教育与日常思想政治教育有效衔接，创新育人载体、丰富育人形式，引导青年学生成长成才。"}, "portal_2112422694916096": {"notice_id": "portal_2112422694916096", "title": "我校与河南能源化工国际贸易集团签署合作备忘录", "source": "海南研究院", "category": "行政党务", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2112422694916096", "deadline": "", "event_time": "", "summary": "我校与河南能源国贸集团签署合作备忘录，开展校企合作", "content": "为充分发挥我校在国际经贸、财经、管理等领域的专业和人才优势，河南能源化工国际贸易集团有限公司（简称河南能源国贸集团）在能源、化工、有色领域的实践资源和行业优势，进一步推动双方在人才培养、产业研究、国际经贸等领域的合作，深化产学研用协同融合创新，近日，我校与河南能源国贸集团签署合作备忘录。\n校企双方本着“开放合作、优势互补、合作共赢、协同发展”的原则，立足产教融合、互助互促，深化校企合作，充分发挥各自优势，共同开展多领域、全方位的务实交流合作。双方拟从人才培养、培训、联合科研与专家咨询、师生实习实践等方面开展合作。\n\n河南能源集团是河南省管国有重点骨干企业，河南能源化工国际贸易集团有限公司是河南能源集团为实现战略结构调整、转型升级发展，投资设立的物流贸易板块全资子公司，建有大宗商品交易中心和大数据中心。公司以大宗商品市场为核心，依托行业影响、产业优势开展煤炭、化工、有色产品国际贸易，连续四年实现液氨进出口量全国第一。目前在海南设有一个分公司、一个子公司、一家投资公司。"}, "portal_2140556743970816": {"notice_id": "portal_2140556743970816", "title": "弘扬伟大长征精神 奋进“十五五”新征程 统计学院举行党委理论中心组学习会", "source": "统计学院", "category": "行政党务", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2140556743970816", "deadline": "", "event_time": "2026-10-22", "summary": "统计学院党委召开理论中心组学习会，专题学习长征精神讲话", "content": "2026年10月22日下午，统计学院党委在诚信楼727会议室召开理论中心组学习会，专题学习习近平总书记在纪念中国工农红军长征胜利90周年大会上发表的重要讲话，共同观看专题片《我们的征途——献给中国工农红军长征胜利90周年》。学院班子成员、学系主任、支部书记参加学习。\n\n李悦书记主持并讲话，她强调说，红军长征的光辉历程、宝贵经验、伟大意义、深远影响，是中华民族伟大复兴历史进程中彪炳史册的巍峨丰碑；习近平总书记就弘扬伟大长征精神、走好新的长征路提出“五个必须”的明确要求，是激励我们战胜困难、勇往直前的宝贵财富和强大动力。每一代人有每一代人的长征路，每一代人都要走好自己的长征路。恰逢“十五五”开局之年的关键点，希望大家以长征精神砥砺前行，在“十五五”开局之年以崭新面貌开展各项工作，以理想信念、团结奋斗攻坚克难，走好新时代长征路。\n\n唐晓彬院长表示，感悟历史，贵在践行。作为高校二级学院的一名管理工作者，要传承长征精神，坚定理想信念，牢记为党育人、为国育才的初心使命，把立德树人贯穿人才培养全过程。坚持实事求是，立足统计学科实际，科学谋划学科布局与专业建设，找准定位，探索符合统计学院发展实际的新路子；厚植师生情怀，主动下沉一线，倾听师生心声，为广大师生办实事、解难题，做好全方位服务保障。始终以长征精神为镜，实干笃行，全力推动学院高质量发展。\n\n郭伟副院长表示，专题片生动诠释了什么是不怕牺牲、百折不挠，什么是心系群众、依靠群众。这些宝贵的精神财富，对我们做好管理、育人工作，有着很强的现实指导意义。新时代赋予我们新的历史使命，在人工智能迅猛发展的时代背景下，学科建设、人才培养、师资队伍建设、科研创新、学生管理、服务师生的道路上，都是摆在我们面前需要攻坚的 “娄山关”“腊子口”。我们要坚定传承长征精神，把立德树人贯穿人才培养全过程，守好课堂主阵地，主动谋划、靠前担当，稳步推进专业建设、科研平台建设与教学改革。\n\n肖明明副书记在第一议题学习作重点发言并交流长征精神学习心得。他围绕《习近平党建文选（第一卷）》中《把为党和人民事业贡献力量作为最高追求》篇章开展学习研讨。结合实际工作经验，与大家共勉“四个自觉”，自觉做坚定理想信念的表率、自觉做认真学习实践的表率、做坚持民主集中制的表率、做弘扬优良作风的表率。相比先辈的战火纷飞，我们生活在和平美好的年代，无论在工作中遇到什么困难，都要向先辈学习，直面困难，勇于克服。\n\n经济统计系主任陈全润表示，曾经有人问我“你是不是当过兵”，这给了我极大的精神鼓舞，并自认为是对我的最高评价。长征的伟大胜利充分体现了党的正确领导和钢铁般的革命意志，充分体现了实事求是和广大人民群众支持的重要性。我将弘扬伟大长征精神，走好新的长征路。坚守党的理想信念，坚定四个自信，牢记为党育人为国育才使命，为推动高等教育高质量发展，服务国家重大战略需求贡献力量。\n\n数据科学系主任熊巍表示，任何事业的成功都离不开理想的指引、信念的支撑和一代又一代人的接续奋斗。历史的接力棒已经传到我们手中。当前，人工智能迅猛发展，数据要素价值加速释放，数据科学迎来了重要发展机遇，也面临着关键技术创新、人才培养和服务国家战略等方面的挑战。我们这一代教育工作者的“长征路”，就是立足国家所需、发挥专业所长，努力培养堪当时代重任的优秀人才，推动数据科学创新发展，让数据更好地服务国家建设和经济社会发展。我将把这份触动转化为行动，把长征精神融入党支部建设、学科发展和人才培养之中，坚持党建与业务深度融合，团结带领教师队伍迎难而上、踏实奋进，走好我们这一代人的长征路。\n\n数量金融系主任周珂表示，长征途中体现出的坚定理想信念、实事求是、迎难而上的精神，让我深受启发。作为一名高校教师，关键是要立足本职岗位，把长征精神落实到日常教学和科研工作中。要坚守立德树人初心，认真做好教书育人工作；也要发扬不怕困难、勇于探索的精神，不断提升教学质量和科研水平。今后，我将以更加踏实的态度做好本职工作，在平凡的岗位上践行初心、担当责任。\n\n（通讯员：胡灏楠 摄影：杨宇晗 审核：李悦）"}, "portal_2141216419909632": {"notice_id": "portal_2141216419909632", "title": "邱东教授与肖红叶教授应邀到统计学院作学术讲座", "source": "统计学院", "category": "学术活动", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2141216419909632", "deadline": "", "event_time": "2025-10-30", "summary": "统计学院举办两场学术讲座，教师和硕博研究生参加", "content": "10月30日下午，江西财经大学讲席教授邱东、天津财经大学统计学教授肖红叶应邀来我院作学术讲座，讲座分别由院长唐晓彬和刘立新教授主持，学院20余名教师和硕博研究生参加。\n\n邱东教授围绕“数字经济统计的逻辑挖掘”主题，从数字经济测度的底层概念问题切入，依次介绍了数据要素与数据产品、数据资产的统计可操作性区分，数据贸易、数字经济卫星账户及经济发展水平综合评价中的测度陷阱，以及国际统计框架 SNA2025 将 AI 划为独立资产的最新进展及其在捕捉生成式 AI 全方位影响上的局限。\n\n肖红叶教授围绕“AI 技术演化趋势几点关注”主题，从数据作为数字技术应用核心要素向基于 AI 的数智化技术应用转换的趋势切入，依次介绍了 AI Agent 技术演进路径的概念式逻辑解读，ChatGPT 问世以来从大模型技术底座到“代理式 AI”（Agentic AI）的演进脉络，以及 Agent 从经济代理人原义到明斯基、肖汉姆、伍尔德里奇等赋予其“智能体”内涵的概念演变。\n\n讲座结束后，我院师生与邱东教授、肖红叶教授就相关问题展开了热烈的问答交流。本次讲座拓展了我院师生研究视野，大家纷纷表示收获颇丰、受益匪浅。\n\n（通讯员：程钦良 摄影：王湘宁 李瑾溪 审核：李悦 唐晓彬）"}, "portal_2146091014852608": {"notice_id": "portal_2146091014852608", "title": "经济统计学前沿进展与对外经济贸易大学统计学科建设研讨会成功举行", "source": "统计学院", "category": "学术活动", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2146091014852608", "deadline": "", "event_time": "2026-10-31", "summary": "统计学科建设研讨会于10月31日举行，专家为学科发展建言", "content": "2026年10月31日，“经济统计学前沿进展与对外经济贸易大学统计学科建设研讨会”在对外经济贸易大学诚信楼三层国际会议报告厅举行。\n\n国家统计局原副局长、全国应用统计专业学位研究生教育指导委员会主任委员毛有丰，国家统计局原总工程师文兼武，国家统计局统计科学研究所所长闾海琪，厦门大学特聘教授曾五一，国家教学名师、天津财经大学教授肖红叶等国内统计领域资深专家出席会议；对外经济贸易大学原校长施建军等及统计学院师生代表共100余人参会。\n\n大会开幕式由对外经济贸易大学统计学院院长唐晓彬主持。对外经济贸易大学统计学院党委书记李悦、国家统计局原副局长毛有丰、国家统计局原总工程师文兼武、厦门大学特聘教授曾五一先后致辞。\n\n李悦代表学院对参会嘉宾表示热烈欢迎与诚挚感谢，希望与会专家以本次研讨会为平台围绕经济统计前沿问题展开深度交流，为贸大统计学科建设“把脉问诊”，助力统计学科向更高水平迈进。\n\n毛有丰肯定了近年来我校统计学院取得的长足进步，对统计学院的发展充满期待，从服务政府统计与服务国家重大需求两方面提出了指导建议，同时呼吁统计学界抓住数字经济蓬勃发展的重要机遇，以习近平新时代中国特色社会主义思想为指导，针对经济统计学的前沿进展与统计学科建设开展深入研讨。\n\n文兼武指出，依托学校经贸特色与贸易统计领域的长期深耕，对外经贸统计已成为我校统计学科发展的重要特色。希望统计学院能立足自身特色与优势，顺应新时代发展，进一步做优做强统计学科。\n\n曾五一指出，推进统计学科高质量发展应深入思考如何应对人工智能的挑战，如何和谐共生、互相欣赏，如何坚守自身学科特质，如何更好地服务国家重大需求，如何更好地培养学术接班人等五大问题。\n\n在大会报告环节，国家统计局统计科学研究所闾海琪所长、江西财经大学罗良清教授、山西财经大学李宝瑜教授、对外经济贸易大学施建军教授、中国人民大学赵彦云教授、北京师范大学王亚菲教授分别作题为“‘十五五’统计改革规划解读”“社会科学的统计学不是方法论学科”“国民经济核算体系框架结构优化设计”“新质生产力与智能统计的思考”“统计经济学”“纳入人工智能分类的中国高分辨率数字供给使用表研究”的精彩报告。\n\n天津财经大学肖红叶教授、国家统计局统计科学研究所原首席研究员许亦频、东北财经大学蒋萍教授、中国劳动关系学院原校长傅德印教授、对外经济贸易大学刘立新教授、北京工业大学程维虎教授分别进行主持。\n\n下午，“统计学科发展论坛”和“青年教师成长论坛”两场分论坛同时举行。活跃在统计学科领域的30多名权威专家和领军人才参加了研讨。\n\n在统计学科发展论坛上，唐晓彬从人才培养、师资队伍建设、党建引领、科研成果、实习基地建设和对外合作等方面汇报了学院发展情况。与会专家充分肯定了学院在科技统计、对外贸易统计、国际产业链研究等方面形成的特色优势。建议学院以国家战略和社会需求引导学科发展，围绕“十五五”统计工作需求组织研究；将对外经贸统计学科作为重点方向持续建设，并通过分类评价调动教师积极性；加强新质生产力测度研究，深化数智技术与经贸统计融合；深化与政府部门及兄弟高校合作，提升社会服务能力。\n\n青年教师成长论坛由陈全润主持，学院教师刘亚文、韩子非、张俊荣、陈欣悦、陈薪卉分别汇报了各自的科研进展与未来研究计划。随后专家结合研究对象、学科归属、方法与数据、创新贡献、选题表述和基金申报等方面提出了一系列富有建设性的指导意见。特别强调，研究应围绕真正重要且能够回答的现实问题展开，明确成果服务对象，以统计学方法形成可验证的增量贡献。\n\n本次研讨会的成功召开将为我校统计学科建设注入新动能，统计学院将认真梳理与吸纳与会专家的宝贵意见，进一步凝练学科方向、强化特色优势、补齐发展短板，推动统计学科建设实现更高质量跃升。\n\n（通讯员：刘思明 陈全润 摄影：王湘宁 刘忠鑫 胡灏楠 审核：李悦 唐晓彬）"}, "portal_2157126872162304": {"notice_id": "portal_2157126872162304", "title": "我院与研究生院联合开展《人工智能+国际经贸项目制课程》期中汇报交流会", "source": "卓越人才培养学院", "category": "教务通知", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2157126872162304", "deadline": "", "event_time": "2025-11-05", "summary": "学院联合研究生院开展项目制课程期中汇报交流会，复盘教学成果", "content": "为扎实推进项目制课程建设，锚定实战化育人导向，持续优化复合型拔尖人才培养模式，精准把控课程教学进度与实战育人成效，11月5日，卓越人才培养学院联合研究生院组织开展《人工智能+国际经贸项目制课程》期中汇报工作。学院通过“课前教师座谈—学生期中汇报—点评总结”的完整流程，全面复盘课程阶段性教学成果，梳理问题、谋划优化举措。\n\n课程汇报正式开始前，卓越人才培养学院执行院长杨杭军、副院长周末、办公室主任曾明月，研究生院副院长张悦及数字经济实验室王洋老师，与8位课程任课教师开展专题教学座谈会。会上，各位任课教师结合半学期授课实践，全面反馈课程运行情况与学生培养现状。老师们一致表示，本届学生项目整体表现超出教学预期，同时结合课程实操过程，提出了课程优化的思考与建议。\n针对课程运行细节，教师们反馈，当前课程选题立足经贸现实场景、成熟规范，为进一步释放学生创新潜能、锤炼独立科研实战能力，后续可探索学生自主选题的新模式。此外，学生分组差异对项目推进速度影响较大，能力突出的学生能够有效带动小组进度，提升项目整体效率。同时，同学们也高度关注实战成果的考核评价机制以及后续成果转化、论文发表相关安排。\n针对教师提出的各类问题与优化建议，杨杭军院长作总结部署。他指出，卓越人才培养学院和研究生院对《人工智能+国际经贸项目制课程》一直给予全方位、持续性支持，目前已配套落实教学改革项目与助教工作量安排。下一阶段，学院将结合师生反馈，科学优化期末评分考核机制，细化课程管理制度，持续完善项目制课程育人体系。\n\n座谈结束后，课程正式开展期中项目成果汇报。本次汇报共涵盖18个学生小组，各组围绕真实经贸、金融、法律、会计、保险等问题，依次展示阶段性实战成果、研究框架、数据分析与落地进展，将课堂所学的人工智能工具运用到经贸问题研判当中。整场汇报历时两小时，流程有序、内容扎实，充分展现了学生解决真实经贸问题的实战能力。\n\n汇报结束后，杨杭军院长对各组汇报成果进行集中点评。他充分肯定课程阶段性实战育人成效，评价18个小组的项目质量整体超出预期，高度认可学生的科研探索能力与实践成果。同时，针对汇报中存在的共性问题，他对同学们提出指导建议，希望大家着重打磨报告成果展示与逻辑表达技巧，进一步提升科研综合素养。\n\n此次期中汇报交流会，有效梳理了项目制课程实战教学亮点与优化空间。下一步，我院将持续深耕人工智能与国际经贸交叉领域实战化人才培养，不断迭代课程教学模式、完善过程性考核体系，依托项目制课程搭建真实科研练兵平台，培养兼具理论功底与实操本领的拔尖创新复合型人才。"}, "portal_2183323391844352": {"notice_id": "portal_2183323391844352", "title": "关于继续教育学院（高级研修学院）中外合作办学项目费用发放公示", "source": "继续教育学院（高级研修学院）", "category": "行政党务", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2183323391844352", "deadline": "", "event_time": "", "summary": "继续教育学院公示中外合作办学项目费用发放，11月9日前可提异议", "content": "按照《对外经济贸易大学党政管理及其他专业技术人员学校专项工作绩效和管理绩效发放指导意见（试行）》精神，我院现对拟发放的中外合作办学巴黎一大企业管理硕士相关费用进行公示，发放原则及标准参照《中外合作办学各类费用开支标准》执行，本公示期自2026年11月6日至11月9日。在此期间，任何单位或个人如有异议，均可向我部门专项工作绩效领导小组署名提出。匿名异议恕不受理。\n联系人：赵小杰 64493212\n发放项目：\n1、巴黎一大企业管理硕士项目毕业答辩费、论文指导费、论文指导课程费\n指导时间：2026年7月-10月\n发放标准： 论文答辩费：400元/学生\n论文指导费：2100元/人\n论文指导课程：1000元/小时\n发放人数：1名退休返聘人员\n\n附：发放明细"}, "portal_2184216648572928": {"notice_id": "portal_2184216648572928", "title": "\"展翼未来 才子朝阳——灯塔计划\"2026年就业招聘会在我校成功举行", "source": "国际学院", "category": "就业实习", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2184216648572928", "deadline": "", "event_time": "2026-11-03", "summary": "贸大专场招聘会成功举办，60余家企业提供岗位，近600名学子求职", "content": "2026年11月3日下午，\"展翼未来 才子朝阳——灯塔计划\"2026年促进高校毕业生就业招聘活动的贸大专场招聘会在对外经济贸易大学宁远楼一层大厅成功举行。本次活动由北京市朝阳区人力资源和社会保障局联合我校国际学院、招生就业处主办，旨在以人工智能赋能就业服务创新，搭建高校毕业生与优质企业的精准对接桥梁，助力青年学子在数字化浪潮中抢占职业发展先机，实现高质量充分就业。\n\n当日下午，活动现场气氛热烈。本次招聘会汇聚60余家知名企业，涵盖信息技术、生物医药、金融服务等多个热门领域，字节跳动、普华永道等行业头部企业悉数到场。现场设有60余家企业展位，吸引近600名学子到场求职，共收取简历2400余份，330人现场达成初步就业意向。招聘会同步开启线上带岗直播，主播化身就业推介官，实时解读岗位详情、在线答疑解惑，面向海内外推介优质职位，累计吸引41.9万人次在线观看，实现了\"线下精准对接+云端广覆盖\"的立体化求职服务场景。\n\n本次招聘会最大亮点为\"豆包工作AI校园行\"特色板块。公益课程环节开设《AI Agent：从使用到创造》课程，引导学生养成Agent式工作思维，深度剖析AI招聘的底层筛选链路，揭秘简历投递中的\"5道关卡\"与\"秒拒雷区\"，指导学生精准优化简历关键词。实战技巧环节传授利用AI工具打磨简历、模拟压力面试等实用技能，重点提示AI视频面试中的语音、语义与表情评分维度。现场特设AI智能体验区，提供简历秒改、面试预演、岗位精准推荐、职业智能测评等数字化服务，学子们沉浸式体验AI赋能下的高效求职，提前熟悉从投递到签约的完整闭环。\n\n与会学子纷纷表示，本次活动为其提供了宝贵的就业实践平台与行业洞察机会。不少来华留学生提到，通过与企业代表的直接交流，不仅了解到中国前沿行业的发展动态，也进一步明确了自身职业能力的提升方向。多位参会学生认为，60余家企业的多元化岗位和开放包容的用人理念，体现了市场对高素质人才的重视与欢迎，AI赋能的创新形式更让其感受到技术变革为职业发展带来的无限可能，增强了积极应对未来职场挑战的信心。\n\n通过校地企多方协同，本次专场招聘会活动不仅为学子搭建了从学业到就业的顺畅通道，也为朝阳区\"灯塔计划\"品牌注入了高校智慧与青年活力。"}, "portal_2184464422887424": {"notice_id": "portal_2184464422887424", "title": "关于组织2026年北京高校本科教学建设项目(继续教育类）申报工作的预通知", "source": "继续教育学院（高级研修学院）", "category": "教务通知", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2184464422887424", "deadline": "2026-11-11", "event_time": "", "summary": "教师申报北京高校本科教学建设项目，11月11日16:00前提交材料", "content": "各学院、各位老师：\n根据北京市教育委员会关于申报2026年北京高等教育本科教学改革创新项目、优质本科课程、优质本科基本教学资源、优秀教学创新示范案例等通知精神，继续教育名额见附件1通知，继续教育学院将组织2026年北京高校本科教学建设项目推荐工作。现将有关事项通知如下：\n1、各单位应高度重视推荐评选工作，结合已开展的本科教学项目建设情况，突出重点，积极组织推荐申报；\n2、因北京市教委要求报送推荐评选材料的时间紧张，请院部教师参考附件1链接的通知要求积极准备材料；\n3、请于2026年11月11日16:00前将申报材料电子版发送到zhangguoxia@euibe.com\n联系人电话：张国侠64493017\n\n继续教育学院\n2026年11月6日\n\n附件1：2026年北京高校本科教学项目\n序号\n名称\n通知链接\n\n1\n北京高校\"优质本科课程\"\nhttps://jw.beijing.gov.cn/gjc/tzgg_15688/202611/t20261103_4930640.html\n\n2\n北京高校“优质本科基本教学资源”\nhttps://jw.beijing.gov.cn/gjc/tzgg_15688/202611/t20261103_4930647.html\n\n4\n北京高校优秀教学创新示范案例\nhttps://jw.beijing.gov.cn/gjc/tzgg_15688/202611/t20261103_4930656.html\n\n5\n北京高等教育“本科教学改革创新项目”\nhttps://jw.beijing.gov.cn/gjc/tzgg_15688/202611/t20261103_4930662.html"}, "portal_2188554435518464": {"notice_id": "portal_2188554435518464", "title": "韩国留华校友访问团到访对外经济贸易大学", "source": "国际学院", "category": "国际交流", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2188554435518464", "deadline": "", "event_time": "2025-11-05", "summary": "韩国留华校友访问团到访贸大开展交流活动", "content": "11月5日，由国家留学基金管理委员会与中国驻韩国大使馆共同组织的韩国留华校友访问团一行26人到访对外经济贸易大学，其中包括4位曾在贸大学习的韩国校友。访问期间，访问团开展了交流座谈、中华文化体验、校园参观及专题讲座等活动。对外经济贸易大学国际学院院长刘金兰、校友与基金工作处副处长缪琦等出席欢迎仪式，与访问团成员共叙留华情谊，共话中韩友好交流与合作。\n\n共叙留华情谊，深化交流合作\n\n欢迎仪式上，对外经济贸易大学国际学院院长刘金兰对访问团的到来表示热烈欢迎，并介绍了学校的办学特色、国际化发展及中韩教育交流合作情况。她表示，学校充分发挥经济、贸易等学科优势，积极推进国际化办学，与韩国高校在人才培养、学生交流及学术合作等领域保持着良好的合作关系。希望以此次访问为契机，进一步加强与韩国留华校友的联系，发挥留华校友在促进中韩友好交往中的桥梁纽带作用。对外经济贸易大学校友与基金工作处副处长缪琦介绍了学校校友工作及服务体系建设情况，重点介绍了电子校友卡、“贸大人”小程序等校友服务平台，以及海内外校友网络建设、校友联络与服务等方面的工作。她表示，希望进一步密切与韩国贸大校友的联系，持续拓展校友交流渠道，增进校友与母校之间的联系与互动。\n\n韩国优秀留华校友访问团团长任炳翼代表全体成员对学校的热情接待表示感谢，分享了走进贸大的感受，并表达了对进一步加强中韩友好交流的期待。对外经济贸易大学1995级国际贸易专业留学生、韩国校友李在彬回顾了在贸大求学的经历，分享了当年在北京学习、生活的难忘回忆，表达了重返母校的喜悦之情及对学校发展变化的感慨。\n\n体验中华文化，感受校园风采\n\n欢迎仪式后，访问团成员参加了中华传统扎染文化体验活动。在工作人员的指导下，大家亲手制作扎染作品，在动手实践中感受中国传统染织工艺的独特魅力，进一步加深了对中华优秀传统文化的了解。\n\n随后，访问团参观了学校校史馆和对外经贸博物馆，通过历史资料、实物展陈及现场讲解，了解学校的发展历程、办学成就与学科特色，感受贸大的历史积淀与发展变化。\n\n聚焦经贸发展，增进交流了解\n\n当日下午，对外经济贸易大学中韩经济文化交流中心执行主任、韩国校友会会长韩康一教授为访问团带来经贸主题讲座，介绍了中韩经贸交流与合作的相关情况，并结合实际进行分享。讲座结束后，访问团成员与韩康一教授进行了交流互动，现场气氛融洽。\n\n此次访问以留华校友为纽带，将校友交流、文化体验与经贸讲座相结合，为韩国留华校友重温在华求学经历、了解中国高校发展搭建了交流平台，也进一步密切了学校与韩国校友的联系。\n\n未来，对外经济贸易大学将继续发挥国际化办学和学科特色优势，加强与韩国高校及留华校友的交流联系，深化教育与人文领域的交流合作，为增进中韩两国人民相互了解、促进友好交往贡献贸大力量。"}, "portal_2259260431097856": {"notice_id": "portal_2259260431097856", "title": "网络安全和信息化处赴国内合作办公室和资产管理处调研交流", "source": "网络安全和信息化处", "category": "行政党务", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2259260431097856", "deadline": "", "event_time": "2025-11-06", "summary": "信息处赴国合办、资产处调研交流信息化建设工作", "content": "11 月 6 日上午，网络安全和信息化处（以下简称“信息处”）王元彬处长带队，先后赴国内合作办公室（以下简称“国合办”）、资产管理处（以下简称“资产处”）开展调研交流。国合办邵延方主任、资产处祁雪冻处长、国合办李瑞芳副主任、资产处徐伟副处长出席座谈会。\n在国合办调研座谈中，邵延方主任介绍了国合办主要业务职能与非学历教育管理平台建设进展。双方围绕数据对接、共享查询、智能体建设、系统安全等重点内容展开深入研讨，交换工作思路。\n\n在资产处调研座谈中，祁雪冻处长介绍资产信息系统运行现状及后续建设规划，并对房产管理、资产账实等工作的智能化、数字化提出建议。双方就数据对接、数据安全、智能应用落地等事项充分沟通交流。\n\n座谈期间，各方达成共识：将从学校智慧校园顶层设计方面统筹各方工作，并将逐项推进本次调研研讨提出的相关事项，建立常态化沟通联动机制，持续协同推进相关信息化建设工作。\n国合办邵腾、何杨煜琪，资产处莫勇、王雅轩，信息处张烨青、汪平参加调研。"}, "portal_2083566010982400": {"notice_id": "portal_2083566010982400", "title": "关于举行2026年度虹远楼消防演习的通知", "source": "保卫处", "category": "其他", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2083566010982400", "deadline": "", "event_time": "2026-11-10", "summary": "学校11月10日举行虹远楼消防演习，提高师生自救能力", "content": "为提高师生在面对火灾等突发事件时自我保护和自我救助的能力，学校决定于11月10日举行2026年度虹远楼消防演习。"}, "portal_2091965876494336": {"notice_id": "portal_2091965876494336", "title": "关于召开2026年度虹远楼消防演习协调会的通知", "source": "保卫处", "category": "行政党务", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2091965876494336", "deadline": "", "event_time": "2026-11-06", "summary": "学校11月6日召开虹远楼消防演习协调会", "content": "为保证2026年度虹远楼消防演习顺利进行，学校定于11月6日14:00在清远楼101会议室召开2026年度虹远楼消防演习协调会。"}, "portal_2154355150249984": {"notice_id": "portal_2154355150249984", "title": "关于召开全校信息员培训交流会的通知", "source": "网络安全和信息化处", "category": "行政党务", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2154355150249984", "deadline": "", "event_time": "2026-11-09", "summary": "全校信息员培训交流会11月9日召开，各单位信息员参会", "content": "会议时间：2026年11月9日10:00-11:30\n会议地点：行政楼222会议室\n参会成员：各院、部、处信息员"}, "portal_2162297096671232": {"notice_id": "portal_2162297096671232", "title": "关于举办求职训练营--模拟面试（总第十五期）的通知", "source": "招生就业处", "category": "就业实习", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2162297096671232", "deadline": "", "event_time": "2026-11-12", "summary": "面向学生举办模拟面试活动，11月12日举行，需扫码进群参与", "content": "各位同学：\n为帮助同学们做好求职准备，提升就业竞争力，筑牢未来职业发展根基，现举办求职训练营--模拟面试（总第十五期）活动，欢迎2026届毕业生和非毕业年级同学积极参加，具体内容通知如下：\n一、活动时间\n2026年11月12日（周四）下午14：30-16：30\n二、活动地点\n求真楼一层招聘大厅\n三、活动形式\n活动根据真实无领导小组面试流程及要求开展。现场面试考评学生的举止仪表、语言表达能力、综合分析能力、人际协调能力、应变能力、动机与岗位匹配性等，面试结束后专家老师现场进行点评，针对突出问题进行指导。\n四、本期嘉宾\n王大川，宁波银行股份有限公司北京分行校招负责人。兼具央企与上市银行两大行业的跨界背景，拥有扎实全面的人力资源多模块实战经验，并具备多年校园招聘咨询经验。\n五、参与方式\n请感兴趣的同学扫码加入微信群，同学可以参与现场面试或担任观众，进群后会有工作人员联系确认活动信息。\n\n如微信群满，再添加微信小助手进入群聊。\n\n招生就业处\n\n2026年11月6日"}, "portal_2260511319351296": {"notice_id": "portal_2260511319351296", "title": "关于开展全校信息系统账号权限排查的通知", "source": "网络安全和信息化处", "category": "行政党务", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2260511319351296", "deadline": "2026-11-13", "event_time": "", "summary": "各单位须于11月13日前完成账号权限排查并报送台账与整改报告", "content": "全校各单位：\n为进一步加强学校信息系统账号和权限安全管理，落实最小权限原则，防范僵尸账户、越权访问、接口越权及智能体权限滥用等安全风险，提升信息系统安全防护水平，结合上级单位要求和我校实际情况，现决定在全校范围内开展信息系统账号权限排查的工作。有关事项通知如下。\n一、排查范围\n各责任单位对所有管辖内的信息系统、网站、数据库、中间件、API接口、运维管理平台、网络及安全设备、智能体应用等开展全面排查，覆盖所有账号、角色、权限、接口访问和防护策略。包括但不限于：教职工账号、学生账号、运维账号、特权账号、共享账号、测试账号、默认账号、第三方服务账号、API令牌、智能体账号及工具调用权限等。\n二、重点任务\n（一）全面摸排账号和权限，建立权限管理台账。各责任单位逐一梳理所有管辖内信息系统的账号类型、使用人、岗位职责、角色权限、授权范围、最近登录时间、账号状态、是否特权账号等信息，建立本单位信息系统权限管理台账，明确系统负责人和账号管理员，实行信息动态更新。\n（二）清理僵尸账户。重点清理离岗离职人员账号、长期未登录账号、共享账号、默认账号、测试账号、临时账号及无明确责任人的账号。对确需保留的，应说明理由并落实审批、锁定、限期和审计措施；对不再使用的，应及时停用、删除或回收权限。\n（三）缩小越权用户权限。按照“最小必要、职责分离、按需授权、到期回收”原则，复核各账号角色和权限配置，回收与岗位职责无关、超出业务需要、长期未使用及临时授权到期的权限。重点核查并纠正低权限用户具有批量导出数据权限、普通用户具有后台管理权限等典型越权配置。特权账号应严格控制数量，落实审批、双因素认证、操作审计和定期复核要求。\n（四）排查接口越权风险。梳理对外和对内API接口清单，检查接口鉴权、身份认证、令牌管理、访问控制、参数校验、敏感数据返回等情况，重点排查未授权访问、横向越权、纵向越权、参数篡改、越权查询和批量数据泄露等风险，发现问题及时整改。\n（五）排查高访问系统和设备防护策略。对高访问量、高敏感、高权限、互联网暴露的信息系统，以及服务器、数据库、中间件、网络设备、安全设备、堡垒机、VPN、运维平台等，检查访问控制、口令强度、默认口令、暴露端口、远程管理、补丁更新、日志审计、备份恢复和安全防护策略落实情况。\n（六）排查智能体权限。对使用大模型、智能体、自动化代理、插件工具、知识库和外部接口的应用，梳理智能体账号、API Key、数据源访问、工具调用、自动执行和外部接口权限，检查授权审批、权限边界、数据隔离、操作审计和异常处置机制，防止智能体越权访问、过度授权和权限滥用。\n三、工作安排\n（一）自查整改阶段：即11月9日至11月13日。各单位对照重点任务开展全面自查，建立台账，清理僵尸账户，回收越权权限，整改接口越权、防护策略和智能体权限风险。\n（二）材料报送阶段：请各单位于11月13日前，将加盖单位公章的《信息系统权限管理台账》和《账号权限及越权风险排查整改报告》纸质版扫描件及可编辑的电子版原件，通过电子邮箱报送至信息处。涉密及敏感信息不得通过普通邮件、即时通讯工具明文传输。\n（三）抽查复核阶段：11月14日至11月20日。信息处将对各单位报送情况和整改落实情况进行抽查复核，对台账不完整、整改不到位的单位督促限期整改。\n四、工作要求\n（一）各单位要严格落实“谁主管谁负责、谁运营谁负责”要求，明确专人负责，确保排查覆盖全部系统和全部账号，不留死角。\n（二）账号台账不得记录明文密码、密钥等敏感信息。对特权账号、第三方账号和智能体账号应重点管理，落实审批、审计和定期复核。\n（三）坚持边查边改、立行立改。对短期难以整改的风险，要制定整改措施、明确责任人和完成时限，实行闭环管理。\n（四）对因排查整改不到位、台账管理不规范导致网络安全事件的，将依规追究相关单位责任。\n材料接收邮箱：safe@uibe.edu.cn\n联系人：李颖 64494228\n附件： 1.信息系统权限管理台账（模板）\n2.账号权限及越权风险排查整改报告（提纲）\n\n网络安全和信息化处\n\n2026年11月6日"}, "portal_2263296752443392": {"notice_id": "portal_2263296752443392", "title": "关于应对雨雪冰冻天气的温馨提示", "source": "后勤处", "category": "其他", "publish_time": "2026-11-06", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=2263296752443392", "deadline": "", "event_time": "", "summary": "提醒全校师生注意11月7日至8日雨雪天气安全", "content": "11月7日11时至8日11时我市将出现一次雨雪天气过程，为切实保障我校师生人身及财产安全，现就有关事项进行提醒。"}, "portal_1855062122467328": {"notice_id": "portal_1855062122467328", "title": "“智探前沿，产教同行” ——智数学院组织本研学生赴科大讯飞开展企业参访活动", "source": "人工智能与数据科学学院", "category": "学术活动", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1855062122467328", "deadline": "", "event_time": "2026-10-29", "summary": "智数学院组织本研学生赴科大讯飞参访，活动已于10月29日举行", "content": "10月29日，人工智能与数据科学学院组织本研学生代表前往科大讯飞开展主题为“智探前沿，产教同行”的产业实践参访活动，推动课堂理论与产业现实深度对接，帮助研究生直观触摸国内人工智能龙头企业的创新发展脉搏。\n\n本次参访设置三大核心环节。在企业技术与产业布局讲解环节，企业讲解员系统介绍了科大讯飞的发展历程、技术研发体系与战略布局，重点围绕大模型算力架构、AI赋能科研、AI交叉方向创新等内容展开分享，结合新质生产力背景解读人工智能技术的产业价值，帮助同学们理解前沿技术从算法研发到产品落地的完整链条。\n\n沉浸式产品体验环节中，同学们近距离接触多款讯飞核心AI产品：与“AI棋手”对弈感受人机交互协同，佩戴讯飞AI眼镜体验第一视角实时信息服务，同时观摩星火大模型、智能办公本、AI多语种透明屏等产品，直观感受大模型在文献梳理、科研辅助等场景的实际应用，不少同学结合自身专业背景，现场思考AI工具服务科研与生活的可行路径。\n\n在行业落地案例分享环节，工作人员围绕AI+教育、AI+医疗、AI+工业等领域，展示智能诊断、AI板书、工业听诊器等实际应用场景，讲解技术落地背后的真实需求、工程难点与商业化逻辑。参访过程中，同学们围绕科研选题难点、行业发展趋势、不同岗位成长路径等问题积极提问，进一步明晰了AI行业对研究生的核心能力要求。\n\n从大模型产业化到行业落地应用，同学们在“看、听、触、问”中，对AI赋能行业的广度与深度有了更加立体、真实的认知，也意识到复合型能力、工程落地思维、面向真实问题的科研意识，是新时代AI方向智数学子的核心竞争力。\n\n本次参访顺利完成研学目标，后续学院还将持续推出企业参访、行业讲座等系列学术实践活动，引导同学们将科研学习与产业需求紧密结合，在人工智能产业浪潮中找准研究方向，成长为符合行业需求的复合型创新人才。\n\n2026年11月4日\n人工智能与数据科学学院"}, "portal_1856290816221184": {"notice_id": "portal_1856290816221184", "title": "我校召开2026年网络安全和信息化领导小组第二次会议", "source": "网络安全和信息化处", "category": "行政党务", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1856290816221184", "deadline": "", "event_time": "2026-11-03", "summary": "学校召开网络安全和信息化领导小组会议，部署AI+教育与智慧校园建设", "content": "为深入贯彻落实《教育发展“十五五”规划》及教育部“人工智能+教育”工作部署，11月3日下午，我校召开2026年网络安全和信息化领导小组第二次会议。会议以“擘画‘AI+教育’蓝图，筑牢‘网安+智能’底座”为主题，校党委书记黄宝印、校长吴卫星、党委副书记张小锋出席会议，网络安全和信息化领导小组成员单位负责人参会。会议由校长助理李明主持。\n\n首先，发展规划处处长戚依南介绍《对外经济贸易大学“人工智能+教育”行动计划》编制工作情况，网络安全和信息化处处长王元彬介绍网络安全攻防演练方案、2027年智慧校园建设需求调研情况以及校级人工智能平台项目建设进展情况。与会单位负责人围绕行动计划、网络安全保障、信息化项目建设和人工智能应用等内容进行交流研讨。\n\n吴卫星在讲话中指出，要立足学校财经特色和国际化优势，抢抓人工智能发展机遇，推动人工智能与教育教学、科学研究、校园治理深度融合，以智能化转型为学校高质量发展蓄势赋能。一是强化安全统筹，夯实发展保障。要落实“管发展必须管安全”要求，压实网络安全三级责任制，提升网络安全防御能力。依托“315”行动计划系统梳理建设需求，建立项目储备库，坚持分步实施、急用先行，用好校级人工智能公共平台，加快形成具有经贸特色的教学、科研和服务能力。二是优化资源配置，提升算力使用效益。要统筹规划算力资源建设与多校区协同配置，推动算力资源统一调度、共享使用，避免分散建设和闲置浪费。建立健全“投入—回报”机制，完善算力使用监测与绩效评价，确保算力资源用足、用好、用出成效。三是深化人工智能赋能，提升师生数字素养。要将AI能力要求嵌入本硕博培养方案和课程体系，分层分类设计通识课程与专业融合课程，推动人工智能教育贯穿人才培养全过程。加强教师培训与应用支持，全面提升师生运用人工智能的能力和素养。\n\n黄宝印在总结讲话中充分肯定了智慧校园建设取得的良好进展。他指出，今天的会议是就学校人工智能+教育行动的再部署再推进，智慧校园建设是事关学校长远发展的战略工程，我们要准确把握大势、清醒认识差距，增强紧迫感，凝聚全校共识，加快形成赋能转型、流程重塑、提质增效的人工智能教育新生态，奋力走出一条具有贸大特色、财经底色、国际视野的数智赋能高质量发展新路。一是坚持底线思维，高度重视网络安全能力建设。要牢牢守住网络安全政治底线，切实保障网络安全建设投入，把教育部攻防演练作为常态化网络安全能力建设的抓手，为智慧校园建设筑牢安全屏障。二是坚持系统观念，大力度推进智慧校园建设。要坚持全校“一盘棋”，建立“周沟通、月通报、期研讨、年总结”推进机制，增强认知力、提高共识力、加大行动力，加快推动人工智能+行动的落实落地落好。三是强化整体意识，全面提升保障能力建设。要全面夯实投入、组织、人员、制度保障体系，充分发挥领导小组统筹协调作用，强化部门协同联动，配强专业技术力量，健全考核评价机制，以数字化转型成效检验建设质量。\n李明在主持会议时表示，各单位要认真落实会议要求，压实工作责任，完善相关方案，加强协同联动，统筹推进智慧校园建设与网络安全保障，推动各项任务落地见效。"}, "portal_1794927048036352": {"notice_id": "portal_1794927048036352", "title": "2024年度研究生教育教学改革重大项目结项公示", "source": "研究生院", "category": "教务通知", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1794927048036352", "deadline": "2026-11-07", "event_time": "", "summary": "研究生教改重大项目结项公示，11月7日前可提异议", "content": "根据研究生教育教学改革项目工作安排，2026年10月，研究生院开展2024年度研究生教育教学改革重大项目结项工作。\n经项目负责人所在单位审核、校内外专家评审、研究生院审核，4项研究生教育教学改革重大项目通过结项评审，结项名单请详见附件。\n现予以公示，公示期自2026年11月5日至2026年11月7日。如有异议，请于2026年11月7日17：00前向研究生院反映，匿名异议不予受理。公示期结束后，公示结果如无异议，相关项目即正式结项。\n联系方式：徐哲潇 64496045 pyb@uibe.edu.cn\n\n研究生院\n2026年11月5日"}, "portal_1803808742608896": {"notice_id": "portal_1803808742608896", "title": "2025年度研究生教育教学改革项目结项公示", "source": "研究生院", "category": "教务通知", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1803808742608896", "deadline": "2026-11-07", "event_time": "", "summary": "研究生院公示2025年度教改项目结项名单，11月7日前可提异议", "content": "根据研究生教育教学改革项目工作安排，2026年10月，研究生院开展2025年度研究生教育教学改革项目结项工作。\n经项目负责人所在单位审核、研究生院审核、校内外专家评审，81项研究生教育教学改革项目通过结项评审，分别是：\n“AI+学习”数智化改革项目5项；\n“AI+教学”数智化改革项目54项（包括智慧课程项目15项、专业学位案例建设项目24项）；\n“AI+管理”数智化改革项目4项；\n“AI+科研”数智化改革项目15项；\n“AI+国际交流”数智化改革项目2项；\n“AI赋能教学”课程建设项目1项（往年延期项目）。\n结项名单请详见附件。\n现予以公示，公示期自2026年11月5日至2026年11月7日。如有异议，请于2026年11月7日17：00前向研究生院反映，匿名异议不予受理。公示期结束后，公示结果如无异议，相关项目即正式结项。\n联系方式：徐哲潇 64496045 pyb@uibe.edu.cn\n\n研究生院\n2026年11月5日"}, "portal_1800143134822400": {"notice_id": "portal_1800143134822400", "title": "关于召开2027届毕业班辅导员就业工作专题培训会的通知", "source": "招生就业处", "category": "就业实习", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1800143134822400", "deadline": "", "event_time": "2026-11-11", "summary": "2027届毕业班辅导员参加就业登记系统培训，11月11日举行", "content": "各学院：\n为落实《教育部办公厅关于建立高校毕业生毕业去向登记制度的通知》教学厅〔2023〕5号文件精神，进一步做好毕业去向登记和审核工作，我处将统一组织“全国高校毕业生毕业去向登记系统”使用专题培训，请各位2027届毕业班辅导员老师按时参加。\n一、主题\n全国高校毕业生毕业去向登记系统使用培训\n二、时间\n2026年11月11日（周三）10:00-11:00\n三、地点\n求真楼一层招聘大厅\n四、参会人员\n2027届毕业班辅导员、招生就业处全体就业工作人员\n\n招生就业处\n2026年11月5日"}, "portal_1805196566499328": {"notice_id": "portal_1805196566499328", "title": "关于虹远楼浴室暂停开放的通知", "source": "后勤处", "category": "其他", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1805196566499328", "deadline": "", "event_time": "", "summary": "虹远楼浴室因故障今日暂停开放，同学可前往学士园浴室", "content": "虹远楼浴室供水系统突发故障，正在紧急抢修，暂无法提供洗浴服务，今日暂停虹远楼浴室开放，有洗浴需求的同学可至学士园浴室洗浴。"}, "portal_1824105430212608": {"notice_id": "portal_1824105430212608", "title": "关于调整体质健康集中测试补测时间的通知", "source": "体育部", "category": "教务通知", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1824105430212608", "deadline": "", "event_time": "2026-11-14", "summary": "体质健康集中测试补测推迟至11月14日，学生按新时间参加", "content": "根据天气预报显示，本周末有雨雪天气，气温偏低，为保障学生测试安全，经研究，对以下测试时间做出调整：\n1.原定于11月7日（周六）安排的集中测试补测，推迟至11月14日（周六）\n2.测试时段为上午8:30-12:00；下午13:00-16:00\n特别提醒：请相关学院及时通知学生，按照变更后的测试时间参加测试。如遇天气情况变动，将另行通知。\n\n体育部\n\n2026年11月5日"}, "portal_7071991677227008": {"notice_id": "portal_7071991677227008", "title": "【校级奖学金项目】关于对外经济贸易大学第十五届瑞士联合国国际组织访学项目补录的通知", "source": "国际合作交流处", "category": "国际交流", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=7071991677227008", "deadline": "2026-11-12", "event_time": "2027-01-09,2027-01-10,2027-01-11,2027-01-12,2027-01-13,2027-01-14,2027-01-15,2027-01-16,2027-01-17", "summary": "瑞士联合国访学项目补录，学生11月12日前线上申请", "content": "自2010年起，备受贸大学子喜爱的联合国国际组织项目已成功举办十四届。今年，本项目预计将于2027年1月9日至1月17日开展，为期10天（含途中时间）。想走进国际组织、拓展全球视野的你，千万不要错过！\n一、项目介绍\n日内瓦箂科中心（简称“箂科中心”）于 2017 年成立于瑞士日内瓦，由卢先堃教授创办，卢教授曾任中国商务部高级官员、中国常驻 WTO代表团前参赞。自成立以来，中心与中瑞多所高校合作，已成功组织实施了多期国际组织实践项目，按照“走进去、坐下来、学得到”的原则，组织中国大学生深入联合国、WTO、国际红十字会等国际组织。在组织相关项目时，中心尤其注重协助中国大学生了解相关国际组织的实习和就业机会以及要求，专门邀请国际组织官员介绍相关招聘情况，为其未来通过实习和应聘参与相关国际组织的工作提供广泛机会。\n二、日程安排\n日程表\n第1天（周六）9 Jan\n日内瓦\n\n抵达日内瓦\n\n第2天（周日）10 Jan\n日内瓦\n\n自由活动\n\n第3天（周一）11 Jan\n\n上午\n\n主题培训课程一：\n世贸组织（WTO）\n主题：世贸组织改革与国际经贸治理\n讲师：WTO官员\n\nWTO参观\n\n下午\n\n主题培训课程二：\n世界知识产权组织（WIPO）\n主题：WIPO及其在国际经贸治理中的作用\n讲师：WIPO 官员\n\n欢迎晚宴\n\n第4天（周二）12 Jan\n日内瓦\n\n上午\n主题培训课程三：\n世界银行驻日内瓦代表处\n主题：国际发展及世界银行的作用\n讲师：世界银行官员\n\n下午\n主题培训课程四：\n联合国国际贸易中心（ITC）\n主题：ITC简介及其与中国的合作\n讲师：ITC官员\n\n第5天（周三）13 Jan\n日内瓦\n\n上午\n主题培训课程五：\n国际劳工组织·（ILO）\n主题：国际劳工组织及其在企业社会责任的工作\n讲师： ILO官员\n\nILO总部参观\n\n下午\n\n主题课程培训六：\n中国驻WTO代表团\n主题：中国在WTO中的作用\n讲师：代表团官员\n\n第6天 （周四）14 Jan\n日内瓦\n\n上午\n主题培训课程七：\n联合国贸发会议（UNCTAD）\n讲师：UNCTAD官员\n\n联合国欧洲总部万国宫参观\n\n下午\n主题培训课程八：\n红十字会与红新月会国际联合会（IFRC）\n主题：IFRC的历史、主要活动和实习项目\n讲师：IFRC官员\n\n第7天（周五）15 Jan\n日内瓦\n\n上午\n主题培训课程九：\n联合国环境计划署日内瓦环境网络（UNEP GEN）\n主题: UNEP 与日内瓦环境保护网络\n讲师: UNEP官员\n\n下午\n主题培训课程十：\n国际标准组织（ISO）\n主题：国际标准化组织及国际产业标准\n讲师：ISO官员\n\n送别晚宴，结营证书颁发\n\n第8天（周六）16 Jan\n日内瓦\n\n自由活动\n\n第9天（周日）17 Jan\n日内瓦/北京\n\n离开日内瓦\n\n注：以上日程可能根据实际情况有所调整，请以最终行程为准。\n\n三、项目费用\n\n拟补录人数：5～15人（考虑时间紧迫，建议提前办理好护照）\n\n项目费用：团费为2300瑞士法郎/人\n\n费用包含：瑞士日内瓦期间课程相关费用、接机和送机、两次晚宴等。\n\n费用未含：\n\n住宿费：住宿费用（酒店：Hotel Auteuil）大约CHF 100/每晚/人（含早）（按学生入住双人间计算，单人间价格另计）。如预定酒店，则活动期间在日内瓦可免费使用市区内公共交通（附赠市区内公交通票），如有其他活动可乘坐火车等，费用由学生自行负担。\n\n往返机票；\n\n保险费；\n\n签证费；\n\n项目期间个人餐费；\n\n瑞士境内交通；\n\n其他未尽事宜。\n\n费用交纳：待录取确认后，学生需将项目费用直接交至学校财务处。\n\n四、项目报名\n\n1. 报名条件：\n\n（1）对外经济贸易大学全日制大二、大三、大四本科生及研究生；\n\n（2）具有良好的英语能力，以保证参与效果；\n\n（3）积极主动，乐于参与互动讨论；\n\n（4）具有强烈的守时意识和团队精神，独立生活能力强，合作宽容，互助友爱；\n\n（5）父母或监护人了解项目有关情况，同意并支持其申请。\n\n2.报名程序：\n\n（1）线上填报：\n\n网址：http://202.204.175.192/UIBEHome.aspx 使用本人的学号及密码登录信息门户，申报项目“第十五届瑞士联合国国际组织访学项目”、编号“UN015”，填写本人相关信息、提交相应材料（需签字盖章），并完成线上申请。\n\n如无法登录网址，可进入本人OA平台，从平台内应用选择“学生端-学生出境平台”进行注册登录。\n\n* 材料要求：线上填写的信息均完整真实并与上传材料有关内容一致，否则不予录取。\n\n五、学院审核\n\n学院进行院内线上审核，并上传《学院推荐函》（见附件）。\n\n六、遴选和派出\n\n（1）项目将视最终报名情况确定遴选方式，报名同学请务必密切关注邮箱通知；\n\n（2）入选同学确认参与项目，缴纳项目费；\n\n（3）举办行前培训和准备会；\n\n（4）参加并完成项目后，参与项目的学生须在回国后两周内向国际交流中心提交项目总结（电子版发至：studytour@uibe.edu.cn）。\n\n七、截止时间\n\n学生申请：2026年11月12日前\n\n学院审批：2026年11月16日17：00前\n\n八、学分兑换\n\n按照规定顺利完成访学项目的本科生，可以替换认知实习1学分，以及通修课程经贸英语（ENG597， 2学分）。学分兑换申请的表格可在教务处网站“文档下载专区”下载使用。学分替换申请须在项目顺利结束，按期回国并提交总结后提出。\n\n九、联系方式\n\n联系人：江老师\n\n联系方式：电话64497289/邮箱studytour@uibe.edu.cn\n\n附件：学院推荐函.xlsx\n\n国际合作交流处\n2026年11月5日"}, "portal_1844258838634496": {"notice_id": "portal_1844258838634496", "title": "关于启动2027级研究生培养方案改革“二上”阶段制定培养方案初稿工作的通知", "source": "研究生院", "category": "教务通知", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1844258838634496", "deadline": "2026-12-31", "event_time": "", "summary": "各研究生培养单位须于12月底前提交2027级培养方案初稿", "content": "各研究生培养单位：\n为贯彻落实《教育强国建设规划纲要（2024—2035年）》和《加快建设教育强国三年行动计划（2025—2027年）》部署，落实《中共中央办公厅、国务院办公厅关于加快推动博士研究生教育高质量发展的意见》《教育部关于深入推进学术学位与专业学位研究生教育分类发展的意见》，根据全校研究生培养方案修订工作整体安排，现将《对外经济贸易大学研究生培养方案修订指导意见（2027级）》（以下简称《指导意见》）予以发布，并就“二上”阶段有关工作通知如下。\n一、前期工作基础\n“一上”阶段（2026年4—7月），各培养单位成立修订工作领导小组，启动培养方案改革工作，广泛征集师生意见、调研国内外一流高校及行业企业等，在充分调研和专家论证基础上，形成院级培养方案改革建议。“一下”阶段（2026年9—10月），研究生院召开研究生培养方案改革系列研讨会，在充分吸收高校专家、行业专家、校友及在校生代表意见基础上，形成《指导意见》。\n二、工作要求\n1.明确工作目标。各培养单位要按照《指导意见》确定的指导思想、基本原则和修订重点，落实立德树人、坚持分类培养、强化交叉融合、筑牢国际化特色、加快数智化改革，切实发挥在人才培养中的主体作用，构建以服务国家战略为导向的人才培养体系。要形成符合《指导意见》要求的2027级研究生培养方案初稿，落实重塑培养目标、升级课程体系、优化总学分要求、完善培养环节等修订重点。\n2.加强组织领导。各培养单位要切实提高政治站位，压实主体责任，细化任务分工，明确时间节点，确保2027级研究生培养方案改革按期高质量完成。\n3.严格质量把关。各培养单位要对照《指导意见》逐项落实修订要求，建立培养目标与专业要求、课程体系、培养环节、考核标准的映射关系。\n4.加强协同配合。加强校院两级沟通交流，凝聚共识、形成合力，共同推动研究生培养方案改革高质量落地。\n三、工作安排\n1.工作内容\n各培养单位应在“二上”阶段（2026年11—12月）根据《指导意见》提交2027级研究生培养方案初稿及相关配套材料。\n2.提交材料\n（1）2027级研究生培养方案初稿\n（2）2027级研究生教学课程大纲\n（3）研究生特色创新课程认定汇总表\n（4）XX专业核心能力画像与培养矩阵表\n3.提交要求\n各培养单位请于12月底前提交2027级研究生培养方案初稿及相关配套材料，新增博士学位授权点培养方案初稿可延至2027年3月前提交。具体提交方式另行通知。\n\n研究生院\n2026年11月5日"}, "portal_1863530658881536": {"notice_id": "portal_1863530658881536", "title": "关于2026年小米奖学金拟获奖学生名单的公示", "source": "研究生工作部", "category": "奖助学金", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1863530658881536", "deadline": "2026-11-12", "event_time": "", "summary": "公示小米奖学金拟获奖名单，11月12日前可实名反映异议", "content": "根据《关于开展2025-2026学年研究生小米奖学金评选工作的通知》和《关于开展2026年本科生“小米特等奖学金”和“小米奖学金”评选的通知》，经学生申请、培养单位推荐、党委研究生工作部和党委学生工作部审核、小米奖学金评审会评审等环节，现评选出10名“小米特等奖学金”拟获奖学生（本科生6人、研究生4人）、40名“小米奖学金”拟获奖学生（本科生24人、研究生16人）。现对拟获奖名单进行公示（见附件）。\n\n公示时间：2026年11月6日-11月12日\n\n如有异议，请于11月12日17:00前，以书面、实名形式向党委研究生工作部、党委学生工作部反映。联系邮箱：uibeygbjz@uibe.edu.cn（研究生）、uibejxj@uibe.edu.cn（本科生）\n\n联系人：王老师，64496309；闫老师，64492276。\n\n校友与基金工作处\n\n党委研究生工作部\n\n党委学生工作部\n\n2026年11月5日"}, "portal_1906651660771328": {"notice_id": "portal_1906651660771328", "title": "关于虹远楼浴室重新开放的通知", "source": "后勤处", "category": "其他", "publish_time": "2026-11-05", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=1906651660771328", "deadline": "", "event_time": "", "summary": "虹远楼浴室抢修完毕重新开放，今日延长至24:00", "content": "虹远楼浴室供水系统已抢修完毕，现虹远楼浴室重新开放，同学们可正常洗浴，浴室开放时间延长至今日24:00。"}, "1c248d2138e4473670766e7ec54b9f55": {"notice_id": "1c248d2138e4473670766e7ec54b9f55", "title": "“中国—伊朗友好之夜”活动上的中国青年 ——我院学子受邀参加...", "source": "外语学院-学院动态", "category": "国际交流", "publish_time": "2026-11-05", "url": "https://sfs.uibe.edu.cn/ttxw/45276d7c1e3b460183e746033e2d293c.htm", "deadline": "", "event_time": "2026-10-30", "summary": "我院波斯语系师生参加中伊友好之夜活动，学生代表发言", "content": "“中国—伊朗友好之夜”活动上的中国青年——我院学子受邀参加活动并发言\n发表时间：2026-11-05\n10月30日晚，在中伊建交55周年暨两国建立全面战略伙伴关系10周年之际，我院波斯语系师生受邀参加“中国—伊朗友好之夜”活动，其中2023级本科生王蕴哲作为中方青年代表进行发言，用他的真实故事传递中伊青年人之间的友好情谊。\n“中国—伊朗友好之夜”由中国人民对外友好协会和伊朗驻华使馆共同举办。中联部、外交部、商务部、全国妇联、社科院等部门及其他中、伊代表共约100人出席活动。中国人民对外友好协会副会长孙学庆、伊朗驻华大使法兹里出席并先后致辞。随后中、伊两国青年代表分别发言致辞。我院波斯语专业学生王蕴哲用流利的波斯语分享了自己与我校伊朗留学生之间有趣、温暖的文化交流故事，他用生动的例子传达出：两国的语言或许无法字字对应，但不同的文明却能够彼此心意相通。\n活动结束后，王蕴哲接受了中国国际广播电台波斯语部记者的采访，采访视频被发布在Facebook、X、Instagram等海外社交平台上。部分中、伊重要新闻媒体也对本次活动进行报道，部分新闻链接如下：\n中国人民对外友好协会官网：\nhttps://cpaffc.org.cn/index/news/detail/id/11552/lang/1.html\n央视CGTN：\nhttps://persian.cri.cn/2026/10/31/ARTI1793419286929299\n澎湃新闻：\nhttps://www.thepaper.cn/newsDetail_forward_34383654\n伊朗伊斯兰共和国驻华使馆微信公众号：\nhttps://mp.weixin.qq.com/s/1kNHj3Ie5mQPr-q7IeH7CQ\n伊朗伊斯兰共和国广播电视组织通讯社：\nhttps://www.irib-news.ir/fa/news/5953317/%D8%B4%D8%A8-%D8%AF%D9%88%D8%B3%D8%AA%DB%8C-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86-%D9%88-%DA%86%DB%8C%D9%86#:~:text=\"%D8%A8%D9%87%20%DA%AF%D8%B2%D8%A7%D8%B1%D8%B4%20%D8%B3%D8%B1%D9%88%DB%8C%D8%B3%20%D8%A8%DB%8C%D9%86%20%D8%A7%D9%84%D9%85%D9%84%D9%84%20%D8%AE%D8%A8%D8%B1%DA%AF%D8%B2%D8%A7%D8%B1%DB%8C%20%D8%B5%D8%AF%D8%A7%20%D9%88,%DA%AF%D8%B3%D8%AA%D8%B1%D8%B4%20%D9\n伊朗学生通讯社：\nhttps://www.isna.ir/news/1405080905269/%D8%A7%D8%B2-%D8%AC%D8%A7%D8%AF%D9%87-%D8%A7%D8%A8%D8%B1%DB%8C%D8%B4%D9%85-%D8%AA%D8%A7-%D9%85%D8%B4%D8%A7%D8%B1%DA%A9%D8%AA-%D8%AC%D8%A7%D9%85%D8%B9-%D8%B1%D8%A7%D9%87%D8%A8%D8%B1%D8%AF%DB%8C-%D8%A8%D8%B1%DA%AF%D8%B2%D8%A7%D8%B1%DB%8C-%D8%B4%D8%A8-%D8%AF%D9%88%D8%B3%D8%AA%DB%8C-%D8%A7%DB%8C%D8%B1%D8%A7%D9%86"}, "fc5f65ad68be27a3948a601bbe072e90": {"notice_id": "fc5f65ad68be27a3948a601bbe072e90", "title": "2026级本科生“名师启航”新生研讨课专题研讨会顺利召开-部门动态-对外经济贸易大学教务处", "source": "教务处-部门动态", "category": "教务通知", "publish_time": "2026-11-04", "url": "http://jwc.uibe.edu.cn/bmdt/e11e89407e734260b987b4d0f682d75a.htm", "deadline": "", "event_time": "", "summary": "教务处召开2026级新生研讨课专题研讨会，属工作动态", "content": "教务处|摄影：教务处|日期：2026-11-04|访问量：\nnull\nCopyRight©版权所有：对外经济贸易大学教务处，ALLRightsReserved\n北京市朝阳区惠新东街10号邮编：100029"}, "d55ac7d732e336f4718434977d36c049": {"notice_id": "d55ac7d732e336f4718434977d36c049", "title": "图书馆一小时数据库培训：Wharton Research Data Services", "source": "图书馆-培训讲座", "category": "学术活动", "publish_time": "2026-11-03", "url": "https://lib.uibe.edu.cn/pxjz/e388bec3515e4b40b16e857ad73c2a35.htm", "deadline": "", "event_time": "2026-11-05", "summary": "图书馆举办WRDS数据库线上培训，11月5日14点开讲", "content": "为便于广大师生更好地利用各类电子资源，图书馆推出一小时数据库培训系列活动。本学期数据库培训将继续采用线上线下相结合的形式，帮助师生梳理学术资源、提升实证研究技巧。\n时 间：2026年11月5日（星期四）14:00–15:00\n主讲人：张霞\n讲座方式：线上\n直播方式：腾讯会议号247-178-953\n讲座主题：如何有效利用WRDS平台进行金融实证研究\n讲座内容：\n1.WRDS平台整体介绍：账号申请、数据查询、访问形式、自学模块、支持服务。\n2.WRDS平台上的金融领域常用科研数据库介绍，如何缩短数据采集及数据分析所需时间以提高研究效率，以S&PCompustat等数据为例使用网页查询方式及SASStudio进行数据提取演示。\n主讲人简介：\n张霞（EricaZhang），沃顿研究数据中心（WhartonResearchDataServices）亚太区客户拓展副总监。她于2018年加入WRDS，负责WRDS在亚太区的全面商务推广及支持服务工作。加入WRDS前，她曾在美国高盛信用风险部门担任分析员。她拥有美国南加州大学商业分析硕士学位及美国印第安纳大学金融学士学位。\n联系信息：\n关于图书馆资源利用问题的咨询与培训，欢迎联系我们：\n联系电话：010-64496105/5195\n邮箱：uibetsg@163.com\n图书馆\n2026年11月3日"}, "3f315fe88849222990633af0f8241dcb": {"notice_id": "3f315fe88849222990633af0f8241dcb", "title": "关于举办2026年“十大杰出学生”暨...", "source": "学工部-公告通知", "category": "其他", "publish_time": "2026-11-02", "url": "https://xgb.uibe.edu.cn/xssw/ggtz/9531ef27d2f741188d6b629e0593c987.htm", "deadline": "", "event_time": "", "summary": "关于举办2026年十大杰出学生评选的通知，正文内容缺失", "content": "机构设置\n部门介绍\n联系方式\n学生事务\n管理规定\n办事指南\n发展咨询\n思想教育\n思想教育\n惠园微讯\n资助中心\n资助中心简介\n奖助项目\n奖助育人\n心理健康\n心理咨询中心简介\n心理健康教育\n咨询预约\n国防教育\n学生军训\n应征入伍\n国防教育活动"}, "0464d91190f64df74907944016e79188": {"notice_id": "0464d91190f64df74907944016e79188", "title": "关于图书馆中央空调上水测试的通知", "source": "图书馆-新闻公告", "category": "其他", "publish_time": "2026-11-02", "url": "https://lib.uibe.edu.cn/xwgg/aca89bd96bda45b0a9012eef1d6bf04c.htm", "deadline": "", "event_time": "2026-11-03", "summary": "图书馆11月3日起空调试水，提醒读者注意防水并带走贵重物品", "content": "各位读者：\n根据北京市热力集团及我校供暖安排，图书馆拟定自11月3日起开启中央空调循环泵加压试水。试水期间管路可能出现“跑、冒、滴、漏”现象甚至突发破裂，请广大读者注意：\n1.如发现漏水、渗水现象，请及时联系图书馆工作人员；\n2.离开座位时请随身携带个人物品，贵重及易损物品务必带离，防止被水淋湿受损；\n3.发现险情，及时报修。现场反馈：直接联系一层总服务台工作人员，或告知所在楼层值班人员；电话报修：物业办公室64495004、图书馆办公室64492261。\n特此通知。\n图书馆\n2026年11月2日"}, "b000e5d0bce652dc00392fc2f3132b8d": {"notice_id": "b000e5d0bce652dc00392fc2f3132b8d", "title": "“贸大法学院学生法律沙龙”第54期活动通知 - 对外经济贸易大学法学院", "source": "法学院-通知公告", "category": "学术活动", "publish_time": "2026-11-02", "url": "http://law.uibe.edu.cn/xwzx/tzgg/2e5dbbbbd8534789ae5265f0371539bc.htm", "deadline": "2026-11-13", "event_time": "2026-11-26", "summary": "法学院学生法律沙龙报名11月13日截止，11月26日举办", "content": "学院概况\n院长寄语\n学院简介\n学系介绍\n学科建设\n组织机构\n历任院长\n院徽院训\n联系我们\n新闻快讯\n学院新闻\n媒体贸法\n学术活动\n视频中心\n师资队伍\n专任教师\n涉外院研究员\n外籍专家\n退休教师\n学者风采\n党建工作\n组织机构\n理论学习\n党建动态\n支部建设\n党务公开\n学术科研\n学术成果\n研究中心\n科研立项\n教务教学\n师德师风\n教务公告\n培养方案\n精品课程\n课程思政\n教学立项\n招生就业\n招生\n就业\n在职研修班\n国际交流\n交流动态\n合作院校\n合作项目\n校友工作\n校友风采\n校友活动\n校友名录\n沈冯基金\n涉外法治研究院\n经贸法律评论\nEnglish学校主页\nEnglish\n学校主页\n学院概况\n院长寄语\n学院简介\n学系介绍\n学科建设\n组织机构\n历任院长\n院徽院训\n联系我们\n新闻快讯\n学院新闻\n媒体贸法\n学术活动\n视频中心\n师资队伍\n专任教师\n涉外院研究员\n外籍专家\n退休教师\n学者风采\n党建工作\n组织机构\n理论学习\n党建动态\n支部建设\n党务公开\n学术科研\n学术成果\n研究中心\n科研立项\n教务教学\n师德师风\n教务公告\n培养方案\n精品课程\n课程思政\n教学立项\n招生就业\n招生\n就业\n在职研修班\n国际交流\n交流动态\n合作院校\n合作项目\n校友工作\n校友风采\n校友活动\n校友名录\n沈冯基金\n涉外法治研究院\n经贸法律评论\n新闻快讯\n学院新闻\n媒体贸法\n学术活动\n视频中心\n您所在的位置：首页-新闻快讯-通知公告\n“贸大法学院学生法律沙龙”第54期活动通知\n日期:2026-11-02|点击量:\n由对外经济贸易大学法学院、《贸大法学》编辑部主办的“贸大法学院学生法律沙龙”第54期活动拟于2026年11月26日（星期四）下午举行，欢迎我院研究生和本科生同学们积极参与。\n活动时间与地点：\n时间：2026年11月26日（星期四）下午13:30—15:00\n地点：宁远楼232\n主题：人工智能应用的就业替代影响：法律分析与回应\n活动形式：主题研讨\n首先发言人依次做主题发言展示；其次点评人针对每名主题发言人的发言进行点评和总结，主题发言人对点评予以回应；随后进入自由讨论，参与沙龙的其他同学向主题发言人提问或交流；最后主题发言人和点评人分别总结。主题研习的材料概要附后。\n沙龙报名截止时间：2026年11月13日（星期五）晚上24点。\n发送报名邮件时，请于邮件标题及正文写明：本科/硕士+年级+姓名+微信号+手机号。报名时不需要提交论文。\n论文提交截止时间：2026年11月23日（星期一）中午12点。\n咨询、报名和提交论文邮箱：uibetopic@163.com。\n本次沙龙将继续组织优秀论文评选，提交论文并现场参与沙龙的同学才能参与评奖。参与评奖的论文要求为：本科生论文不少于5000字，研究生论文不少于6000字（WORD统计最大字符数）。获奖论文将获得“贸大法学院学生法律沙龙优秀论文”证书（盖院章）。\n特别提醒：（1）不得以公开发表过的论文或参与过往届沙龙的论文提交本次沙龙。（2）请务必坚持原创，不得以任何AI工具写作论文。\n沙龙热忱欢迎我院所有同学前来参与，尤其欢迎同学们就此问题撰写专门的学术论文向《贸大法学》投稿。投稿邮箱：uibelawreview@aliyun.com。\n对外经济贸易大学法学院\n《贸大法学》编辑部\n2026年11月2日\n【主题材料】\n主题：人工智能应用的就业替代影响：法律分析与回应\n近日，国务院办公厅印发《关于适应人工智能技术发展助力构建就业友好型发展方式的意见》，将有效减缓人工智能应用就业替代影响设为目标，鼓励企业探索建立失业缓冲期制度，在大规模推广应用人工智能过程中提前告知受影响劳动者、提供转型转岗就业支持。从生产线上的智能设备到办公室里的智能助手，人工智能正在改变企业完成工作的方式。以客服工作为例，当机器主要负责常见问题的回复时，原有员工既有可能转向处理复杂问题，也有可能面临企业裁员的风险。同一种技术如何使用，既关系到企业的经营安排，也影响着广大劳动者的职业生涯。当企业借助技术提高效率时，劳动者能否适应岗位变化、分享发展收益，成为当前各方需要共同面对的问题。\n企业引入人工智能后，能否以原有岗位不再需要为由调岗、降薪或解除劳动合同？如果员工经过培训仍能承担新的工作，是否应当调整企业的处理方式，如何与现有的劳动法律规范相衔接？当一家企业的岗位调整成为整个行业的参考标准，培训与就业帮扶的成本，又应如何在企业、劳动者与政府之间分担？从具体处理是否合法，到不同方案能否帮助劳动者转型，这些问题为讨论人工智能应用的就业影响提供了不同的研究入口。延伸阅读可参考以下相关报道与评论：\n1.《国务院部署应对AI替岗，劳动者转型能获得什么政策支持？》\nhttps://www.bjnews.com.cn/detail/1793089174129810.html\n2.《壹时评：让“人机协同”跑赢“机器换人”》\nhttps://opinion.people.com.cn/n1/2026/1027/c223228-40822546.html\n3.《人工智能时代，如何减缓岗位替代？》\nhttps://m.gmw.cn/2026-10/27/content_1304579772.htm\n4.《界面快评｜应对AI“抢饭碗”，激励企业自觉建立失业缓冲期》\nhttps://www.jiemian.com/article/15240475.html\n5.《人工智能发展对标就业友好型发展方式》\nhttps://theory.gmw.cn/2026-10/16/content_39049402.htm\n欢迎大家结合人工智能应用中的岗位变化与劳动者转型实践，从劳动合同、算法管理、企业责任、就业促进与社会保障等不同角度展开研究，探索如何统筹协调技术进步、企业诉求、劳动者权益保障与经济社会稳定发展之间的关系。希望大家在贸大法学院的学术氛围中参与分享与沟通，感受不同观点的碰撞与交融，尽情展示贸大法律学子的才华！每期沙龙活动将在学院网站上予以报道，沙龙来稿或培育的优秀论文将在当年的《贸大法学》上公开发表。热忱期待全院同学们的关注和参与！\n版权所有：对外经济贸易大学法学院地址：北京市朝阳区惠新东街10号宁远楼7层邮编：100029邮箱：uibelaw@uibe.edu.cn；uibelaws@126.com"}, "dc19c15549edfdbf49658d646a0d7c1a": {"notice_id": "dc19c15549edfdbf49658d646a0d7c1a", "title": "教务处党支部与清华资管慕华教育党支部开展“人工智能赋能教育教学” 联学共建活动-部门动态-对外经济贸易大学教务处", "source": "教务处-部门动态", "category": "行政党务", "publish_time": "2026-11-02", "url": "http://jwc.uibe.edu.cn/bmdt/b024675fe5284257b38f1680ebaa805d.htm", "deadline": "", "event_time": "", "summary": "教务处党支部与清华资管慕华教育党支部开展联学共建活动", "content": "教务处|摄影：教务处|日期：2026-11-02|访问量：\nnull\nCopyRight©版权所有：对外经济贸易大学教务处，ALLRightsReserved\n北京市朝阳区惠新东街10号邮编：100029"}, "portal_10041395622174720": {"notice_id": "portal_10041395622174720", "title": "关于举办第四届全国大学生职业规划大赛校内选拔赛的通知", "source": "招生就业处", "category": "比赛竞赛", "publish_time": "2026-10-16", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=10041395622174720", "deadline": "2026-11-13", "event_time": "2026-10-01,2026-12-31", "summary": "面向本科生和研究生开展职业规划大赛校内选拔，11月13日报名截止", "content": "各学院：根据《教育部关于举办第四届全国大学生职业规划大赛的通知》（教学函〔2026〕2号）文件要求，强化高校生涯教育和就业指导，助力大学生增强职业规划意识，指导其通过学习实践提升综合素质和能力，及早做好就业准备，以择业新观念打开就业新天地，促进高质量充分就业。我校定于2026年10月至2026年12月举办第四届全国大学生职业规划大赛校内选拔赛。现将有关事项通知如下。一、大赛主题筑梦青春志在四方，规划启航职引未来。二、大赛时间2026年10月—2026年12月三、组织机构主办单位：招生就业处校内赛设立组委会，由校内就业指导老师、行业专家、校外就业指导专家组成，负责赛事评审工作，指导我校学生参赛。四、大赛内容（一）主体赛事1.成长赛道。面向本科非毕业年级（大一、大二、大三）学生，考察学生树立生涯发展理念并合理设定职业目标、围绕实现目标持续行动并不断调整的成长过程，通过学习实践提升综合素质和专业能力，体现正确的择业就业观念。2.就业赛道。面向本科高年级计划求职学生（大三、大四，不含已通过推免获得录取资格的学生）、全体第二学士学位学生和研究生。考察学生求职实战能力，个人综合素质、专业能力与目标职业的契合度，个人发展路径与就业市场需求的适应度。参赛学生可获得岗位录用意向。五、赛程材料要求参赛选手通过全国大学生职业规划大赛平台（以下简称大赛平台，网址：zgs.chsi.com.cn）进行报名，提交参赛材料。（一）成长赛道1.生涯发展报告：介绍设定职业目标的过程；实现职业目标的具体行动和成效；职业目标及行动的动态调整等（PDF格式，不超过10M，文字不超过2000字，图表不超过5张）。2.生涯发展展示（PPT格式，不超过50MB）。（二）就业赛道1.求职简历（PDF格式）。2.求职综合展示（PPT格式，不超过50MB）。3.辅助证明材料，包括实践、实习、获奖等证明材料（PDF格式，整合为单个文件，不超过10MB）。六、赛程安排大赛分学院选拔、校级复赛和校级决赛3个阶段。主要时间安排如下：（一）校级初赛所有报名参赛的选手均需在大赛平台（网址：zgs.chsi.com.cn）进行报名并提交参赛材料，在国家大赛平台登录页面可下载学生操作手册。各学院认真组织动员学生报名参赛，学生需通过国家大赛平台报名并提交参赛材料，同步提交至学院，学生参赛报名截止时间为2026年11月13日17:00。"}, "portal_8490918697406464": {"notice_id": "portal_8490918697406464", "title": "一周校园就业招聘和指导安排（2026.10.12-10.16）", "source": "招生就业处", "category": "就业实习", "publish_time": "2026-10-12", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=8490918697406464", "deadline": "", "event_time": "", "summary": "招生就业处发布一周校园招聘和指导活动安排，学生可参加", "content": "招生就业处一周校园就业招聘和指导安排（2026.10.12-10.16 主题为“中华文化知识大赛报名”，并扫码进入预赛群。五、联系方式学工部学生事务管理科娜老师，电话：64493295研工部综合事务科罗老师，电话：64492544港澳台事务办公室武老师，电话：64493219附件：2026年内地（大陆）高校港澳台学生中华文化知识大赛报名表.docx学工部/学生处/武装部党委研究生工作部港澳台事务办公室2026年10月9日"}, "portal_7156727772078080": {"notice_id": "portal_7156727772078080", "title": "关于举办首届智能应用创新大赛第二场专题培训的通知", "source": "网络安全和信息化处", "category": "比赛竞赛", "publish_time": "2026-10-08", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=7156727772078080", "deadline": "2026-10-30", "event_time": "2026-10-11", "summary": "全校师生参加智能应用创新大赛培训，报名10月30日截止", "content": "全体师生：我校首届智能应用创新大赛已于9月17日启动报名。为帮助师生熟悉赛事要求、掌握校级智能体开发平台操作，更好地备赛参赛，网络安全和信息化处特组织系列专题培训。现将第二场培训安排通知如下：一、培训时间2026年10月11日（周日）9:30—11:30二、培训形式本次培训采用#腾讯会议#形式线上举办，会议号：171-688-917。三、培训内容“工作流核心节点讲解+MCP插件介绍+进阶智能体搭建”——掌握进阶能力，搭建“能做事”的智能体四、重要提示1.大赛报名截止时间为2026年10月30日，尚未报名的团队请及时登录【大赛官网】（https://aihome.uibe.edu.cn/competitionIndex）完成线上报名。2.已报名的师生可微信扫描下方二维码，激活智能体开发平台的开发者权限（已激活师生无需重复操作），提交信息后待审核开通。3.本次大赛配套上线“智能应用大赛服务助手”，可解答大赛报名、培训、智能体搭建等相关问题，请点击链接或扫码访问：https://aihome.uibe.edu.cn/shareBotChat/dalkoq4a6jhs72plmrdg4.赛事相关信息将在赛事官方QQ群内发布，请尚未加入赛事群的师生尽快入群。赛事官方QQ群：1121090025（入群备注学号/教工号+姓名）网络安全和信息化处2026年10月8日"}, "portal_7150401922785280": {"notice_id": "portal_7150401922785280", "title": "关于办理2026-2027学年校园地国家助学贷款的通知", "source": "学工部", "category": "奖助学金", "publish_time": "2026-10-08", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=7150401922785280", "deadline": "2026-10-12", "event_time": "", "summary": "家庭经济困难学生需10月12日前提交汇总表并10月14-15日现场办理助学贷款", "content": "各培养单位、相关学生：根据《教育部等四部门关于调整完善助学贷款有关政策的通知》（财教〔2023〕4号）要求，结合我校实际，现组织开展2026-2027学年校园地国家助学贷款办理工作。相关事项通知如下：一、办理对象申请校园地国家助学贷款的学生须为经过本学年家庭经济困难认定的本科生、研究生、预科生。二、办理安排1. 前序工作：为保证本学年申请新办校园地国家助学贷款学生顺利完成贷款签约，需先开展银行卡开卡工作，由经办行中国银行工作人员前来学校，现场办理开卡及申请校园地国家助学贷款。根据经办行要求，开卡前需在银行系统核验开卡资格。请所有申请办理校园地国家助学贷款的学生（含新办和续贷）填写汇总表（附件1），并扫码加入“2026年校园地国家助学贷款办理群”（附件2）。2.资格核验：由银行核验学生开卡资格，如有问题会直接跟学生取得联系，为学生线下开卡做好准备，确保办理当天的助学贷款申请材料填写及签约事宜顺利进行。3.现场办理：请全体办理校园地国家助学贷款的学生（含首贷和续贷）于10月14日（周三）、15日（周四）9:00-12:00、13:00-16:30前往求真楼202A现场办理。4.到场需携带：①本人最新身份证；②学生证或录取通知书（显示学制）；③手机（确保手机号为本人实名制手机号，并提前下载“中国银行”手机APP）。三、办理流程 四、工作要求1.根据最新政策文件精神，学生申请的国家助学贷款应优先用于支付在校期间学费和住宿费，超出部分可用于弥补日常生活费用。请各学院通知相关学生提前了解政策。往年线下办理过校园地国家助学贷款的学生如有提额需要，需线上申请，具体流程咨询经办银行即可。2.已申请生源地助学贷款的学生不得同时再申请校园地国家助学贷款。3.请各培养单位于10月12日（周一）上午10点前，本研分别以学院/研究院为单位汇总提交附件1的汇总表电子版，本科生汇总表发送至uibexszz@uibe.edu.cn；研究生汇总表发送至uibeygbjz@uibe.edu.cn。4.请相关学生提前安排好时间，及时办理并关注群内通知，未入群的同学请通过学院联系资助中心及时进群。 咨询电话：010-64688699，010-64689535（中国银行）010-64494008（本科生、预科生），010-64496803（研究生） 附件1：2026年校园地助学贷款申请信息汇总表.xlsx"}, "portal_7145822500589568": {"notice_id": "portal_7145822500589568", "title": "关于启动2027年大学生创新训练计划申报工作的通知", "source": "创新创业中心", "category": "科研项目", "publish_time": "2026-10-09", "url": "https://i.uibe.edu.cn/tp_up/view?m=up#act=up/pim/showpim&id=7145822500589568", "deadline": "2026-10-30", "event_time": "", "summary": "全日制在读本科生申报2027年大学生创新训练计划，10月30日17:00截止", "content": "各学院、各位同学：为深入贯彻落实《国务院办公厅关于进一步支持大学生创新创业的指导意见》《国务院办公厅关于深化高等学校创新创业教育改革的实施意见》等文件要求，进一步深化新发展阶段高校创新创业教育改革，根据教育部、北京市相关工作要求，现启动我校2027年大学生创新训练计划申报立项工作，有关事项通知如下：一、申报项目类型1.创新训练项目：本科生个人或团队在导师指导下，自主完成创新性研究项目设计、研究条件准备和项目实施、研究报告撰写、成果(学术)交流等工作。创新训练项目可以是具有较强创新特色的概念、产品或服务设计（如：金融产品、文化产品、学习方法等）、学术理论构建、管理制度设计、校园文化活动策划等。2.创业训练项目：本科生团队在导师指导下，团队中每个学生在项目实施过程中扮演一个或多个具体角色，完成商业计划书编制、可行性研究、企业模拟运行、撰写创业报告等工作。与创新训练项目相比，创业训练项目更侧重商业运作过程。3.创业实践项目：学生团队在学校导师和企业导师共同指导下，采用创新训练项目或创新性实验等成果，提出具有市场前景的创新性产品或服务，以此为基础开展创业实践活动。与创业训练相比，创业实践项目更侧重真实落地、注册成立公司情况以及实效。二、申报原则及要求1.申报人员须为我校全日制在读本科生。每名学生每年度最多申报1个项目，每个项目限1名负责人，项目团队人数不少于3人，不超过10人（含负责人）；2.申报项目须积极报名参加学校组织的各类创新创业大赛，提升项目质量；3.立项后原则上不得终止，如果项目在非客观原因情况下终止，将取消负责人未来申报资格，并视情况对团队成员未来申报资格进行严格考察，没有终止记录及确因客观原因终止的项目，负责人及成员可正常申报后续年度的项目；4.项目立项后，创新创业中心将定期组织项目进度检查，负责人须按要求填报相关检查材料，不按要求参加检查的项目，创新创业中心有权对项目进行中止；5.已申报过的往届项目不得重复申报。三、申报及评审程序1.申报时间：即日起至10月30日下午17：00。2.申报方式：项目负责人登录贸创云平台http://202.204.175.120/（推荐使用360浏览器）填报项目及成员信息（密码：Uibe@身份证后八位，或身份证后八位，再或Uibe@123456）。根据项目属性选择“创新训练项目”-选A/“创业训练项目”-选B/“创业实践项目”"}}};</script>
<script>
/* ================== 工具 ================== */
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = DATA.today;
const LS = "uibe.static.v1.";

function dayDiff(d){                       // 距离今天还有几天
  if(!d) return null;
  const a = new Date(d+"T00:00:00"), b = new Date(TODAY+"T00:00:00");
  return Math.round((a-b)/86400000);
}
function dlTag(d){
  const n = dayDiff(d);
  if(n===null) return "";
  if(n<0) return "已过期";
  if(n===0) return "🔴 今天截止";
  if(n<=3) return `🔴 还有 ${n} 天`;
  if(n<=7) return `🟠 还有 ${n} 天`;
  return `还有 ${n} 天`;
}
/* 活动时间已过 → 明确写"已结束"，别让人以为还能参加 */
function eventLabel(ev){
  if(!ev) return "";
  const m = String(ev).match(/\d{4}-\d{2}-\d{2}/);
  if(m){
    const n = dayDiff(m[0]);
    if(n!==null && n<0) return `⏰ 活动已于 ${m[0]} 结束`;
  }
  return `⏰ ${ev}`;
}
function isVideoOrNews(){ return false; }

/* ================== 状态 ================== */
const S = {
  no:null, page:"dashboard", section:null,
  calY:Number(TODAY.slice(0,4)), calM:Number(TODAY.slice(5,7)), calSel:null,
  open:{}, msg:""
};
let U = null;      // 当前用户快照
let ST = null;     // 本地状态

/* 存储降级：某些环境（Safari 打开本地文件、微信内置浏览器、无痕模式）
   访问 localStorage 会直接抛异常，若不兜底会导致整页白屏 */
const __MEM = {};
const LSOK = (function(){
  try { localStorage.setItem("__probe__","1"); localStorage.removeItem("__probe__"); return true; }
  catch(e){ return false; }
})();
function lsGet(k){ try { return LSOK ? localStorage.getItem(k) : (__MEM[k]||null); } catch(e){ return __MEM[k]||null; } }
function lsSet(k,v){ try { if(LSOK) localStorage.setItem(k,v); else __MEM[k]=v; } catch(e){ __MEM[k]=v; } }
function lsDel(k){ try { if(LSOK) localStorage.removeItem(k); else delete __MEM[k]; } catch(e){ delete __MEM[k]; } }

function defaultState(u){
  return {
    reads: (u.reads||[]).slice(),
    follows: (u.favs||[]).map(x=>x.notice_id),
    blocks: (u.trash||[]).map(x=>x.notice_id),
    todos: (u.todos||[]).map(t=>({...t}))
  };
}
function loadState(no){
  const raw = lsGet(LS+no);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return defaultState(DATA.users[no]);
}
function saveState(){ if(S.no) lsSet(LS+S.no, JSON.stringify(ST)); }

/* ================== 数据派生 ================== */
const idx = (id)=>DATA.index[id]||{title:"（通知已移除）",source:"",category:"",publish_time:"",url:"",deadline:"",event_time:"",content:""};
const full = (it)=>({...idx(it.notice_id), ...it});
const blocked = (id)=>ST.blocks.includes(id);
const followed = (id)=>ST.follows.includes(id);
const isRead = (id)=>ST.reads.includes(id);

function visible(list){ return (list||[]).filter(x=>!blocked(x.notice_id)); }
function favList(){ return ST.follows.map(id=>({notice_id:id})); }
function todoOpen(){ return ST.todos.filter(t=>!t.done); }

/* 日历条目：关注的活动（有截止日、未过期）+ 未完成待办 */
function datedItems(){
  const out = [];
  for(const id of ST.follows){
    const n = idx(id);
    const left = dayDiff(n.deadline);
    if(n.deadline && left!==null && left>=0) out.push({kind:"notice", ...n});
  }
  for(const t of ST.todos){
    const left = dayDiff(t.due);
    if(!t.done && t.due && left!==null && left>=0) out.push({kind:"todo", ...t, deadline:t.due});
  }
  return out.sort((a,b)=> (a.deadline||"").localeCompare(b.deadline||""));
}
function dueSoon(){
  return datedItems().filter(x=>{ const l=dayDiff(x.deadline); return l!==null && l>=0 && l<=3; });
}

/* ================== 渲染：卡片 ================== */
function chipOf(level){
  if(level==="重点") return `<span class="chip key">🔥 重点</span>`;
  if(level==="推荐") return `<span class="chip rec">⭐ 推荐</span>`;
  return `<span class="chip normal">普通</span>`;
}
function noticeCard(it){
  const n = full(it);
  const id = n.notice_id;
  const fav = followed(id), blk = blocked(id), rd = isRead(id);
  const open = !!S.open[id];
  const hasBody = (n.content||"").length>60;
  const meta = [];
  if(n.source) meta.push(`来源 <b>${esc(n.source)}</b>`);

/* 本地时间字符串（用于记录"哪天勾选完成"） */
function nowLocal(){
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
       + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

/* 某一天要截止的事：关注的通知 + 未完成待办 */
function dayPending(date){
  const out = [];
  for(const id of ST.follows){
    const n = idx(id);
    if(n.deadline === date) out.push({kind:"notice", ...n});
  }
  for(const t of ST.todos){
    if(!t.done && t.due === date) out.push({kind:"todo", ...t, deadline:t.due});
  }
  return out;
}
/* 某一天完成的事：按勾选完成的那天归组，历史长期保留 */
function dayDone(date){
  return ST.todos.filter(t=>t.done && String(t.done_at||"").slice(0,10)===date);
}
function doneMapAll(){
  const m = {};
  for(const t of ST.todos){
    if(!t.done) continue;
    const d = String(t.done_at||"").slice(0,10);
    if(d) (m[d] = m[d]||[]).push(t);
  }
  return m;
}

/* 当天详情弹窗 */
function dayModal(date){
  if(!date) return "";

  const wd = ["日","一","二","三","四","五","六"][new Date(date+"T00:00:00").getDay()];

  const rowsP = pend.map(it=>{

    return `<div class="day-row">${isTodo?"📝 ":""}<b>${esc(it.title)}</b>${tag}${link}

  const rowsD = done.map(t=>{

  return `<div class="modal" data-act="cal-mask">

      ${(!pend.length && !done.length)?`<div class="day-empty">这一天没有截止事项，也没有完成记录。</div>`:""}
    </div>

/* 从标题里兜底解析日期区间，如「（2026.10.12-10.16）」 */
function titleDates(title){
  const re = /(20\d{2})\s*[.\-/年]\s*(\d{1,2})\s*[.\-/月]\s*(\d{1,2})\s*日?\s*[-~—–－至到]+\s*(?:(20\d{2})\s*[.\-/年]\s*)?(\d{1,2})\s*[.\-/月]\s*(\d{1,2})\s*日?/g;
  const out = [];
  const pad = (v)=>String(v).padStart(2,"0");
  let m;
  while((m = re.exec(String(title||""))) !== null){
    const y1=+m[1], mo1=+m[2], d1=+m[3];
    const y2=m[4]?+m[4]:y1, mo2=+m[5], d2=+m[6];
    if(mo1<1||mo1>12||d1<1||d1>31||mo2<1||mo2>12||d2<1||d2>31) continue;
    const a = `${y1}-${pad(mo1)}-${pad(d1)}`, b = `${y2}-${pad(mo2)}-${pad(d2)}`;
    if(b>=a){ out.push(a, b); }
  }
  return out.sort();
}

/* 关注项是否已过期：截止日已过，或活动结束且没有仍开放的截止 */
function isExpired(n){
  if(!n) return false;
  if(n.deadline){
    const d = dayDiff(n.deadline);
    if(d!==null && d<0) return true;
  }
  if(n.event_time){
    const ds = String(n.event_time).match(/\d{4}-\d{2}-\d{2}/g);
    if(ds && ds.length){
      const last = ds.slice().sort()[ds.length-1];
      const open = n.deadline && dayDiff(n.deadline)!==null && dayDiff(n.deadline)>=0;
      if(!open && dayDiff(last)<0) return true;
    }
  }
  if(!n.deadline){
    const td = titleDates(n.title);
    if(td.length && dayDiff(td[td.length-1])<0) return true;
  }
  return false;
}

    ["阶段", U.stage], ["学院", U.college], ["专业", U.major], ["专业方向", U.major_dir],
    ["关注方向", (U.interests||[]).join("、")], ["目标", (U.goal||[]).join("、")],
    ["偏好", (U.preferences||[]).join("、")], ["自定义关键词", (U.custom_keywords||[]).join("、")]
  ].filter(r=>r[1]);
  return `<h2 class="page-title">👤 用户中心</h2>
    <div class="page-sub">这是生成页面时你的画像，AI 就是按它给每条通知打分的</div>
    <div class="card">
      ${rows.map(([k,v])=>`<div class="todo" style="border-bottom:1px dashed #eef2f8">
        <div class="t-title" style="flex:0 0 118px;color:#5b7089;font-weight:600">${esc(k)}</div>
        <div style="flex:1">${esc(v)}</div></div>`).join("")}
    </div>
    <div class="warn">⚠️ 静态版不支持修改画像：这里的数据是生成页面那一刻的快照。想改画像，请在 <b>http://127.0.0.1:8503</b> 的「用户中心」修改，改完会重新用大模型匹配，我再重新生成这个页面。</div>`;
}

/* ================== 路由 ================== */
const PAGES = {
  dashboard: renderDashboard, calendar: renderCalendar, todos: renderTodos,
  favorites: renderFavorites, trash: renderTrash, profile: renderProfile
};
const NAVS = [
  ["dashboard","🏠","首页"], ["calendar","📅","截止日历"], ["todos","📝","我的待办"],
  ["favorites","⭐","我的关注"], ["trash","🗑️","回收箱"], ["profile","👤","用户中心"]
];

function futureDate(n){
  const d = new Date(TODAY+"T00:00:00"); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function renderSidebar(){
  $("#who").innerHTML = `<b>${esc(U.name)}</b> · ${esc(U.identity||"")}<br>${esc(U.college||"")}`;
  $("#gen").innerHTML = `数据更新于 ${esc(DATA.generated_at)}<br>近 ${DATA.window_days} 天 · 共 ${Object.keys(DATA.index).length} 条通知`;
  $("#nav").innerHTML = NAVS.map(([k,e,t])=>
    `<button data-act="nav" data-page="${k}" class="${S.page===k?"on":""}">${e} ${t}</button>`).join("");
}

function render(){
  if(!S.no){ renderLogin(); return; }
  $("#side").style.display = "";
  renderSidebar();
  $("#main").innerHTML = PAGES[S.page]();
  window.scrollTo({top:0,behavior:"instant"});
}

function renderLogin(){
  const accounts = Object.values(DATA.users);
  $("#side").style.display = "none";
  $("#main").innerHTML = `<div class="login-wrap">
    <div class="login-card">
      <h1>🎓 小惠同学</h1>
      <p class="sub">对外经济贸易大学 · 演示版（单文件 HTML）</p>
      <div class="field"><label class="f">学号</label><input type="text" id="lg-no" placeholder="请输入学号"></div>
      <div class="field"><label class="f">密码</label><input type="password" id="lg-pw" value="123456"></div>
      <button class="primary" style="width:100%" data-act="login">进入</button>
      <div class="err" id="lg-err"></div>
      <div class="quick">
        ${accounts.map(a=>`<button data-act="quick" data-no="${esc(a.student_no)}">${esc(a.name)} · ${esc(a.student_no)}</button>`).join("")}
      </div>
      <div class="demo-tip">演示密码统一为 <b>123456</b>，点上面的账号可直接进入。<br>
      本页是离线快照，关注 / 待办等操作保存在你自己的浏览器里。</div>
    </div>
  </div>`;
}

/* ================== 动作 ================== */
function loginAs(no){
  if(!DATA.users[no]) return;
  S.no = no; U = DATA.users[no]; ST = loadState(no);
  S.page = "dashboard"; S.section = null; S.open = {}; S.calSel = null;
  lsSet(LS+"last", no);
  render(); saveState();
}

document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  if(act==="login"){
    const no = ($("#lg-no").value||"").trim();
    const pw = ($("#lg-pw").value||"").trim();
    if(!DATA.users[no]){ $("#lg-err").textContent = "学号不存在（可点下方演示账号）"; return; }
    if(pw!=="123456"){ $("#lg-err").textContent = "演示密码为 123456"; return; }
    loginAs(no); return;
  }
  if(act==="quick"){ loginAs(el.dataset.no); return; }
  if(act==="logout"){
    lsDel(LS+"last");
    S.no=null; U=null; ST=null; S.page="dashboard"; S.section=null; render(); return;
  }
  if(act==="nav"){
    S.page = el.dataset.page; S.section = null; render(); return;
  }
  if(act==="tile"){
    const t = el.dataset.target;
    if(t==="todos"){ S.page="todos"; S.section=null; } else { S.section = t; S.page="dashboard"; }
    render(); return;
  }
  if(act==="back"){ S.section=null; render(); return; }

  if(act==="follow"){
    if(followed(id)){ ST.follows = ST.follows.filter(x=>x!==id); }
    else{
      ST.follows.push(id);
      ST.blocks = ST.blocks.filter(x=>x!==id);
    }
    saveState(); render(); return;
  }
  if(act==="block"){
    if(blocked(id)){ ST.blocks = ST.blocks.filter(x=>x!==id); }
    else{
      ST.blocks.push(id);
      ST.follows = ST.follows.filter(x=>x!==id);
    }
    saveState(); render(); return;
  }
  if(act==="read"){
    ST.reads = isRead(id) ? ST.reads.filter(x=>x!==id) : ST.reads.concat([id]);
    saveState(); render(); return;
  }
  if(act==="body"){ S.open[id] = !S.open[id]; render(); return; }
  if(act==="expired"){ S.open["__expired__"] = !S.open["__expired__"]; render(); return; }
  if(act==="unfav"){
    ST.follows = ST.follows.filter(x=>x!==id);
    saveState(); render(); return;
  }

  if(act==="restore"){
    ST.blocks = ST.blocks.filter(x=>x!==id);
    if(!followed(id)) ST.follows.push(id);
    saveState(); render(); return;
  }
  if(act==="purge"){ ST.blocks = ST.blocks.filter(x=>x!==id); saveState(); render(); return; }

  if(act==="cal"){
    let m = S.calM + Number(el.dataset.step), y = S.calY;
    if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
    S.calM=m; S.calY=y; S.calSel=null; render(); return;
  }
  if(act==="cal-day"){ S.calSel = el.dataset.date; render(); return; }
  if(act==="cal-close"){ S.calSel = null; render(); return; }
  if(act==="cal-mask"){ if(e.target===el){ S.calSel = null; render(); } return; }

  if(act==="todo-add"){
    const title = ($("#td-title").value||"").trim();
    if(!title){ $("#td-title").focus(); return; }
    ST.todos.push({
      id: "t"+Date.now(),
      title,
      due: ($("#td-due").value||"").trim(),
      note: ($("#td-note").value||"").trim(),
      done:false
    });
    saveState(); render(); return;
  }
  if(act==="todo-done"){
    const t = ST.todos.find(x=>x.id===id);
    if(t){ t.done = !t.done; t.done_at = t.done ? nowLocal() : ""; saveState(); render(); }
    return;
  }
  if(act==="todo-del"){
    ST.todos = ST.todos.filter(x=>x.id!==id); saveState(); render(); return;
  }
});

/* 回车登录 */
document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape" && S.calSel){ S.calSel=null; render(); return; }
  if(e.key==="Enter" && e.target && (e.target.id==="lg-no"||e.target.id==="lg-pw")){
    const b = document.querySelector('[data-act="login"]'); if(b) b.click();
  }
});

/* 启动：支持 ?u=学号&p=页面 直达（也可记住上次登录的账号） */
window.addEventListener("error", function(ev){
  var box = document.getElementById("boot-error");
  if(box) return;
  box = document.createElement("div");
  box.id = "boot-error";
  box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;background:#fff3f3;"
    + "border:1px solid #f0c2c2;color:#8a2b2b;border-radius:12px;padding:12px 14px;"
    + "font:13px/1.6 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;"
    + "box-shadow:0 8px 24px rgba(0,0,0,.12)";
  box.innerHTML = "<b>页面脚本执行出错</b><br>如果页面空白，请用 Chrome / Edge / Safari 浏览器打开本文件，"
    + "不要在微信、QQ 里直接预览。<br><span style='color:#a06a6a'>" + (ev.message||"") + "</span>";
  document.body.appendChild(box);
});

(function boot(){
  try {
    const q = new URLSearchParams(location.search);
    render();
    const qu = q.get("u");
    const last = lsGet(LS+"last");
    if(qu && DATA.users[qu]) loginAs(qu);
    else if(last && DATA.users[last]) loginAs(last);
    const qp = q.get("p");
    if(S.no && qp && PAGES[qp]){ S.page = qp; S.section = null; render(); }
  } catch(e){
    document.getElementById("main").innerHTML =
      "<div class='card'><h3 class='sec'>页面加载失败</h3><p>请改用 Chrome / Edge / Safari 打开本文件。"
      + "<br><span style='color:#8a2b2b'>" + (e && e.message ? e.message : e) + "</span></p></div>";
  }
})();
</script>
</body>
</html>
